<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>LUMEN TERRITORY | Lumenium 会員限定</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#070a16; color:#f5f7fb; overflow:hidden;
    font-family:'Zen Kaku Gothic New','Hiragino Sans',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  }
  #wrap { position:fixed; inset:0; }
  #cv { display:block; width:100%; height:100%; touch-action:none; }

  .top {
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:10px; padding:12px 16px;
    background:linear-gradient(180deg, rgba(7,10,22,0.82), rgba(7,10,22,0));
    pointer-events:none;
  }
  .top > * { pointer-events:auto; }
  .top a {
    color:rgba(245,247,251,0.72); font-size:12px; text-decoration:none;
    border:1px solid rgba(245,247,251,0.18); border-radius:999px; padding:6px 12px;
  }
  .top a:hover { color:#fff; border-color:rgba(245,247,251,0.5); }
  .badge {
    font-size:9.5px; font-weight:800; letter-spacing:0.18em;
    background:linear-gradient(135deg,#4f46e5,#06b6d4); color:#fff;
    padding:5px 11px; border-radius:999px;
  }
  .btns { margin-left:auto; display:flex; gap:8px; }
  .btns button {
    background:rgba(0,0,0,0.4); border:1px solid rgba(245,247,251,0.2);
    color:rgba(245,247,251,0.78); border-radius:10px; padding:6px 12px;
    font-size:12px; font-family:inherit; cursor:pointer;
  }
  .btns button:hover { color:#fff; border-color:rgba(245,247,251,0.5); }

  /* HUD */
  #hud {
    position:fixed; left:16px; bottom:16px; z-index:15;
    display:flex; flex-direction:column; gap:8px; pointer-events:none;
  }
  .panel {
    background:rgba(10,13,28,0.72); border:1px solid rgba(245,247,251,0.12);
    border-radius:12px; padding:10px 12px; backdrop-filter:blur(6px);
  }
  #board-list { display:flex; flex-direction:column; gap:6px; min-width:186px; }
  .row { display:flex; align-items:center; gap:8px; font-size:12px; }
  .row .swatch { width:11px; height:11px; border-radius:3px; flex:none; }
  .row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .pc { font-variant-numeric:tabular-nums; font-weight:800; }
  .row.me .nm { color:#fff; }
  .row.dead { opacity:0.4; }
  .bar { height:3px; border-radius:2px; background:rgba(255,255,255,0.09); overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; border-radius:2px; }

  #clock {
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:15;
    font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;
    letter-spacing:0.04em; text-shadow:0 2px 10px rgba(0,0,0,0.7); pointer-events:none;
  }
  #clock.warn { color:#fca5a5; }
  #mini {
    position:fixed; right:16px; bottom:16px; z-index:15;
    display:block; width:150px; height:150px;
    border-radius:12px; border:1px solid rgba(245,247,251,0.14);
    background:rgba(10,13,28,0.72);
  }
  #toast {
    position:fixed; left:50%; top:58px; transform:translateX(-50%); z-index:16;
    font-size:13px; font-weight:700; padding:7px 14px; border-radius:999px;
    background:rgba(10,13,28,0.85); border:1px solid rgba(245,247,251,0.16);
    opacity:0; transition:opacity 0.25s ease; pointer-events:none; white-space:nowrap;
  }
  #toast.on { opacity:1; }

  /* Overlays */
  .overlay {
    position:fixed; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:14px; padding:24px;
    background:radial-gradient(ellipse 70% 60% at 50% 45%, rgba(20,24,56,0.94), rgba(5,7,18,0.97));
  }
  .overlay[hidden] { display:none; }
  .overlay h1 {
    font-size:clamp(26px,5vw,42px); font-weight:800; letter-spacing:0.06em;
    background:linear-gradient(135deg,#fff,#a5b4fc 55%,#67e8f9);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .overlay .sub { font-size:10.5px; letter-spacing:0.36em; color:#67e8f9; }
  .overlay p { font-size:13.5px; line-height:2; color:rgba(245,247,251,0.72); max-width:560px; }
  .overlay kbd {
    display:inline-block; padding:1px 7px; margin:0 1px; border-radius:6px;
    border:1px solid rgba(245,247,251,0.28); font-size:12px; font-family:inherit;
  }
  .overlay button {
    background:linear-gradient(135deg,#4f46e5,#3b82f6,#06b6d4); color:#fff;
    border:none; border-radius:12px; padding:14px 42px; margin-top:4px;
    font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; letter-spacing:0.04em;
  }
  .overlay button:hover { transform:translateY(-1px); }
  .levels { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .levels button {
    margin:0; padding:10px 16px; min-width:150px;
    display:flex; flex-direction:column; gap:3px; align-items:center;
    background:rgba(255,255,255,0.05); border:1px solid rgba(245,247,251,0.18);
    color:rgba(245,247,251,0.72); font-size:14px; font-weight:700; border-radius:12px;
  }
  .levels button span { font-size:10.5px; font-weight:400; color:rgba(245,247,251,0.45); }
  .levels button[aria-pressed="true"] {
    background:linear-gradient(135deg,rgba(79,70,229,0.5),rgba(6,182,212,0.4));
    border-color:rgba(165,180,252,0.7); color:#fff;
  }
  .levels button[aria-pressed="true"] span { color:rgba(255,255,255,0.8); }

  #count3 {
    position:fixed; inset:0; z-index:25; display:none;
    align-items:center; justify-content:center; pointer-events:none;
    font-size:clamp(64px,14vw,132px); font-weight:800; color:#fff;
    text-shadow:0 0 40px rgba(79,70,229,0.9), 0 6px 20px rgba(0,0,0,0.8);
  }
  #count3.on { display:flex; }

  #pad {
    position:fixed; right:14px; bottom:14px; z-index:18; display:none;
    width:174px; height:174px;
  }
  body.touch #pad { display:block; }
  #pad button {
    position:absolute; width:58px; height:58px; padding:0;
    background:rgba(10,13,28,0.66); border:1px solid rgba(245,247,251,0.22);
    color:rgba(245,247,251,0.86); border-radius:14px;
    font-size:20px; font-family:inherit; line-height:1;
  }
  #pad button:active { background:rgba(79,70,229,0.55); color:#fff; }
  #pad .up { left:58px; top:0; }
  #pad .left { left:0; top:58px; }
  #pad .right { left:116px; top:58px; }
  #pad .down { left:58px; top:116px; }
  /* With a pad in the corner the map has to move, and the score panel shrinks. */
  body.touch #mini { top:64px; right:12px; bottom:auto; width:112px; height:112px; }
  body.touch #hud { bottom:12px; left:12px; }
  body.touch #board-list { min-width:138px; padding:8px 10px; }

  .result { display:flex; flex-direction:column; gap:7px; min-width:290px; }
  .result .row { font-size:13.5px; padding:7px 12px; border-radius:10px; background:rgba(255,255,255,0.05); }
  .result .row.me { background:rgba(79,70,229,0.28); }
  .result .rk { width:22px; font-weight:800; color:rgba(245,247,251,0.6); }

  @media (max-width:760px) {
    #hud { left:10px; bottom:10px; }
    #board-list { min-width:150px; }
    .row { font-size:11px; }
    #mini { right:10px; bottom:10px; }
    #clock { font-size:19px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
</div>

<div class="top">
  <a href="/">← lumenium.net</a>
  <span class="badge">MEMBERS ONLY</span>
  <span class="btns">
    <button id="pauseBtn" type="button">❚❚</button>
    <button id="muteBtn" type="button">🔊</button>
  </span>
</div>

<div id="clock">2:00</div>
<div id="toast"></div>
<div id="count3"></div>

<div id="pad" aria-hidden="true">
  <button class="up" type="button" data-d="3">▲</button>
  <button class="left" type="button" data-d="2">◀</button>
  <button class="right" type="button" data-d="0">▶</button>
  <button class="down" type="button" data-d="1">▼</button>
</div>

<div id="hud">
  <div class="panel" id="board-list"></div>
</div>
<canvas id="mini" width="150" height="150"></canvas>

<div class="overlay" id="startOv">
  <h1>LUMEN TERRITORY</h1>
  <div class="sub">MEMBERS EXCLUSIVE</div>
  <p>
    自分の色の外に出ると<b>線</b>が伸びます。自分の陣地に戻ると、<b>囲んだ内側がすべて自分のもの</b>になります。<br>
    線に触れられると1機失い、<b>陣地が外側から半分</b>削られます（残機3）。相手の線を横切れば、その相手を脱落させられます。<br>
    2分後、いちばん広い陣地を持っていた者が勝ち。
  </p>
  <p style="font-size:12.5px;color:rgba(245,247,251,0.55)">
    操作：<kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> または <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>　スマホは画面右下の十字キー、またはスワイプ
  </p>
  <div class="levels" id="levels">
    <button type="button" data-lv="easy">やさしい<span>相手はゆっくり・あまり狙ってこない</span></button>
    <button type="button" data-lv="normal">ふつう<span>互角</span></button>
    <button type="button" data-lv="hard">つよい<span>相手が速く、遠くからでも狙ってくる</span></button>
  </div>
  <button id="startBtn" type="button">はじめる</button>
</div>

<div class="overlay" id="endOv" hidden>
  <h1 id="endTitle">RESULT</h1>
  <div class="sub" id="endSub"></div>
  <div class="result" id="endList"></div>
  <button id="againBtn" type="button">もう一度</button>
</div>

<script>
(function () {
  'use strict'

  // ---------------------------------------------------------------- board
  // A grid of cells. `owner` says who holds each cell; `trail` marks the line
  // a player is currently drawing outside their own ground. Two flat typed
  // arrays rather than objects: the fill runs over every cell and wants to be
  // a tight loop.
  // 72 rather than 92. At 92 a full round left two thirds of the board empty
  // and the four of you rarely met, which is most of the game.
  var W = 72, H = 72, N = W * H
  var owner = new Uint8Array(N)
  var trail = new Uint8Array(N)
  var scratch = new Uint8Array(N)
  var stack = new Int32Array(N)

  var COLORS = [
    null,
    { base: '#22d3ee', deep: '#0e7490', name: 'あなた' },
    { base: '#a78bfa', deep: '#5b21b6', name: 'ミナト' },
    { base: '#fbbf24', deep: '#b45309', name: 'ソラ' },
    { base: '#fb7185', deep: '#9f1239', name: 'ハル' }
  ]

  var DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]
  var SPEED = 7.4          // cells per second, for the person
  var ROUND_MS = 120000

  // One setting was one game. The levers are how fast a rival moves relative
  // to you, how far it looks for a line to cut, and how often it bothers.
  var LEVELS = {
    easy:   { label: 'やさしい', bot: 0.82, hunt: 11, aggro: 0.45 },
    normal: { label: 'ふつう',   bot: 1.00, hunt: 17, aggro: 0.88 },
    hard:   { label: 'つよい',   bot: 1.14, hunt: 23, aggro: 1.00 }
  }
  var level = 'normal'
  try { if (LEVELS[localStorage.getItem('lum_territory_diff')]) level = localStorage.getItem('lum_territory_diff') } catch (_) {}

  // Three rivals that all played the same way read as one opponent with three
  // markers. Each now leans somewhere: what it does when it is safe at home.
  var STYLES = [
    { key: 'guard',  tag: '慎重', out: [3, 6],  hunt: 0.55, aggro: 0.5 },
    { key: 'hunter', tag: '狩り', out: [4, 8],  hunt: 1.45, aggro: 1.35 },
    { key: 'grower', tag: '拡大', out: [8, 16], hunt: 0.7,  aggro: 0.6 }
  ]
  var players = []
  var me = null
  var running = false, paused = false, over = false
  var startedAt = 0, lastFrame = 0, pausedMs = 0, pausedAt = 0
  var kills = 0
  var flash = null       // cells just taken, lit briefly so a capture registers
  var shakeUntil = 0     // a hit you can feel
  var danger = 0         // 0..1, how close the nearest threat is to your line

  var idx = function (x, y) { return y * W + x }
  var inBounds = function (x, y) { return x >= 0 && y >= 0 && x < W && y < H }

  // ---------------------------------------------------------------- setup
  function makePlayer(id, human) {
    return {
      id: id, human: !!human, name: COLORS[id].name,
      cx: 0, cy: 0, dir: 0, next: 0, t: 0,
      alive: true, area: 0, trailCells: [], respawnAt: 0,
      lives: human ? 3 : 0, plan: [], style: STYLES[0]
    }
  }

  function base(p, cx, cy) {
    p.cx = cx; p.cy = cy; p.t = 0
    // Bots may start facing anywhere; the person always starts heading right,
    // so their first key press is never a reversal into the direction they are
    // already travelling — which is ignored, and looks like a dropped input.
    p.dir = p.human ? 0 : (Math.random() * 4) | 0
    p.next = p.dir
    // 7x7 rather than 5x5: the way home is the hard part of this game, and a
    // two-cell margin either side of the centre line makes the first minute a
    // coin toss rather than a skill.
    for (var y = cy - 3; y <= cy + 3; y++) {
      for (var x = cx - 3; x <= cx + 3; x++) {
        if (inBounds(x, y)) { owner[idx(x, y)] = p.id; trail[idx(x, y)] = 0 }
      }
    }
  }

  function reset() {
    owner.fill(0); trail.fill(0)
    players = [makePlayer(1, true), makePlayer(2), makePlayer(3), makePlayer(4)]
    me = players[0]
    var st = STYLES.slice()
    shuffle(st)
    for (var si = 1; si < players.length; si++) players[si].style = st[si - 1]
    // Four corners of an inner square, so nobody starts on top of anyone.
    var spots = [[18, 18], [W - 19, 18], [18, H - 19], [W - 19, H - 19]]
    shuffle(spots)
    for (var i = 0; i < players.length; i++) base(players[i], spots[i][0], spots[i][1])
    recount()
    kills = 0; over = false; paused = false
    startedAt = performance.now()
    lastFrame = startedAt
    pausedMs = 0; pausedAt = 0
  }

  function elapsed() {
    return performance.now() - startedAt - pausedMs - (paused ? performance.now() - pausedAt : 0)
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0
      var t = a[i]; a[i] = a[j]; a[j] = t
    }
  }

  function recount() {
    for (var i = 0; i < players.length; i++) players[i].area = 0
    for (var c = 0; c < N; c++) {
      var o = owner[c]
      if (o) players[o - 1].area++
    }
  }

  // ---------------------------------------------------------------- claim
  // Everything the player just walked becomes theirs, and then anything the
  // loop encloses does too. The enclosure is found by flooding the board from
  // its edges with the player's own ground as a wall: whatever the flood
  // cannot reach is inside.
  function claim(p) {
    var i, c
    for (i = 0; i < p.trailCells.length; i++) {
      c = p.trailCells[i]
      trail[c] = 0
      owner[c] = p.id
    }
    p.trailCells.length = 0

    scratch.fill(0)
    var top = 0
    var push = function (x, y) {
      if (x < 0 || y < 0 || x >= W || y >= H) return
      var j = y * W + x
      if (scratch[j] || owner[j] === p.id) return
      scratch[j] = 1
      stack[top++] = j
    }
    for (var x = 0; x < W; x++) { push(x, 0); push(x, H - 1) }
    for (var y = 0; y < H; y++) { push(0, y); push(W - 1, y) }
    while (top > 0) {
      var j = stack[--top]
      var jx = j % W, jy = (j / W) | 0
      push(jx + 1, jy); push(jx - 1, jy); push(jx, jy + 1); push(jx, jy - 1)
    }

    var gained = 0
    var took = p.human ? [] : null
    for (j = 0; j < N; j++) {
      if (!scratch[j] && owner[j] !== p.id) {
        if (took && took.length < 4000) took.push(j)
        // The enemy's line is left where it is — taking the ground under it is
        // enough. Wiping it would kill them from across the map for something
        // they cannot see coming.
        owner[j] = p.id
        gained++
      }
    }
    recount()
    if (took && took.length) flash = { cells: took, until: performance.now() + 420 }
    return gained
  }

  // ---------------------------------------------------------------- death
  function kill(p, by) {
    if (!p.alive) return
    p.alive = false
    if (p.human || (by && by.human)) shakeUntil = performance.now() + 380
    for (var i = 0; i < p.trailCells.length; i++) trail[p.trailCells[i]] = 0
    p.trailCells.length = 0
    // Half, eaten in from the edges, rather than all of it. Measured over
    // three rounds with the old rule: a round ended 0% / 0% / 0.9% / 21.7%,
    // because one death in the last thirty seconds deleted two minutes of
    // play. Losing the outside of your ground is a real punishment that still
    // leaves you something to defend.
    erode(p, 0.5)
    recount()
    if (p.human) {
      SFX.die()
      p.lives--
      if (p.lives <= 0) { finish('やられました'); return }
      toast('やられた　残り ' + p.lives)
      p.respawnAt = performance.now() + 1500
      return
    }
    p.respawnAt = performance.now() + 2600
    if (by && by.human) {
      kills++
      SFX.kill()
      toast(p.name + ' を脱落させた')
    }
  }

  /** Eat a player's ground inward from its border until `keep` of it is left.
   *  Taking random cells would leave a speckle; taking the edge looks like
   *  ground being lost, which is what happened. */
  function erode(p, keep) {
    var cells = []
    for (var c = 0; c < N; c++) if (owner[c] === p.id) cells.push(c)
    var target = Math.floor(cells.length * keep)
    var guard = 0
    while (cells.length > target && guard++ < 200) {
      var border = []
      for (var i = 0; i < cells.length; i++) {
        var j = cells[i], x = j % W, y = (j / W) | 0
        if ((x > 0 && owner[j - 1] !== p.id) || (x < W - 1 && owner[j + 1] !== p.id) ||
            (y > 0 && owner[j - W] !== p.id) || (y < H - 1 && owner[j + W] !== p.id) ||
            x === 0 || y === 0 || x === W - 1 || y === H - 1) border.push(j)
      }
      if (!border.length) break
      for (i = 0; i < border.length && cells.length > target; i++) {
        owner[border[i]] = 0
        cells.splice(cells.indexOf(border[i]), 1)
      }
    }
  }

  function respawn(p) {
    // Back inside whatever ground survived, if any of it has room.
    var own = []
    for (var c = 0; c < N; c++) if (owner[c] === p.id) own.push(c)
    shuffle(own)
    for (var oi = 0; oi < own.length && oi < 400; oi++) {
      var ox2 = own[oi] % W, oy2 = (own[oi] / W) | 0
      if (roomAt(ox2, oy2, p, true)) { p.alive = true; p.plan.length = 0; base(p, ox2, oy2); recount(); return }
    }
    // Somewhere with room, and not on anyone's doorstep.
    for (var tries = 0; tries < 200; tries++) {
      var x = 6 + ((Math.random() * (W - 12)) | 0)
      var y = 6 + ((Math.random() * (H - 12)) | 0)
      if (roomAt(x, y, p, false)) { p.alive = true; p.plan.length = 0; base(p, x, y); recount(); return }
    }
    p.respawnAt = performance.now() + 1500
  }

  // ---------------------------------------------------------------- step
  /** Is there a clear 7x7 here? `ownOk` lets a player land back on its own
   *  ground, which is the whole point of coming home to what survived. */
  function roomAt(x, y, p, ownOk) {
    for (var dy = -3; dy <= 3; dy++) {
      for (var dx = -3; dx <= 3; dx++) {
        if (!inBounds(x + dx, y + dy)) return false
        var j = idx(x + dx, y + dy)
        if (trail[j]) return false
        if (owner[j] && !(ownOk && owner[j] === p.id)) return false
      }
    }
    return true
  }

  function enterCell(p) {
    var c = idx(p.cx, p.cy)

    // Someone's line, including this player's own.
    var t = trail[c]
    if (t) {
      if (t === p.id) { kill(p, null); return }
      kill(players[t - 1], p)
      if (!p.alive) return
    }

    // A head-on. Whoever is away from home loses it; if both are, both do.
    for (var i = 0; i < players.length; i++) {
      var q = players[i]
      if (q === p || !q.alive) continue
      if (q.cx === p.cx && q.cy === p.cy) {
        var pOut = p.trailCells.length > 0, qOut = q.trailCells.length > 0
        if (pOut) kill(p, qOut ? null : q)
        if (qOut) kill(q, pOut ? null : p)
        if (!p.alive) return
      }
    }

    if (owner[c] === p.id) {
      if (p.trailCells.length) {
        var g = claim(p)
        if (p.human && g > 0) { toast('+' + g); SFX.claim(g) }
      }
    } else if (!trail[c]) {
      trail[c] = p.id
      p.trailCells.push(c)
    }
  }

  function advance(p, dt) {
    p.t += (p.human ? SPEED : SPEED * LEVELS[level].bot) * dt
    var guard = 0
    while (p.t >= 1 && p.alive && guard++ < 8) {
      p.t -= 1
      // A turn is only taken at a cell boundary, so the line always runs along
      // the grid and never cuts a corner.
      if ((p.next + 2) % 4 !== p.dir) p.dir = p.next
      // Bots decide seven times a second and move at the same rate, so a plan
      // can still walk one into its own line between decisions.
      if (!p.human && suicide(p, p.dir)) {
        var away = escape(p)
        if (away !== -1) { p.dir = away; p.next = away; p.plan.length = 0 }
      }
      var d = DIRS[p.dir]
      var nx = p.cx + d[0], ny = p.cy + d[1]
      if (!inBounds(nx, ny)) {
        // The edge of the world is a wall, not a cliff: turn rather than die.
        p.dir = (p.dir + (Math.random() < 0.5 ? 1 : 3)) % 4
        p.next = p.dir
        d = DIRS[p.dir]
        nx = p.cx + d[0]; ny = p.cy + d[1]
        if (!inBounds(nx, ny)) { p.t = 0; return }
      }
      p.cx = nx; p.cy = ny
      enterCell(p)
    }
  }

  // ---------------------------------------------------------------- bots
  // A bot goes out from its own ground, turns, runs a while, and comes home —
  // which is the same shape a person draws. It will also cut across a line it
  // can see, because a game where nobody attacks is not a game.
  /** Would stepping this way put a player on its own line? Seven of the
   *  seventeen deaths across three measured rounds were exactly this, and a
   *  bot killing itself is not a game, it is a gift. */
  function suicide(p, d) {
    var x = p.cx + DIRS[d][0], y = p.cy + DIRS[d][1]
    if (!inBounds(x, y)) return true
    return trail[idx(x, y)] === p.id
  }

  /** The way out of a corner: any direction that is neither a reversal nor a
   *  step onto one's own line. */
  function escape(p) {
    var opts = []
    for (var d = 0; d < 4; d++) {
      if ((d + 2) % 4 === p.dir) continue
      if (!suicide(p, d)) opts.push(d)
    }
    return opts.length ? opts[(Math.random() * opts.length) | 0] : -1
  }

  function think(p) {
    // Checked before anything else: a plan made three seconds ago does not know
    // where this player's line has since been laid.
    if (suicide(p, p.next)) {
      var out = escape(p)
      if (out !== -1) { p.plan.length = 0; p.next = out; return }
    }
    if (p.plan.length) {
      p.plan[0][1]--
      if (p.plan[0][1] <= 0) p.plan.shift()
      else { p.next = p.plan[0][0]; return }
    }
    if (p.plan.length) { p.next = p.plan[0][0]; return }

    var home = owner[idx(p.cx, p.cy)] === p.id

    // Something to cut, if it is close and roughly in front. The range was 13
    // and only reached from close to home; with the suicide guard in, deaths
    // across three rounds fell from seventeen to five, which is a quieter game
    // than it should be. Being cut is the tension — it is now telegraphed and
    // survivable, so there can be more of it.
    var reach = Math.round(LEVELS[level].hunt * p.style.hunt)
    if (home || p.trailCells.length < 34) {
      var target = null, bestD = reach
      for (var i = 0; i < players.length; i++) {
        var q = players[i]
        if (q === p || !q.alive || !q.trailCells.length) continue
        for (var k = 0; k < q.trailCells.length; k += 3) {
          var c = q.trailCells[k]
          var d = Math.abs((c % W) - p.cx) + Math.abs(((c / W) | 0) - p.cy)
          if (d < bestD) { bestD = d; target = c }
        }
      }
      if (target !== null && Math.random() < LEVELS[level].aggro * p.style.aggro) {
        var tx = target % W, ty = (target / W) | 0
        p.plan = []
        if (tx !== p.cx) p.plan.push([tx > p.cx ? 0 : 2, Math.abs(tx - p.cx)])
        if (ty !== p.cy) p.plan.push([ty > p.cy ? 1 : 3, Math.abs(ty - p.cy)])
        p.next = p.plan.length ? p.plan[0][0] : p.next
        return
      }
    }

    if (!home && p.trailCells.length > 8) {
      // Head back by whichever axis reaches own ground first.
      var backDir = nearestHome(p)
      if (backDir !== -1) {
        p.plan = [[backDir, 40]]
        p.next = backDir
        return
      }
    }

    var lo = p.style.out[0], hi = p.style.out[1]
    var out = lo + ((Math.random() * (hi - lo + 1)) | 0)
    var side = Math.random() < 0.5 ? 1 : 3
    var run = 4 + ((Math.random() * 8) | 0)
    var d0 = p.dir
    p.plan = [[d0, out], [(d0 + side) % 4, run], [(d0 + 2) % 4, out + 2], [(d0 + side + 2) % 4, run]]
    p.next = p.plan[0][0]
  }

  /** Which of the four ways gets back to this player's own ground soonest. */
  function nearestHome(p) {
    var best = -1, bestD = 1e9
    for (var d = 0; d < 4; d++) {
      if ((d + 2) % 4 === p.dir) continue
      var dx = DIRS[d][0], dy = DIRS[d][1]
      for (var s = 1; s < 46; s++) {
        var x = p.cx + dx * s, y = p.cy + dy * s
        if (!inBounds(x, y)) break
        var j = idx(x, y)
        if (trail[j] === p.id) break
        if (owner[j] === p.id) { if (s < bestD) { bestD = s; best = d } break }
      }
    }
    return best
  }

  // ---------------------------------------------------------------- render
  var cv = document.getElementById('cv')
  var ctx = cv.getContext('2d')
  var mini = document.getElementById('mini')
  var mctx = mini.getContext('2d')
  var dpr = 1, vw = 0, vh = 0

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1)
    vw = window.innerWidth; vh = window.innerHeight
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  }
  window.addEventListener('resize', resize)
  resize()

  function headPos(p) {
    var d = DIRS[p.dir]
    return { x: p.cx + d[0] * p.t, y: p.cy + d[1] * p.t }
  }

  function draw() {
    // About thirty cells across the short side. At twenty-three you could not
    // see the edge of your own ground, let alone anyone else's, which is the
    // one thing the view has to show.
    var cell = Math.max(11, Math.min(vw, vh) / 30)
    var h = headPos(me.alive ? me : players[0])
    var ox = vw / 2 - (h.x + 0.5) * cell
    var oy = vh / 2 - (h.y + 0.5) * cell
    var now = performance.now()
    if (now < shakeUntil) {
      var k2 = (shakeUntil - now) / 380
      ox += (Math.random() - 0.5) * 18 * k2
      oy += (Math.random() - 0.5) * 18 * k2
    }

    ctx.fillStyle = '#070a16'
    ctx.fillRect(0, 0, vw, vh)

    var x0 = Math.max(0, Math.floor(-ox / cell) - 1)
    var y0 = Math.max(0, Math.floor(-oy / cell) - 1)
    var x1 = Math.min(W - 1, Math.ceil((vw - ox) / cell) + 1)
    var y1 = Math.min(H - 1, Math.ceil((vh - oy) / cell) + 1)

    // Ground, a row-run at a time. Filling cell by cell left hairline seams
    // between them wherever the edges landed between device pixels.
    for (var y = y0; y <= y1; y++) {
      var x = x0
      while (x <= x1) {
        var o = owner[idx(x, y)]
        if (!o) { x++; continue }
        var e = x
        while (e + 1 <= x1 && owner[idx(e + 1, y)] === o) e++
        // Snapped to whole pixels at both edges. Adding a half pixel of
        // overlap instead left a brighter seam wherever two rows met.
        var px = Math.round(ox + x * cell), py = Math.round(oy + y * cell)
        ctx.fillStyle = COLORS[o].deep
        ctx.fillRect(px, py, Math.round(ox + (e + 1) * cell) - px, Math.round(oy + (y + 1) * cell) - py)
        x = e + 1
      }
    }
    // A sparse mark over held ground, so a large holding reads as a surface
    // rather than a flat colour.
    ctx.globalAlpha = 0.14
    ctx.fillStyle = '#ffffff'
    for (y = y0; y <= y1; y++) {
      for (x = x0; x <= x1; x++) {
        if (!owner[idx(x, y)]) continue
        if ((x * 5 + y * 3) % 11) continue
        var mx = ox + (x + 0.5) * cell, my = oy + (y + 0.5) * cell, mr = cell * 0.2
        ctx.beginPath()
        ctx.moveTo(mx, my - mr); ctx.lineTo(mx + mr, my)
        ctx.lineTo(mx, my + mr); ctx.lineTo(mx - mr, my)
        ctx.closePath(); ctx.fill()
      }
    }
    ctx.globalAlpha = 1
    // The edge of a holding, so the shape reads rather than a wash of colour
    for (y = y0; y <= y1; y++) {
      for (x = x0; x <= x1; x++) {
        var oo = owner[idx(x, y)]
        if (!oo) continue
        var px = ox + x * cell, py = oy + y * cell
        ctx.strokeStyle = COLORS[oo].base
        ctx.lineWidth = 2
        ctx.beginPath()
        if (y === 0 || owner[idx(x, y - 1)] !== oo) { ctx.moveTo(px, py + 1); ctx.lineTo(px + cell, py + 1) }
        if (y === H - 1 || owner[idx(x, y + 1)] !== oo) { ctx.moveTo(px, py + cell - 1); ctx.lineTo(px + cell, py + cell - 1) }
        if (x === 0 || owner[idx(x - 1, y)] !== oo) { ctx.moveTo(px + 1, py); ctx.lineTo(px + 1, py + cell) }
        if (x === W - 1 || owner[idx(x + 1, y)] !== oo) { ctx.moveTo(px + cell - 1, py); ctx.lineTo(px + cell - 1, py + cell) }
        ctx.stroke()
      }
    }
    // Lines
    ctx.globalAlpha = 0.72
    for (var pi = 0; pi < players.length; pi++) {
      var p = players[pi]
      if (!p.alive) continue
      ctx.fillStyle = COLORS[p.id].base
      for (var i = 0; i < p.trailCells.length; i++) {
        var c = p.trailCells[i]
        var tx = c % W, ty = (c / W) | 0
        if (tx < x0 || tx > x1 || ty < y0 || ty > y1) continue
        ctx.fillRect(ox + tx * cell + cell * 0.18, oy + ty * cell + cell * 0.18, cell * 0.64, cell * 0.64)
      }
    }
    ctx.globalAlpha = 1

    // Outside the world
    ctx.fillStyle = 'rgba(0,0,0,0.55)'
    if (ox > 0) ctx.fillRect(0, 0, ox, vh)
    if (oy > 0) ctx.fillRect(0, 0, vw, oy)
    var rx = ox + W * cell, ry = oy + H * cell
    if (rx < vw) ctx.fillRect(rx, 0, vw - rx, vh)
    if (ry < vh) ctx.fillRect(0, ry, vw, vh - ry)
    // Without this the space beyond the board is just darker, which looks like
    // something failed to draw rather than like the end of the world.
    ctx.strokeStyle = 'rgba(165,180,252,0.5)'
    ctx.lineWidth = 2
    ctx.strokeRect(ox, oy, W * cell, H * cell)

    // What was just taken, lit for a moment. A capture used to be a number in
    // the corner; this is the thing you actually did.
    if (flash) {
      if (now > flash.until) flash = null
      else {
        ctx.globalAlpha = 0.55 * ((flash.until - now) / 420)
        ctx.fillStyle = '#ffffff'
        for (var fi = 0; fi < flash.cells.length; fi++) {
          var fc = flash.cells[fi]
          var fx = fc % W, fy = (fc / W) | 0
          if (fx < x0 || fx > x1 || fy < y0 || fy > y1) continue
          ctx.fillRect(ox + fx * cell, oy + fy * cell, cell + 0.5, cell + 0.5)
        }
        ctx.globalAlpha = 1
      }
    }

    // Heads
    var lead = leader()
    for (pi = 0; pi < players.length; pi++) {
      p = players[pi]
      if (!p.alive) continue
      var hp = headPos(p)
      var hx = ox + hp.x * cell, hy = oy + hp.y * cell
      if (hx < -cell * 4 || hy < -cell * 4 || hx > vw + cell * 4 || hy > vh + cell * 4) continue
      // Yours wears a white ring, so at this zoom you can always find it.
      if (p.human) {
        ctx.beginPath()
        ctx.arc(hx + cell * 0.5, hy + cell * 0.5, cell * 0.78, 0, Math.PI * 2)
        ctx.strokeStyle = 'rgba(255,255,255,0.22)'
        ctx.lineWidth = 2
        ctx.stroke()
      }
      ctx.fillStyle = COLORS[p.id].base
      ctx.strokeStyle = p.human ? '#fff' : 'rgba(0,0,0,0.6)'
      ctx.lineWidth = p.human ? 2.5 : 2
      round(ctx, hx + cell * 0.08, hy + cell * 0.08, cell * 0.84, cell * 0.84, cell * 0.26)
      ctx.fill(); ctx.stroke()
      ctx.font = '700 ' + Math.round(Math.max(12.5, cell * 0.5)) + 'px inherit'
      ctx.textAlign = 'center'
      ctx.lineWidth = 3
      ctx.strokeStyle = 'rgba(0,0,0,0.75)'
      ctx.fillStyle = '#fff'
      var label = (lead === p ? '♛ ' : '') + p.name
      ctx.strokeText(label, hx + cell * 0.5, hy - cell * 0.3)
      ctx.fillText(label, hx + cell * 0.5, hy - cell * 0.3)
    }

    // Rivals you cannot see. Without this the only warning of being cut was
    // the moment it happened.
    for (pi = 0; pi < players.length; pi++) {
      p = players[pi]
      if (p === me || !p.alive) continue
      var pp = headPos(p)
      var sx = ox + (pp.x + 0.5) * cell, sy = oy + (pp.y + 0.5) * cell
      if (sx > 16 && sx < vw - 16 && sy > 16 && sy < vh - 16) continue
      var ang = Math.atan2(sy - vh / 2, sx - vw / 2)
      var rr = Math.min(vw, vh) / 2 - 34
      var ax = vw / 2 + Math.cos(ang) * rr, ay = vh / 2 + Math.sin(ang) * rr
      var cells = Math.abs(p.cx - me.cx) + Math.abs(p.cy - me.cy)
      ctx.save()
      ctx.translate(ax, ay); ctx.rotate(ang)
      ctx.globalAlpha = Math.max(0.28, 1 - cells / 60)
      ctx.fillStyle = COLORS[p.id].base
      ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(-7, 7); ctx.lineTo(-7, -7); ctx.closePath(); ctx.fill()
      ctx.restore()
      ctx.globalAlpha = 1
    }

    // …and when one of them is closing on the line you are drawing.
    if (danger > 0.02) {
      var g = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.3, vw / 2, vh / 2, Math.max(vw, vh) * 0.62)
      g.addColorStop(0, 'rgba(244,63,94,0)')
      g.addColorStop(1, 'rgba(244,63,94,' + (0.42 * danger).toFixed(3) + ')')
      ctx.fillStyle = g
      ctx.fillRect(0, 0, vw, vh)
    }

    drawMini(cell)
  }

  function round(c, x, y, w, h, r) {
    c.beginPath()
    c.moveTo(x + r, y)
    c.arcTo(x + w, y, x + w, y + h, r)
    c.arcTo(x + w, y + h, x, y + h, r)
    c.arcTo(x, y + h, x, y, r)
    c.arcTo(x, y, x + w, y, r)
    c.closePath()
  }

  var miniImg = null, miniBuf = null, mbctx = null
  function drawMini() {
    if (!miniBuf) {
      miniBuf = document.createElement('canvas')
      miniBuf.width = W; miniBuf.height = H
      mbctx = miniBuf.getContext('2d')
      miniImg = mbctx.createImageData(W, H)
    }
    var d = miniImg.data
    for (var c = 0; c < N; c++) {
      var o = owner[c], k = c * 4
      if (o) {
        var col = hex(COLORS[o].base)
        d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 235
      } else {
        d[k] = 18; d[k + 1] = 22; d[k + 2] = 42; d[k + 3] = 255
      }
    }
    mbctx.putImageData(miniImg, 0, 0)
    mctx.imageSmoothingEnabled = false
    mctx.clearRect(0, 0, mini.width, mini.height)
    mctx.drawImage(miniBuf, 0, 0, mini.width, mini.height)
    if (me.alive) {
      mctx.fillStyle = '#fff'
      mctx.fillRect((me.cx / W) * mini.width - 2, (me.cy / H) * mini.height - 2, 4, 4)
    }
  }

  var hexCache = {}
  function hex(s) {
    if (!hexCache[s]) {
      hexCache[s] = [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)]
    }
    return hexCache[s]
  }

  function leader() {
    var best = null
    for (var i = 0; i < players.length; i++) {
      if (!players[i].alive) continue
      if (!best || players[i].area > best.area) best = players[i]
    }
    return best
  }

  // ---------------------------------------------------------------- hud
  var listEl = document.getElementById('board-list')
  var clockEl = document.getElementById('clock')
  var toastEl = document.getElementById('toast')
  var toastTimer = 0

  function toast(msg) {
    toastEl.textContent = msg
    toastEl.classList.add('on')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(function () { toastEl.classList.remove('on') }, 1100)
  }

  var rowEls = []
  var lastSec = -1
  function buildHud() {
    listEl.innerHTML = ''
    rowEls = []
    for (var i = 0; i < players.length; i++) {
      var p = players[i]
      var row = document.createElement('div')
      row.className = 'row' + (p.human ? ' me' : '')
      row.innerHTML =
        '<span class="swatch" style="background:' + COLORS[p.id].base + '"></span>' +
        '<span class="nm"></span><span class="pc"></span>'
      var wrapBar = document.createElement('div')
      var holder = document.createElement('div')
      holder.appendChild(row)
      var bar = document.createElement('div')
      bar.className = 'bar'
      bar.innerHTML = '<i style="background:' + COLORS[p.id].base + '"></i>'
      holder.appendChild(bar)
      listEl.appendChild(holder)
      rowEls.push({ row: row, nm: row.querySelector('.nm'), pc: row.querySelector('.pc'), fill: bar.querySelector('i') })
      void wrapBar
    }
  }

  function updateHud() {
    var order = players.slice().sort(function (a, b) { return b.area - a.area })
    for (var i = 0; i < order.length; i++) {
      var p = order[i]
      var el = rowEls[i]
      el.row.className = 'row' + (p.human ? ' me' : '') + (p.alive ? '' : ' dead')
      el.row.querySelector('.swatch').style.background = COLORS[p.id].base
      // The rows are re-sorted every frame, so the bar has to be recoloured
      // too — it was keeping the colour of whoever held the slot at build time.
      el.fill.style.background = COLORS[p.id].base
      el.nm.textContent = (i + 1) + '. ' + p.name +
        (p.human ? '　♥' + Math.max(0, p.lives) : '　' + p.style.tag) +
        (p.alive ? '' : '（復帰中）')
      var pct = (p.area / N) * 100
      el.pc.textContent = pct.toFixed(1) + '%'
      el.fill.style.width = Math.min(100, pct * 2.2) + '%'
    }
    var left = Math.max(0, ROUND_MS - elapsed())
    var s = Math.ceil(left / 1000)
    clockEl.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
    clockEl.classList.toggle('warn', s <= 15)
    if (s !== lastSec) {
      if (s <= 10 && s > 0 && running && !paused && !over) SFX.tick()
      lastSec = s
    }
  }

  // ---------------------------------------------------------------- sound
  // Oscillators rather than files: the page is served from a function and has
  // no assets, and four tones is all this needs.
  var actx = null, muted = false
  try { muted = localStorage.getItem('lum_territory_mute') === '1' } catch (_) {}

  function beep(freq, dur, type, vol, slideTo) {
    if (muted) return
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)()
      if (actx.state === 'suspended') actx.resume()
      var o = actx.createOscillator(), g = actx.createGain()
      o.type = type || 'sine'
      o.frequency.setValueAtTime(freq, actx.currentTime)
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur)
      g.gain.setValueAtTime(0.0001, actx.currentTime)
      g.gain.exponentialRampToValueAtTime(vol || 0.07, actx.currentTime + 0.012)
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur)
      o.connect(g); g.connect(actx.destination)
      o.start(); o.stop(actx.currentTime + dur + 0.02)
    } catch (_) { /* audio is never worth an exception */ }
  }

  var SFX = {
    // Pitched by size, so a big capture sounds like one.
    claim: function (n) { beep(340 + Math.min(520, n * 2.6), 0.16, 'triangle', 0.09) },
    kill: function () { beep(660, 0.09, 'square', 0.06); setTimeout(function () { beep(990, 0.13, 'square', 0.06) }, 85) },
    die: function () { beep(300, 0.42, 'sawtooth', 0.09, 70) },
    tick: function () { beep(880, 0.05, 'sine', 0.05) },
    go: function () { beep(523, 0.1, 'triangle', 0.08); setTimeout(function () { beep(784, 0.2, 'triangle', 0.09) }, 110) }
  }

  var muteBtn = document.getElementById('muteBtn')
  muteBtn.textContent = muted ? '🔇' : '🔊'
  muteBtn.addEventListener('click', function () {
    muted = !muted
    muteBtn.textContent = muted ? '🔇' : '🔊'
    try { localStorage.setItem('lum_territory_mute', muted ? '1' : '0') } catch (_) {}
    if (!muted) SFX.tick()
  })

  // ---------------------------------------------------------------- input
  var KEYS = {
    ArrowRight: 0, ArrowDown: 1, ArrowLeft: 2, ArrowUp: 3,
    d: 0, s: 1, a: 2, w: 3, D: 0, S: 1, A: 2, W: 3
  }
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'p') { togglePause(); return }
    var d = KEYS[e.key]
    if (d === undefined || !running || !me.alive) return
    e.preventDefault()
    if ((d + 2) % 4 !== me.dir) me.next = d
  }, { passive: false })

  var touch = null
  cv.addEventListener('pointerdown', function (e) { touch = { x: e.clientX, y: e.clientY } })
  cv.addEventListener('pointermove', function (e) {
    if (!touch || !running || !me.alive) return
    var dx = e.clientX - touch.x, dy = e.clientY - touch.y
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return
    var d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 0 : 2) : (dy > 0 ? 1 : 3)
    if ((d + 2) % 4 !== me.dir) me.next = d
    touch = { x: e.clientX, y: e.clientY }
  })
  cv.addEventListener('pointerup', function () { touch = null })
  cv.addEventListener('pointercancel', function () { touch = null })

  // A swipe needs a drag, and a drag needs the hand that is holding the phone.
  // The pad is there for the thumb that is already on that corner.
  if (window.matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch')
  var padEls = document.querySelectorAll('#pad button')
  for (var pi2 = 0; pi2 < padEls.length; pi2++) {
    (function (el) {
      var d = Number(el.dataset.d)
      var go2 = function (e) {
        e.preventDefault()
        if (!running || paused || !me.alive) return
        if ((d + 2) % 4 !== me.dir) me.next = d
      }
      el.addEventListener('pointerdown', go2)
      el.addEventListener('contextmenu', function (e) { e.preventDefault() })
    })(padEls[pi2])
  }

  // ---- level ----
  var levelBtns = document.querySelectorAll('#levels button')
  function paintLevels() {
    for (var i = 0; i < levelBtns.length; i++) {
      levelBtns[i].setAttribute('aria-pressed', levelBtns[i].dataset.lv === level ? 'true' : 'false')
    }
  }
  for (var li = 0; li < levelBtns.length; li++) {
    levelBtns[li].addEventListener('click', function () {
      level = this.dataset.lv
      try { localStorage.setItem('lum_territory_diff', level) } catch (_) {}
      paintLevels()
    })
  }
  paintLevels()

  // ---------------------------------------------------------------- flow
  var startOv = document.getElementById('startOv')
  var endOv = document.getElementById('endOv')

  var countEl = document.getElementById('count3')

  /** Three seconds to find yourself on the board before anything moves. The
   *  round used to start with you already travelling. */
  function begin() {
    reset()
    buildHud()
    startOv.hidden = true
    endOv.hidden = true
    running = true
    paused = true
    pausedAt = performance.now()
    countEl.classList.add('on')
    var n = 3
    countEl.textContent = n
    SFX.tick()
    var iv = setInterval(function () {
      n--
      if (n > 0) { countEl.textContent = n; SFX.tick(); return }
      clearInterval(iv)
      countEl.textContent = 'GO'
      SFX.go()
      setTimeout(function () {
        countEl.classList.remove('on')
        if (paused) { pausedMs += performance.now() - pausedAt; paused = false; lastFrame = performance.now() }
      }, 420)
    }, 700)
  }

  function togglePause() {
    if (!running || over) return
    paused = !paused
    document.getElementById('pauseBtn').textContent = paused ? '▶' : '❚❚'
    // The round is measured against the wall clock, so time spent paused has
    // to be given back — otherwise pausing only froze the display while the
    // two minutes kept running underneath it.
    if (paused) pausedAt = performance.now()
    else { pausedMs += performance.now() - pausedAt; lastFrame = performance.now() }
  }

  function finish(reason) {
    if (over) return
    over = true
    running = false
    var order = players.slice().sort(function (a, b) { return b.area - a.area })
    var rank = order.indexOf(me) + 1
    var pct = (me.area / N) * 100
    var best = 0
    try { best = Number(localStorage.getItem('lum_territory_best') || 0) } catch (_) {}
    var record = pct > best
    if (record) { try { localStorage.setItem('lum_territory_best', pct.toFixed(1)) } catch (_) {} }
    document.getElementById('endTitle').textContent =
      me.alive && rank === 1 ? '勝ち' : (reason || '終了')
    document.getElementById('endSub').textContent =
      (me.lives > 0 ? rank + ' 位' : '脱落') + '　陣地 ' + pct.toFixed(1) + '%' +
      (kills ? '　撃破 ' + kills : '') +
      (record ? '　★ 自己ベスト更新' : (best ? '　自己ベスト ' + best.toFixed(1) + '%' : '')) +
      '　[' + LEVELS[level].label + ']'
    var list = document.getElementById('endList')
    list.innerHTML = ''
    for (var i = 0; i < order.length; i++) {
      var p = order[i]
      var row = document.createElement('div')
      row.className = 'row' + (p.human ? ' me' : '')
      row.innerHTML =
        '<span class="rk">' + (i + 1) + '</span>' +
        '<span class="swatch" style="background:' + COLORS[p.id].base + '"></span>' +
        '<span class="nm">' + p.name + (p.alive ? '' : '（脱落）') + '</span>' +
        '<span class="pc">' + ((p.area / N) * 100).toFixed(1) + '%</span>'
      row.style.display = 'flex'
      row.style.alignItems = 'center'
      row.style.gap = '9px'
      list.appendChild(row)
    }
    endOv.hidden = false
  }

  // Switching tabs used to leave the two minutes running against the wall
  // clock while nothing was drawn — you came back to a finished round.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && running && !paused && !over) togglePause()
  })

  document.getElementById('startBtn').addEventListener('click', begin)
  document.getElementById('againBtn').addEventListener('click', begin)
  document.getElementById('pauseBtn').addEventListener('click', togglePause)

  // ---------------------------------------------------------------- loop
  var thinkAcc = 0
  function frame(now) {
    requestAnimationFrame(frame)
    var dt = Math.min(0.05, (now - lastFrame) / 1000)
    lastFrame = now
    if (!running || paused) { if (players.length) draw(); return }

    thinkAcc += dt
    var doThink = thinkAcc >= 1 / SPEED
    if (doThink) thinkAcc = 0

    for (var i = 0; i < players.length; i++) {
      var p = players[i]
      if (!p.alive) {
        if (p.respawnAt && now >= p.respawnAt) { p.respawnAt = 0; respawn(p) }
        continue
      }
      if (!p.human && doThink) think(p)
      advance(p, dt)
    }

    // How close the nearest rival is to the line you are drawing. Being cut is
    // the way this game is lost, and until now it arrived with no warning at
    // all: whoever did it was usually off the edge of the screen.
    danger = 0
    if (me.alive && me.trailCells.length) {
      for (i = 0; i < players.length; i++) {
        var q = players[i]
        if (q === me || !q.alive) continue
        var best = 99
        for (var k = 0; k < me.trailCells.length; k += 2) {
          var c = me.trailCells[k]
          var dd = Math.abs((c % W) - q.cx) + Math.abs(((c / W) | 0) - q.cy)
          if (dd < best) best = dd
        }
        var lvl = Math.max(0, 1 - best / 16)
        if (lvl > danger) danger = lvl
      }
    }

    updateHud()
    draw()

    if (elapsed() >= ROUND_MS) finish('時間切れ')
  }

  reset()
  buildHud()
  updateHud()
  draw()
  requestAnimationFrame(frame)
})()
</script>
</body>
</html>
