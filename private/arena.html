<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>LUMEN BREAKER | Lumenium 会員限定</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#0a0e1a; color:#f5f7fb; overflow:hidden;
    font-family:'Zen Kaku Gothic New','Hiragino Sans',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .top {
    width:100%; max-width:560px; display:flex; align-items:center;
    justify-content:space-between; padding:10px 14px; gap:8px;
  }
  .top a { color:#abb5cb; text-decoration:none; font-size:12.5px; }
  .top a:hover { color:#fff; }
  .badge {
    font-size:10px; font-weight:800; letter-spacing:0.22em;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    padding:4px 10px; border-radius:999px; color:#fff;
  }
  .top .btns { display:flex; gap:6px; }
  .top button {
    background:#1d2238; color:#cdd3e0; border:1px solid #363c54;
    border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer;
    font-family:inherit;
  }
  .top button:hover { border-color:#4b5274; }
  #wrap { position:relative; flex:1; width:100%; max-width:560px; display:flex; }
  canvas { width:100%; height:100%; display:block; }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(10,14,26,0.88); backdrop-filter:blur(6px); z-index:5;
    padding:24px;
  }
  .overlay.hide { display:none; }
  .overlay h1 {
    font-size:clamp(30px,8vw,44px); font-weight:800; letter-spacing:-0.02em;
    background:linear-gradient(135deg,#a5b4fc,#93c5fd,#67e8f9);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:6px;
  }
  .overlay .sub { font-size:12px; letter-spacing:0.28em; color:#818cf8; font-weight:700; margin-bottom:22px; }
  .overlay p { color:#abb5cb; font-size:13px; line-height:1.9; margin-bottom:22px; }
  .overlay .score-line { font-size:26px; font-weight:800; color:#f5f7fb; margin-bottom:4px; }
  .overlay .best-line { font-size:13px; color:#67e8f9; margin-bottom:20px; }
  .overlay button {
    background:linear-gradient(135deg,#4f46e5,#3b82f6,#06b6d4); color:#fff;
    border:none; border-radius:12px; padding:14px 42px;
    font-size:15px; font-weight:800; cursor:pointer; font-family:inherit;
    letter-spacing:0.04em;
  }
  .overlay button:hover { transform:translateY(-1px); }
</style>
</head>
<body>
  <div class="top">
    <a href="/">← lumenium.net</a>
    <span class="badge">MEMBERS ONLY</span>
    <span class="btns">
      <button id="pauseBtn" type="button">❚❚</button>
      <button id="muteBtn" type="button">🔊</button>
    </span>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div class="overlay" id="startOv">
      <h1>LUMEN BREAKER</h1>
      <div class="sub">MEMBERS EXCLUSIVE</div>
      <p>マウス / ←→キー / スワイプでパドル操作。全12レベル、4面ごとにボス出現。<br>
      連続ヒットでコンボ倍率アップ。銀ブロックは硬く、橙ブロックは誘爆する。<br>
      カプセル：W=ワイド ・ M=マルチ ・ S=スロー ・ L=ライフ<br>
      Z=レーザー（スペース / タップで発射） ・ C=キャッチ（タップで再発射）<br>
      10,000点でエクストラライフ。</p>
      <button id="startBtn" type="button">START</button>
    </div>
    <div class="overlay hide" id="endOv">
      <h1 id="endTitle">GAME OVER</h1>
      <div class="sub">RESULT</div>
      <div class="score-line" id="endScore">0</div>
      <div class="best-line" id="endBest">BEST 0</div>
      <button id="retryBtn" type="button">RETRY</button>
    </div>
  </div>
<script>
(function(){
'use strict';
// roundRect polyfill for older Safari (<16)
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    this.closePath();
    return this;
  };
}
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W=480, H=640, dpr=1;
function resize(){
  var r=document.getElementById('wrap').getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  var s=Math.min(r.width/W, r.height/H);
  ctx.setTransform(dpr*s,0,0,dpr*s,(cv.width-W*s*dpr)/2,(cv.height-H*s*dpr)/2);
}
window.addEventListener('resize',resize); resize();

/* ---------- audio (synth, starts on first gesture) ---------- */
var AC=null, muted=localStorage.getItem('lumen_breaker_mute')==='1';
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function beep(f,d,type,v){
  if(muted) return; var a=ac(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.value=f;
  g.gain.setValueAtTime((v||0.12),a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+d);
}
var sfx={
  paddle:function(){ beep(220,0.06,'square',0.10); },
  brick:function(c){ beep(330+Math.min(c,10)*40,0.07,'square',0.12); },
  wall:function(){ beep(160,0.04,'sine',0.08); },
  power:function(){ beep(520,0.12,'triangle',0.14); beep(780,0.12,'triangle',0.10); },
  lose:function(){ beep(120,0.4,'sawtooth',0.16); },
  laser:function(){ beep(920,0.06,'sawtooth',0.07); beep(1400,0.04,'square',0.04); },
  boom:function(){ beep(75,0.32,'sawtooth',0.20); beep(150,0.20,'square',0.10); },
  bossHit:function(){ beep(180,0.05,'sawtooth',0.10); },
  bossDown:function(){ beep(60,0.6,'sawtooth',0.22); [220,330,440,660,880].forEach(function(f,i){ setTimeout(function(){ beep(f,0.16,'triangle',0.14); }, i*80); }); },
  clear:function(){ [440,554,659,880].forEach(function(f,i){ setTimeout(function(){ beep(f,0.14,'triangle',0.14); }, i*90); }); }
};
var muteBtn=document.getElementById('muteBtn');
muteBtn.textContent=muted?'🔇':'🔊';
muteBtn.onclick=function(){ muted=!muted; localStorage.setItem('lumen_breaker_mute',muted?'1':'0'); muteBtn.textContent=muted?'🔇':'🔊'; };

/* ---------- state ---------- */
var state='start', score=0, lives=3, level=1, combo=0, shake=0, flash=0;
var best=+(localStorage.getItem('lumen_breaker_best')||0);
var paddle={x:W/2,w:88,h:12,y:H-48,wideT:0};
var balls=[], bricks=[], caps=[], parts=[], pops=[], bolts=[];
var slowT=0, laserT=0, laserCd=0, stickyT=0;
var tick=0, bannerT=0, comboFlash=0, lifeBonusGiven=false;
var expl=[]; // pending explosion queue (chain-capable)
var MAX_LEVEL=12;

function maxBallSpeed(){ return Math.min(9+level*0.25, 11.5); }
function newBall(x,y,vx,vy){
  return {x:x,y:y,vx:vx,vy:vy,r:6.5,stuck:false,ox:0,stuckT:0,sv:0,trail:[]};
}
function serveBall(){
  var sp=Math.min(4.2+level*0.3, 7.5);
  balls.push(newBall(paddle.x, paddle.y-14, (Math.random()*2-1)*2.2, -sp));
}

/* ---------- level patterns (indexed by level-1) ---------- */
var COLORS=['#818cf8','#6d9ef8','#5cb3f5','#3fc6ee','#22d3ee'];
var PATTERNS=[
  {name:'GRID',    rows:5, f:function(){ return true; }},
  {name:'CHECKER', rows:6, f:function(r,c){ return (r+c)%2===0; }},
  {name:'PYRAMID', rows:6, f:function(r,c){ return Math.abs(c-4)<=r; }},
  {name:'SENTINEL', boss:true},
  {name:'COLUMNS', rows:7, f:function(r,c){ return c%2===0; }},
  {name:'DIAMOND', rows:7, f:function(r,c,R){ return Math.abs(c-4)+Math.abs(r-(R-1)/2)<=4; }},
  {name:'FORTRESS',rows:6, armorEdge:true, f:function(r,c,R,C){
    return r===0||r===R-1||c===0||c===C-1||(r>=2&&r<=R-3&&c>=3&&c<=C-4); }},
  {name:'WARDEN', boss:true},
  {name:'ZIGZAG',  rows:7, f:function(r,c){ return ((r+(c>>1))%2)===0; }},
  {name:'TUNNEL',  rows:8, f:function(r,c){ return c!==4; }},
  {name:'BASTION', rows:7, armorEdge:true, f:function(r,c,R,C){
    return r===0||c===0||c===C-1||(r+c)%2===0; }},
  {name:'OVERLORD', boss:true}
];
function pat(){ return PATTERNS[Math.min(level,MAX_LEVEL)-1]; }

function buildLevel(){
  bricks.length=0; expl.length=0; bolts.length=0;
  var p=pat();
  if(p.boss){
    var bw=200, hp=20+level*3;
    bricks.push({boss:true,name:p.name,x:W/2-bw/2,y:100,w:bw,h:46,
      hp:hp,max:hp,col:'#f43f5e',type:'b',dead:false,
      tx:W/2-bw/2,shiftT:90});
  } else {
    var cols=9, bw2=(W-48)/cols, bh=20, R=p.rows;
    var aCh=level>=2?Math.min(0.06+level*0.02,0.20):0;
    var xCh=level>=2?Math.min(0.05+level*0.012,0.12):0;
    for(var r=0;r<R;r++)for(var c=0;c<cols;c++){
      if(!p.f(r,c,R,cols)) continue;
      var hp2=1+Math.floor((R-1-r)/2)+Math.floor((level-1)/3);
      hp2=Math.min(hp2,4);
      var type='n', col=COLORS[r%COLORS.length];
      var edge=(r===0||r===R-1||c===0||c===cols-1);
      var rnd=Math.random();
      if(p.armorEdge&&edge){ type='a'; }
      else if(rnd<aCh){ type='a'; }
      else if(rnd<aCh+xCh){ type='x'; }
      if(type==='a'){ hp2*=2; col='#c0c8d8'; }
      else if(type==='x'){ hp2=1; col='#fb923c'; }
      bricks.push({x:24+c*bw2,y:64+r*(bh+6),w:bw2-5,h:bh,hp:hp2,max:hp2,
        col:col,type:type,dead:false,boss:false});
    }
  }
  bannerT=120;
}
function reset(){
  score=0; lives=3; level=1; combo=0;
  paddle.w=88; paddle.wideT=0; slowT=0; laserT=0; laserCd=0; stickyT=0;
  comboFlash=0; lifeBonusGiven=false;
  balls.length=0; caps.length=0; parts.length=0; pops.length=0; bolts.length=0; expl.length=0;
  buildLevel(); serveBall();
}

/* ---------- juice ---------- */
function burst(x,y,col,n){
  for(var i=0;i<n;i++){
    if(parts.length>300) break;
    var a=Math.random()*Math.PI*2, s=1+Math.random()*3.4;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:col});
  }
}
function pop(x,y,txt,col){
  if(pops.length>30) return;
  pops.push({x:x,y:y,txt:txt,col:col||'#fff',life:1});
}

/* ---------- powerups ---------- */
// weighted: W3 M3 S2 L1 Z2 C2 → total drop rate 16%
var CAP_TYPES=[
  {k:'W',col:'#3b82f6',w:3},{k:'M',col:'#8b5cf6',w:3},{k:'S',col:'#06b6d4',w:2},
  {k:'L',col:'#10b981',w:1},{k:'Z',col:'#a855f7',w:2},{k:'C',col:'#14b8a6',w:2}
];
var CAP_TOTAL=CAP_TYPES.reduce(function(s,t){ return s+t.w; },0);
function pickCap(){
  var r=Math.random()*CAP_TOTAL;
  for(var i=0;i<CAP_TYPES.length;i++){ r-=CAP_TYPES[i].w; if(r<=0) return CAP_TYPES[i]; }
  return CAP_TYPES[0];
}
function maybeDrop(b){
  if(Math.random()<0.16){
    var t=pickCap();
    caps.push({x:b.x+b.w/2,y:b.y+b.h/2,vy:1.9,k:t.k,col:t.col});
  }
}
function applyCap(c){
  sfx.power();
  if(c.k==='W'){ paddle.wideT=600; }
  else if(c.k==='M'){
    var src=balls[0]||newBall(paddle.x,paddle.y-14,2,-4);
    for(var i=0;i<2;i++){
      if(balls.length>=6) break;
      balls.push(newBall(src.x,src.y,src.vx+(i?1.6:-1.6),src.vy));
    }
  }
  else if(c.k==='S'){ slowT=420; }
  else if(c.k==='L'){ lives=Math.min(lives+1,5); pop(c.x,c.y,'+1 LIFE','#10b981'); }
  else if(c.k==='Z'){ laserT=480; pop(c.x,c.y,'LASER!','#a855f7'); }
  else if(c.k==='C'){ stickyT=900; pop(c.x,c.y,'CATCH!','#14b8a6'); }
}

/* ---------- bricks: damage / explosions ---------- */
function damageBrick(br,dmg){
  if(br.dead) return;
  br.hp-=dmg;
  combo++;
  if(combo===5||combo===10){ comboFlash=1; pop(W/2,H*0.42,'COMBO ×'+combo+'!','#67e8f9'); }
  var gain=10*combo;
  score+=gain;
  if(br.boss) sfx.bossHit(); else sfx.brick(combo);
  if(br.hp<=0){
    br.dead=true;
    var cx=br.x+br.w/2, cy=br.y+br.h/2;
    if(br.boss){
      // big explosion + shake on defeat
      var bonus=500+level*100;
      score+=bonus;
      burst(cx,cy,'#f43f5e',60); burst(cx,cy,'#fbbf24',40); burst(cx,cy,'#a855f7',30);
      shake=20; flash=0; comboFlash=1;
      pop(cx,cy-20,'BOSS DOWN  +'+bonus,'#fbbf24');
      sfx.bossDown();
    } else {
      burst(cx,cy,br.col,br.type==='x'?24:14);
      if(combo>=3) pop(cx,br.y,'×'+combo+'  +'+gain,'#67e8f9');
      maybeDrop(br);
      shake=Math.min(shake+2,8);
      if(br.type==='x') expl.push({x:cx,y:cy});
    }
  }
}
function processExplosions(){
  var guard=0;
  while(expl.length&&guard++<40){
    var e=expl.shift();
    burst(e.x,e.y,'#fb923c',26); burst(e.x,e.y,'#fde68a',12);
    shake=Math.min(shake+6,14); sfx.boom();
    for(var j=0;j<bricks.length;j++){
      var br=bricks[j];
      if(br.dead) continue;
      var dx=br.x+br.w/2-e.x, dy=br.y+br.h/2-e.y;
      if(dx*dx+dy*dy<70*70){
        damageBrick(br, br.boss?3:(br.type==='a'?2:br.hp));
      }
    }
  }
  expl.length=0;
}
function sweepBricks(){
  for(var j=bricks.length-1;j>=0;j--) if(bricks[j].dead) bricks.splice(j,1);
}

/* ---------- input ---------- */
var targetX=W/2, keys={};
function ptr(e){
  var r=cv.getBoundingClientRect();
  var cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  var s=Math.min(r.width/W,r.height/H);
  targetX=(cx-(r.width-W*s)/2)/s;
}
function launchBall(b){
  var sp=b.sv||Math.min(4.2+level*0.3,7.5);
  var ang=(b.ox/(paddle.w/2))*0.9;
  b.vx=Math.sin(ang)*sp; b.vy=-Math.abs(Math.cos(ang)*sp)||-sp;
  b.stuck=false; b.stuckT=0;
  sfx.paddle();
}
function fire(){
  if(state!=='play'||paused) return;
  var launched=false;
  balls.forEach(function(b){ if(b.stuck){ launchBall(b); launched=true; } });
  if(!launched&&laserT>0&&laserCd<=0){
    bolts.push({x:paddle.x-paddle.w/2+8,y:paddle.y-8,hits:[]});
    bolts.push({x:paddle.x+paddle.w/2-8,y:paddle.y-8,hits:[]});
    laserCd=14; sfx.laser();
  }
}
cv.addEventListener('mousemove',ptr);
cv.addEventListener('mousedown',function(){ ac(); fire(); });
cv.addEventListener('touchmove',function(e){ e.preventDefault(); ptr(e); },{passive:false});
cv.addEventListener('touchstart',function(e){ e.preventDefault(); ptr(e); ac(); fire(); },{passive:false});
document.addEventListener('keydown',function(e){
  keys[e.key]=1;
  if(e.key==='p'||e.key==='P'||e.key==='Escape') togglePause();
  if(e.key===' '){ e.preventDefault(); fire(); }
});
document.addEventListener('keyup',function(e){ delete keys[e.key]; });

/* ---------- pause ---------- */
var paused=false, pauseBtn=document.getElementById('pauseBtn');
function togglePause(){
  if(state!=='play') return;
  paused=!paused; pauseBtn.textContent=paused?'▶':'❚❚';
}
pauseBtn.onclick=togglePause;
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&state==='play'){ paused=true; pauseBtn.textContent='▶'; }
});

/* ---------- flow ---------- */
var startOv=document.getElementById('startOv'), endOv=document.getElementById('endOv');
document.getElementById('startBtn').onclick=function(){ ac(); reset(); state='play'; startOv.classList.add('hide'); };
document.getElementById('retryBtn').onclick=function(){ ac(); reset(); state='play'; endOv.classList.add('hide'); };
function gameOver(cleared){
  state='end';
  if(score>best){ best=score; localStorage.setItem('lumen_breaker_best',best); }
  document.getElementById('endTitle').textContent=cleared?'ALL CLEAR!':'GAME OVER';
  document.getElementById('endScore').textContent=score.toLocaleString();
  document.getElementById('endBest').textContent='BEST '+best.toLocaleString();
  endOv.classList.remove('hide');
}

/* ---------- update ---------- */
function update(){
  tick++;
  if(keys.ArrowLeft) targetX-=9;
  if(keys.ArrowRight) targetX+=9;
  paddle.x+=(targetX-paddle.x)*0.35;
  var goalW=paddle.wideT>0?132:88;
  paddle.w+=(goalW-paddle.w)*0.15;
  if(paddle.wideT>0) paddle.wideT--;
  if(slowT>0) slowT--;
  if(laserT>0) laserT--;
  if(laserCd>0) laserCd--;
  if(stickyT>0) stickyT--;
  paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));

  // extra life at 10,000 (once per run)
  if(!lifeBonusGiven&&score>=10000){
    lifeBonusGiven=true; lives=Math.min(lives+1,5);
    pop(W/2,H*0.5,'10,000pts  +1 LIFE','#10b981'); sfx.power();
  }

  // boss drift: periodically pick a new horizontal target, glide to it
  for(var bi=0;bi<bricks.length;bi++){
    var bb=bricks[bi];
    if(!bb.boss||bb.dead) continue;
    bb.shiftT--;
    if(bb.shiftT<=0){
      bb.tx=24+Math.random()*(W-48-bb.w);
      bb.shiftT=110+Math.random()*70;
    }
    bb.x+=(bb.tx-bb.x)*0.035;
  }

  var mul=slowT>0?0.55:1;
  for(var i=balls.length-1;i>=0;i--){
    var b=balls[i];
    if(b.stuck){
      b.x=paddle.x+b.ox; b.y=paddle.y-b.r-1;
      b.stuckT++;
      if(b.stuckT>240) launchBall(b); // auto-launch safety
      continue;
    }
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>8) b.trail.shift();
    b.x+=b.vx*mul; b.y+=b.vy*mul;
    if(b.x<b.r){ b.x=b.r; b.vx*=-1; sfx.wall(); }
    if(b.x>W-b.r){ b.x=W-b.r; b.vx*=-1; sfx.wall(); }
    if(b.y<b.r){ b.y=b.r; b.vy*=-1; sfx.wall(); }
    // paddle
    if(b.vy>0 && b.y+b.r>=paddle.y && b.y+b.r<=paddle.y+paddle.h+8 &&
       b.x>=paddle.x-paddle.w/2-b.r && b.x<=paddle.x+paddle.w/2+b.r){
      if(stickyT>0){
        b.stuck=true; b.stuckT=0;
        b.ox=Math.max(-paddle.w/2+8,Math.min(paddle.w/2-8,b.x-paddle.x));
        b.sv=Math.min(Math.hypot(b.vx,b.vy),maxBallSpeed());
        b.y=paddle.y-b.r-1;
        combo=0; sfx.paddle();
      } else {
        var rel=(b.x-paddle.x)/(paddle.w/2);
        var sp=Math.min(Math.hypot(b.vx,b.vy)+0.08, maxBallSpeed());
        var ang=rel*1.05;
        b.vx=Math.sin(ang)*sp; b.vy=-Math.abs(Math.cos(ang)*sp);
        b.y=paddle.y-b.r;
        combo=0; sfx.paddle();
      }
    }
    // bricks
    for(var j=0;j<bricks.length;j++){
      var br=bricks[j];
      if(br.dead) continue;
      if(b.x+b.r>br.x && b.x-b.r<br.x+br.w && b.y+b.r>br.y && b.y-b.r<br.y+br.h){
        var ox=Math.min(b.x+b.r-br.x, br.x+br.w-(b.x-b.r));
        var oy=Math.min(b.y+b.r-br.y, br.y+br.h-(b.y-b.r));
        if(ox<oy) b.vx*=-1; else b.vy*=-1;
        damageBrick(br,1);
        break;
      }
    }
    // fell
    if(b.y>H+20){
      balls.splice(i,1);
      if(balls.length===0){
        lives--; combo=0; shake=10; flash=1; sfx.lose();
        if(lives<=0){ gameOver(false); return; }
        serveBall();
      }
    }
  }
  // laser bolts (piercing)
  for(var lb=bolts.length-1;lb>=0;lb--){
    var bo=bolts[lb]; bo.y-=11;
    for(var j2=0;j2<bricks.length;j2++){
      var br2=bricks[j2];
      if(br2.dead||bo.hits.indexOf(br2)>=0) continue;
      if(bo.x>br2.x-2&&bo.x<br2.x+br2.w+2&&bo.y<br2.y+br2.h&&bo.y+16>br2.y){
        bo.hits.push(br2);
        damageBrick(br2,1);
        burst(bo.x,br2.y+br2.h/2,'#a855f7',5);
      }
    }
    if(bo.y<-24) bolts.splice(lb,1);
  }
  processExplosions();
  sweepBricks();
  // caps
  for(var k=caps.length-1;k>=0;k--){
    var c=caps[k]; c.y+=c.vy;
    if(c.y>paddle.y-6 && c.y<paddle.y+paddle.h+10 &&
       c.x>paddle.x-paddle.w/2-10 && c.x<paddle.x+paddle.w/2+10){
      applyCap(c); caps.splice(k,1);
    } else if(c.y>H+20) caps.splice(k,1);
  }
  // particles / popups
  for(var p=parts.length-1;p>=0;p--){
    var q=parts[p]; q.x+=q.vx; q.y+=q.vy; q.vy+=0.06; q.life-=0.03;
    if(q.life<=0) parts.splice(p,1);
  }
  for(var t=pops.length-1;t>=0;t--){
    var u=pops[t]; u.y-=0.7; u.life-=0.02;
    if(u.life<=0) pops.splice(t,1);
  }
  // level clear
  if(bricks.length===0){
    level++;
    if(level>MAX_LEVEL){ gameOver(true); return; }
    sfx.clear();
    balls.length=0; caps.length=0; bolts.length=0;
    buildLevel(); serveBall();
  }
  if(shake>0) shake*=0.88;
  if(flash>0) flash-=0.05;
  if(comboFlash>0) comboFlash-=0.04;
  if(bannerT>0) bannerT--;
}

/* ---------- draw (visual-only helpers: bevels, gloss, depth) ---------- */
function shadeCol(hex,amt){
  var n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(amt>=0){ r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  else { r*=1+amt; g*=1+amt; b*=1+amt; }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
var gradCache={};
function faceGrad(col,h){
  var k=col+'|'+h, g=gradCache[k];
  if(!g){
    g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,shadeCol(col,0.34));
    g.addColorStop(0.5,col);
    g.addColorStop(1,shadeCol(col,-0.36));
    gradCache[k]=g;
  }
  return g;
}
// draw bevel edges: light top/left, dark bottom/right (ctx already clipped to brick)
function bevelEdges(w,h){
  ctx.fillStyle='rgba(255,255,255,0.4)';  ctx.fillRect(0,0,w,2);
  ctx.fillStyle='rgba(255,255,255,0.16)'; ctx.fillRect(0,2,2,h-2);
  ctx.fillStyle='rgba(0,0,0,0.38)';       ctx.fillRect(0,h-2.5,w,2.5);
  ctx.fillStyle='rgba(0,0,0,0.22)';       ctx.fillRect(w-2,2,2,h-4.5);
}
function drawBrick(br){
  ctx.save();
  ctx.translate(br.x,br.y);
  var w=br.w,h=br.h;
  if(br.boss){
    // drop shadow beneath
    ctx.fillStyle='rgba(0,0,0,0.42)';
    ctx.beginPath(); ctx.roundRect(3,5,w,h,10); ctx.fill();
    var bg=ctx.createLinearGradient(0,0,w,h);
    bg.addColorStop(0,'#f43f5e'); bg.addColorStop(1,'#a855f7');
    ctx.shadowColor='#f43f5e'; ctx.shadowBlur=18+Math.sin(tick*0.1)*6;
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.roundRect(0,0,w,h,10); ctx.fill();
    ctx.shadowBlur=0;
    // strong top-light overlay + bevel
    ctx.save();
    ctx.beginPath(); ctx.roundRect(0,0,w,h,10); ctx.clip();
    var lg=ctx.createLinearGradient(0,0,0,h);
    lg.addColorStop(0,'rgba(255,255,255,0.45)');
    lg.addColorStop(0.35,'rgba(255,255,255,0.08)');
    lg.addColorStop(1,'rgba(0,0,0,0.38)');
    ctx.fillStyle=lg; ctx.fillRect(0,0,w,h);
    bevelEdges(w,h);
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.roundRect(6,5,w-12,7,4); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='800 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(br.name,w/2,h/2+3);
    // HP bar above boss
    var by=-16, pc=Math.max(br.hp,0)/br.max;
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.roundRect(0,by,w,7,4); ctx.fill();
    ctx.fillStyle=pc>0.4?'#fb7185':'#fbbf24';
    ctx.beginPath(); ctx.roundRect(0,by,Math.max(w*pc,4),7,4); ctx.fill();
    ctx.restore();
    return;
  }
  ctx.globalAlpha=0.35+0.65*(br.hp/br.max);
  // soft drop shadow for depth
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.roundRect(1.5,3,w,h,5); ctx.fill();
  if(br.type==='x'){
    // explosive: keep orange glow pulse, add shaded gradient face
    ctx.shadowColor='#fb923c'; ctx.shadowBlur=9+Math.sin(tick*0.16+br.x*0.05)*5;
    ctx.fillStyle=faceGrad('#fb923c',h);
    ctx.beginPath(); ctx.roundRect(0,0,w,h,5); ctx.fill();
    ctx.shadowBlur=0;
  } else if(br.type==='a'){
    // armored: metallic vertical gradient
    var mg=ctx.createLinearGradient(0,0,0,h);
    mg.addColorStop(0,'#eef2f9'); mg.addColorStop(0.45,'#a8b2c6'); mg.addColorStop(0.55,'#8791a9'); mg.addColorStop(1,'#5d6782');
    ctx.fillStyle=mg;
    ctx.beginPath(); ctx.roundRect(0,0,w,h,5); ctx.fill();
  } else {
    ctx.fillStyle=faceGrad(br.col,h);
    ctx.beginPath(); ctx.roundRect(0,0,w,h,5); ctx.fill();
  }
  // beveled edges + surface details, clipped to the face
  ctx.save();
  ctx.beginPath(); ctx.roundRect(0,0,w,h,5); ctx.clip();
  bevelEdges(w,h);
  if(br.type==='a'){
    // travelling metallic sheen band
    var bandX=((tick*1.4+br.x*0.7+br.y*1.3)%(w+60))-30;
    var sg=ctx.createLinearGradient(bandX-13,0,bandX+13,0);
    sg.addColorStop(0,'rgba(255,255,255,0)');
    sg.addColorStop(0.5,'rgba(255,255,255,0.38)');
    sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sg; ctx.fillRect(0,0,w,h);
  }
  ctx.restore();
  if(br.type==='x'){
    ctx.fillStyle='rgba(255,240,200,0.9)';
    ctx.beginPath(); ctx.arc(w/2,h/2,3,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0.3) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // bg: base + layered depth glows
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(-20,-20,W+40,H+40);
  var g=ctx.createRadialGradient(W/2,80,10,W/2,80,420);
  g.addColorStop(0,'rgba(79,70,229,0.13)'); g.addColorStop(1,'transparent');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  var g2=ctx.createRadialGradient(W/2,H-30,10,W/2,H-30,320);
  g2.addColorStop(0,'rgba(6,182,212,0.07)'); g2.addColorStop(1,'transparent');
  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
  // subtle perspective grid receding to a vanishing point above the field
  var vpx=W/2, vpy=-170;
  ctx.strokeStyle='rgba(99,102,241,0.07)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(var gi=0;gi<=8;gi++){
    var bx2=gi*(W/8);
    var t0=(0-vpy)/(H-vpy);
    ctx.moveTo(vpx+(bx2-vpx)*t0,0);
    ctx.lineTo(bx2,H);
  }
  for(var gk=1;gk<=11;gk++){
    var tt=gk/11, gy=vpy+(H-vpy)*tt*tt;
    if(gy<0) continue;
    ctx.moveTo(0,gy); ctx.lineTo(W,gy);
  }
  ctx.stroke();
  // bricks
  bricks.forEach(drawBrick);
  // laser bolts
  bolts.forEach(function(bo){
    ctx.shadowColor='#a855f7'; ctx.shadowBlur=10;
    ctx.fillStyle='#d8b4fe';
    ctx.fillRect(bo.x-2,bo.y,4,16);
    ctx.shadowBlur=0;
  });
  // paddle: soft shadow below, metallic body, top highlight strip
  ctx.save();
  ctx.translate(paddle.x,paddle.y+paddle.h+9); ctx.scale(1,0.28);
  var psg=ctx.createRadialGradient(0,0,0,0,0,paddle.w*0.62);
  psg.addColorStop(0,'rgba(0,0,0,0.5)'); psg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=psg;
  ctx.beginPath(); ctx.arc(0,0,paddle.w*0.62,0,Math.PI*2); ctx.fill();
  ctx.restore();
  var pg=ctx.createLinearGradient(paddle.x-paddle.w/2,0,paddle.x+paddle.w/2,0);
  pg.addColorStop(0,'#4f46e5'); pg.addColorStop(1,'#06b6d4');
  ctx.fillStyle=pg;
  ctx.beginPath();
  ctx.roundRect(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h,7);
  ctx.fill();
  // vertical metallic lighting overlay
  var pv=ctx.createLinearGradient(0,paddle.y,0,paddle.y+paddle.h);
  pv.addColorStop(0,'rgba(255,255,255,0.5)');
  pv.addColorStop(0.28,'rgba(255,255,255,0.12)');
  pv.addColorStop(0.55,'rgba(0,0,0,0.05)');
  pv.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=pv;
  ctx.beginPath();
  ctx.roundRect(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h,7);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.roundRect(paddle.x-paddle.w/2+5,paddle.y+1.5,paddle.w-10,2.2,2);
  ctx.fill();
  if(laserT>0){
    ctx.fillStyle='#a855f7';
    ctx.beginPath(); ctx.arc(paddle.x-paddle.w/2+8,paddle.y+2,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(paddle.x+paddle.w/2-8,paddle.y+2,3.5,0,Math.PI*2); ctx.fill();
  }
  if(stickyT>0){
    ctx.fillStyle='rgba(20,184,166,0.8)';
    ctx.fillRect(paddle.x-paddle.w/2+4,paddle.y-2,paddle.w-8,2);
  }
  // balls (+ speed trail, floor shadow, glossy sphere)
  balls.forEach(function(b){
    // soft elliptical shadow tracking beneath the ball near the paddle zone
    var pd=paddle.y-b.y;
    if(pd<180&&pd>-20){
      var st=1-Math.max(pd,0)/180;
      var srr=b.r*(2.6-1.3*st);
      ctx.save();
      ctx.translate(b.x,paddle.y+paddle.h+10); ctx.scale(1,0.32);
      var ssg=ctx.createRadialGradient(0,0,0,0,0,srr);
      ssg.addColorStop(0,'rgba(0,0,0,'+(0.38*st).toFixed(3)+')');
      ssg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=ssg;
      ctx.beginPath(); ctx.arc(0,0,srr,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    for(var ti=0;ti<b.trail.length;ti++){
      var tp=b.trail[ti], f=(ti+1)/b.trail.length;
      ctx.globalAlpha=f*0.22;
      ctx.fillStyle='#67e8f9';
      ctx.beginPath(); ctx.arc(tp.x,tp.y,b.r*f*0.8,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.shadowColor='#67e8f9'; ctx.shadowBlur=14;
    var bgr=ctx.createRadialGradient(b.x-b.r*0.4,b.y-b.r*0.45,b.r*0.1,b.x,b.y,b.r);
    bgr.addColorStop(0,'#ffffff');
    bgr.addColorStop(0.35,'#e0f2fe');
    bgr.addColorStop(0.8,'#8ecdf3');
    bgr.addColorStop(1,'#4aa8dc');
    ctx.fillStyle=bgr;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(b.x-b.r*0.35,b.y-b.r*0.42,b.r*0.22,0,Math.PI*2); ctx.fill();
  });
  // caps (beveled pill with gloss)
  caps.forEach(function(c){
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.roundRect(c.x-10,c.y-8.5,22,22,6); ctx.fill();
    ctx.fillStyle=faceGrad(c.col,22);
    ctx.save(); ctx.translate(c.x-11,c.y-11);
    ctx.beginPath(); ctx.roundRect(0,0,22,22,6); ctx.fill();
    ctx.beginPath(); ctx.roundRect(0,0,22,22,6); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.fillRect(0,0,22,2);
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,20,22,2);
    ctx.restore();
    ctx.fillStyle='#fff'; ctx.font='800 12px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c.k,c.x,c.y+1);
  });
  ctx.textBaseline='alphabetic';
  // particles
  parts.forEach(function(q){
    ctx.globalAlpha=q.life;
    ctx.fillStyle=q.col;
    ctx.fillRect(q.x-2,q.y-2,4,4);
    ctx.globalAlpha=1;
  });
  // popups
  pops.forEach(function(u){
    ctx.globalAlpha=u.life;
    ctx.fillStyle=u.col;
    ctx.font='800 15px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(u.txt,u.x,u.y);
    ctx.globalAlpha=1;
  });
  // vignette framing the play area
  var vg=ctx.createRadialGradient(W/2,H*0.48,H*0.34,W/2,H*0.52,H*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.42)');
  ctx.fillStyle=vg; ctx.fillRect(-20,-20,W+40,H+40);
  // HUD
  ctx.fillStyle='#f5f7fb'; ctx.font='800 16px sans-serif'; ctx.textAlign='left';
  ctx.fillText(score.toLocaleString(),16,32);
  ctx.fillStyle='#abb5cb'; ctx.font='600 11px sans-serif';
  ctx.fillText('LV '+Math.min(level,MAX_LEVEL)+'/'+MAX_LEVEL+'   BEST '+best.toLocaleString(),16,48);
  ctx.fillStyle='#5f6b8a'; ctx.font='700 9px sans-serif';
  ctx.fillText(pat().name+(pat().boss?' — BOSS':''),16,61);
  ctx.textAlign='right';
  ctx.fillStyle='#f87171'; ctx.font='800 14px sans-serif';
  var hearts=''; for(var i=0;i<lives;i++) hearts+='♥';
  ctx.fillText(hearts,W-16,32);
  // active power timers (small)
  ctx.font='700 9px sans-serif'; ctx.textAlign='right';
  var py=48;
  if(laserT>0){ ctx.fillStyle='#a855f7'; ctx.fillText('LASER '+Math.ceil(laserT/60)+'s',W-16,py); py+=12; }
  if(stickyT>0){ ctx.fillStyle='#14b8a6'; ctx.fillText('CATCH '+Math.ceil(stickyT/60)+'s',W-16,py); py+=12; }
  if(slowT>0){ ctx.fillStyle='#06b6d4'; ctx.fillText('SLOW '+Math.ceil(slowT/60)+'s',W-16,py); }
  if(combo>=3){
    ctx.textAlign='center'; ctx.fillStyle='#67e8f9'; ctx.font='800 13px sans-serif';
    ctx.fillText('COMBO ×'+combo,W/2,32);
  }
  // level intro banner (slide-in)
  if(bannerT>0){
    var el=120-bannerT, xo=0;
    if(el<20){ var e1=1-Math.pow(1-el/20,3); xo=-W*(1-e1); }
    else if(el>100){ var e2=Math.pow((el-100)/20,3); xo=W*e2; }
    ctx.fillStyle='rgba(10,14,26,0.55)';
    ctx.fillRect(-20,H*0.36,W+40,86);
    ctx.textAlign='center';
    ctx.fillStyle='#a5b4fc'; ctx.font='800 30px sans-serif';
    ctx.fillText('LEVEL '+Math.min(level,MAX_LEVEL),W/2+xo,H*0.36+40);
    ctx.fillStyle=pat().boss?'#fb7185':'#67e8f9'; ctx.font='700 13px sans-serif';
    ctx.fillText(pat().boss?'⚠ BOSS: '+pat().name+' ⚠':pat().name,W/2-xo,H*0.36+66);
  }
  if(comboFlash>0){
    ctx.fillStyle='rgba(103,232,249,'+(comboFlash*0.16)+')';
    ctx.fillRect(-20,-20,W+40,H+40);
  }
  if(flash>0){
    ctx.fillStyle='rgba(239,68,68,'+(flash*0.25)+')';
    ctx.fillRect(-20,-20,W+40,H+40);
  }
  if(paused){
    ctx.fillStyle='rgba(10,14,26,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f5f7fb'; ctx.font='800 26px sans-serif'; ctx.textAlign='center';
    ctx.fillText('PAUSED',W/2,H/2);
  }
  ctx.restore();
}

/* ---------- loop ---------- */
function loop(){
  if(state==='play'&&!paused) update();
  if(state!=='start') draw();
  requestAnimationFrame(loop);
}
loop();
})();
</script>
