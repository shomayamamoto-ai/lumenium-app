# 公開サイトに、いま何が出ているか。そして、ビルドは通るのか。
#
# 「直したはずなのに画面が変わらない」ときに答えを出すための確認です。
#
# 手元のコードが正しいことは、ビルドして実際のブラウザで描画すれば確かめ
# られます。確かめられないのは「それが lumenium.net に届いているか」で、
# 開発している作業環境からは外部サイトに接続できません。そのせいで
# 「コードを直すべきなのか、配信側を見るべきなのか」が判断できず、同じ
# 修正を何度も出す状態になっていました。見え方はどちらも同じ
# 「変わらない」だからです。GitHub Actions は外に出られるので、代わりに
# 見てもらいます。
#
# もうひとつ、届かない理由として一番ありそうなのが「配信側でビルドが
# 失敗していて、前の版が出たままになっている」です。手元では通るビルドが
# まっさらな環境では通らない、はよくあります。なので npm ci から本番と
# 同じ手順でビルドし、通るかどうかをここで確かめます。
#
# 失敗では終わらせません。ここが赤くなると持ち主あてに GitHub から
# 「Run failed」のメールが飛びます（それが嫌で死活監視を止めた経緯が
# あります）。知らせたいのは結果であって、警報ではありません。

name: 公開サイトの確認

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-check
  cancel-in-progress: true

jobs:
  # まっさらな環境でビルドが通るか。配信側が失敗する理由の筆頭。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # 同じコミットからビルドしたときの CSS のファイル名。Vite はファイル名に
    # 中身の指紋を付けるので、公開中のものと名前が一致すれば「このコミットが
    # 届いている」と言えます。特定の変更の文字列を探す方式だと、次の変更の
    # ときに古い目印のまま「届いた」と答えてしまいます。
    outputs:
      css: ${{ steps.name.outputs.css }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        id: install
        continue-on-error: true
        run: npm ci

      - name: npm run build（本番と同じ手順）
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: できあがった CSS の名前
        id: name
        if: steps.build.outcome == 'success'
        run: echo "css=$(ls dist/assets/index-*.css | head -1 | sed 's#^dist##')" >> "$GITHUB_OUTPUT"

      - name: 結果
        run: |
          set -u
          echo "npm ci    : ${{ steps.install.outcome }}"
          echo "npm run build: ${{ steps.build.outcome }}"
          echo
          if [ "${{ steps.build.outcome }}" = success ]; then
            echo '結果: まっさらな環境でもビルドは通ります。'
            echo '      配信側でビルドが落ちているわけではなさそうです。'
            echo
            echo '── できあがった CSS ──'
            ls dist/assets/*.css
            grep -o '\.footer-col h4[^}]*}' dist/assets/*.css || true
          else
            echo '結果: まっさらな環境でビルドが通りません。'
            echo '      配信側でも同じところで落ちている可能性が高いです。'
            echo '      上のログに失敗した箇所が出ています。'
          fi

  # 公開中のページが、いまのコードになっているか。
  live:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: いま main にあるもの
        run: git log --oneline -3

      - name: 誰が配信しているか
        run: |
          set -u
          curl -sS --max-time 20 -D headers.txt -o index.html https://lumenium.net/ || true
          echo "── 応答ヘッダ ──"
          grep -i -E '^(HTTP/|server|date|age|cache-control|x-vercel-id|x-vercel-cache|x-github-request-id|via):' headers.txt || true
          echo
          if grep -qi '^x-vercel' headers.txt; then
            echo '配信元: Vercel'
          elif grep -qi 'GitHub.com' headers.txt; then
            echo '配信元: GitHub Pages ← Vercel ではありません。'
          else
            echo '配信元: 判別できませんでした（上のヘッダを見てください）'
          fi

      - name: このコミットが公開されるまで待つ（最大4分）
        env:
          WANT: ${{ needs.build.outputs.css }}
        run: |
          set -u
          echo "このコミットの CSS: ${WANT:-（ビルドできず不明）}"
          if [ -z "${WANT:-}" ]; then
            echo ' 結果: このコミットはビルドが通らないため、公開されません。上の build を見てください。'
            exit 0
          fi
          FOUND=no
          for i in $(seq 1 12); do
            curl -sS --max-time 20 -o index.html "https://lumenium.net/?cachebust=$(date +%s)" || true
            CSS=$(grep -o '/assets/index-[A-Za-z0-9._-]*\.css' index.html | head -1)
            [ "$CSS" = "$WANT" ] && FOUND=yes
            echo "[$i/12] 公開中の CSS=${CSS:-見つからず}  一致=${FOUND}"
            [ "$FOUND" = yes ] && break
            sleep 20
          done
          echo
          if [ "$FOUND" = yes ]; then
            echo ' 結果: このコミットが公開されています。'
          else
            echo ' 結果: 4分待っても、このコミットは公開されていません。'
            echo ' Vercel の Deployments で、このコミットのビルドが Error になっていないか確認してください。'
          fi
