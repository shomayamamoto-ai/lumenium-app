    <!-- Cache-buster version (bumped on every deploy). If this differs from
         the version the browser last saw, we treat the shell as stale and
         self-repair (unregister SW + clear caches + reload once). -->
    <meta name="app-version" content="2026-04-24-polish-v12" />
    <!-- EARLY CACHE KILL-SWITCH — runs before any other script/module.
         Fixes users stuck on a stale index.html whose bundle hashes no longer
         exist on the server after a fresh deploy (they were seeing the root
         ErrorBoundary "一時的に表示できませんでした"). -->
    <script>
      (function(){
        try {
          var VERSION = '2026-04-24-polish-v12';
          var KEY = 'lumenium_shell_v';
          var RELOAD_KEY = 'lumenium_shell_reloaded_at';
          var seen = null;
          try { seen = localStorage.getItem(KEY); } catch(_) {}
          var isNew = seen !== VERSION;

          // Always unregister any stray service worker and purge its caches.
          if ('serviceWorker' in navigator) {
            try {
              navigator.serviceWorker.getRegistrations().then(function(regs){
                regs.forEach(function(r){ try { r.unregister(); } catch(_){} });
              }).catch(function(){});
            } catch(_) {}
          }
          if (window.caches && caches.keys) {
            try {
              caches.keys().then(function(keys){
                keys.forEach(function(k){ try { caches.delete(k); } catch(_){} });
              }).catch(function(){});
            } catch(_) {}
          }

          if (isNew) {
            try { localStorage.setItem(KEY, VERSION); } catch(_) {}
            // Only hard-reload for returning users (those who had a previous
            // version) — first-time visitors don't need it. And only once per
            // version to avoid reload loops.
            var isReturning = seen !== null;
            var last = 0;
            try { last = Number(sessionStorage.getItem(RELOAD_KEY) || 0); } catch(_) {}
            var now = Date.now();
            if (isReturning && now - last > 30000) {
              try { sessionStorage.setItem(RELOAD_KEY, String(now)); } catch(_) {}
              // Give the unregister() calls above a beat to start, then hard-reload
              // with a cache-busting query so even an intermediate proxy can't
              // hand us the stale shell.
              setTimeout(function(){
                var u = new URL(window.location.href);
                u.searchParams.set('_v', VERSION);
                window.location.replace(u.toString());
              }, 120);
            }
          }
        } catch(_) {}
      })();
    </script>

    <!-- Without JavaScript the splash never lifts. The page under it is real

  <body style="background:#f6f4ef;margin:0;">
    <div id="root">
      <!-- Pre-mount placeholder: seamless canvas that matches the page background.
           It sits on top of the prerendered page below it until React mounts
           (createRoot replaces everything in #root, this included), so a
           visitor sees exactly what they saw before: the plain background,
           then the page. -->
      <div id="boot-splash" style="position:fixed;inset:0;z-index:99999;background:#f6f4ef;"></div>
      <!-- Whether the opening plays is decided here, once, before anything is
           drawn: on the top page, opened from outside the site, once per tab.
           Not for a link to a place on the page (#contact-form …), not when
           arriving from one of our own pages, not for automated browsers
           (?intro forces it). The placeholder turns dark to match the opening,
           so the light page never flashes in between. App reads the flag. -->
      <script>
        (function () {
          try {
            var l = location, q = /[?&]intro\b/.test(l.search), seen = false
            try { seen = sessionStorage.getItem('lum:intro') === '1' } catch (e) {}
            var inside = false
            try { inside = !!document.referrer && new URL(document.referrer).origin === l.origin } catch (e) {}
            var play = q || (l.pathname === '/' && !l.hash && !seen && !inside && !navigator.webdriver)
            if (!play) return
            window.__lumIntro = true
            var b = document.getElementById('boot-splash')
            if (b) b.style.background = '#010104'
          } catch (e) {}
        })()
      </script>
      <!--prerender:app-->
    </div>

    <script>
      // Service Worker — DISABLED until splash issue resolved.
      if ('serviceWorker' in navigator) {
        try {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          }).catch(function(){});
          if (window.caches && caches.keys) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            }).catch(function(){});
          }
        } catch (e) {}
      }

      // Error diagnostic — log to console always; show on-screen only when ?debug=1.
      // (The on-screen overlay was catching benign third-party rejections, e.g. LINE
      // in-app browser's LIFF bridge, and flashing them to end-users.)
      (function() {
        var showOverlay = /[?&]debug=1\b/.test(location.search);
        function report(msg, src) {
          try { console.error('[diag]', msg, src || ''); } catch (_) {}
          if (!showOverlay) return;
          var el = document.getElementById('boot-splash-error');
          if (!el) {
            el = document.createElement('div');
            el.id = 'boot-splash-error';
            el.style.cssText = 'position:fixed;bottom:20px;left:20px;right:20px;z-index:999999;background:rgba(239,68,68,0.95);color:#fff;padding:14px 18px;border-radius:8px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-all;line-height:1.5;';
            document.body.appendChild(el);
          }
          el.textContent += '[' + new Date().toLocaleTimeString() + '] ' + msg + (src ? ' @ ' + src : '') + '\n';
        }
        window.addEventListener('error', function(e) {
          report(e.message || 'unknown error', e.filename ? (e.filename + ':' + e.lineno) : '');
        });
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          report('UnhandledRejection: ' + (r && (r.message || r.toString()) || 'unknown'));
        });
        // If after 6s #root still has the boot-splash, React never mounted — always surface this one.
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.querySelector('#boot-splash')) {
            var prev = showOverlay; showOverlay = true;
            report('React did not mount within 6s. Bundle may have failed to execute.');
            showOverlay = prev;
          }
        }, 6000);
      })();
    </script>
