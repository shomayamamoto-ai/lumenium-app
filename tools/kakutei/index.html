<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>じぶん確定申告</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface2:#f1f4f8; --line:#e0e5ec; --line2:#cfd6df;
  --text:#1c2632; --muted:#647180; --brand:#2463eb; --brand-weak:#e7eeff; --brand-ink:#ffffff;
  --pos:#0e9f66; --pos-weak:#e2f5ec; --neg:#d93a50; --neg-weak:#fde8eb; --warn:#b86e00; --warn-weak:#fff2dc;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07); --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d25; --surface2:#1c252f; --line:#29343f; --line2:#364350;
  --text:#e5eaf0; --muted:#94a1ae; --brand:#5b8dff; --brand-weak:#1b2944; --brand-ink:#0b1220;
  --pos:#3cc98d; --pos-weak:#143027; --neg:#ff6b7e; --neg-weak:#3a1c23; --warn:#f0a63a; --warn-weak:#382a13;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d25; --surface2:#1c252f; --line:#29343f; --line2:#364350;
  --text:#e5eaf0; --muted:#94a1ae; --brand:#5b8dff; --brand-weak:#1b2944; --brand-ink:#0b1220;
  --pos:#3cc98d; --pos-weak:#143027; --neg:#ff6b7e; --neg-weak:#3a1c23; --warn:#f0a63a; --warn-weak:#382a13;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.num,.tbl td.r,.tbl th.r{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.logo span{color:var(--brand)}
.top .sp{flex:1}
.top select{padding:6px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-weight:700}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap}
#saveState.bad{color:var(--neg);font-weight:700}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 53px)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:12px 10px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
nav.side button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--text);font-weight:600;font-size:13.5px}
nav.side button:hover{background:var(--surface2)}
nav.side button.on{background:var(--brand-weak);color:var(--brand)}
nav.side .grp{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;padding:12px 12px 4px}
main{padding:22px 24px 80px;max-width:1080px;width:100%}
h1.ttl{font-size:21px;margin:0 0 4px}
p.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.card h3 small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.dan{color:var(--neg)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 16px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on.income{background:var(--pos-weak);color:var(--pos)}
.seg button.on.expense{background:var(--neg-weak);color:var(--neg)}
.seg button.on.transfer{background:var(--brand-weak);color:var(--brand)}
.seg button.on.plain{background:var(--brand-weak);color:var(--brand)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label{font-size:12px;font-weight:700;color:var(--muted)}
.in,select.in,textarea.in{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);min-width:0}
.in:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:0;border-color:var(--brand)}
.in.r{text-align:right;font-variant-numeric:tabular-nums}
.in.w-s{max-width:120px} .in.w-m{max-width:220px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:2px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:9px;padding:10px 12px;margin:10px 0 0}
.alert{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:13px;border:1px solid}
.alert.warn{background:var(--warn-weak);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--text)}
.alert.warn b{color:var(--warn)}
.alert.info{background:var(--brand-weak);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.alert.ok{background:var(--pos-weak);border-color:color-mix(in srgb,var(--pos) 30%,transparent)}
.tblw{overflow:auto;border:1px solid var(--line);border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--surface2);text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.tbl tr.sub td{background:var(--surface2);font-weight:700}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--line2)}
.tbl tr.sec td{background:var(--surface2);font-weight:700;color:var(--muted);font-size:12px}
.tbl td.ind{padding-left:24px}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--brand) 4%,transparent)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.income{background:var(--pos-weak);color:var(--pos)}
.badge.expense{background:var(--neg-weak);color:var(--neg)}
.badge.transfer{background:var(--brand-weak);color:var(--brand)}
.badge.gray{background:var(--surface2);color:var(--muted)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;background:var(--surface2);color:var(--muted)}
.steps .dot.ok{background:var(--pos);color:#fff}
.steps .t{flex:1;min-width:0}
.steps .t b{display:block}
.steps .t span{font-size:12px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.chart .bars{height:124px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.chart .b{width:42%;border-radius:4px 4px 0 0;min-height:1px}
.chart .b.i{background:var(--pos)} .chart .b.e{background:var(--neg);opacity:.8}
.chart .lbl{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.calc td:first-child{width:62%}
.big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:700}
.guide ol{padding-left:20px;margin:6px 0}
.guide li{margin:6px 0}
.res{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.res b{font-variant-numeric:tabular-nums}
.dedrow{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:14px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.dedrow:first-of-type{border-top:0}
.dedrow .amt{text-align:right}
.dedrow .amt small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.dedrow .amt b{font-size:16px;font-variant-numeric:tabular-nums}
.dedrow h4{margin:0 0 6px;font-size:14px}
.inl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav.side{position:sticky;top:53px;z-index:15;height:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  nav.side .grp{display:none}
  nav.side button{width:auto;white-space:nowrap;padding:7px 11px}
  main{padding:16px 16px 80px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kpi .v{font-size:19px}
  .dedrow{grid-template-columns:1fr}
  .dedrow .amt{text-align:left}
  .logo small{display:none}
  #saveState:not(.bad){display:none}
  header.top{padding:10px 12px}
}
@media print{
  header.top,nav.side,.noprint,.btn,.subtabs{display:none!important}
  .layout{display:block}
  main{padding:0;max-width:none}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border-color:#bbb;break-inside:avoid}
  .tblw{overflow:visible}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo">じぶん<span>確定申告</span> <small class="mut" style="font-weight:500;font-size:12px">個人事業主・フリーランス向け</small></div>
  <div class="sp"></div>
  <select id="yearSel" aria-label="年分"></select>
  <span id="saveState">自動保存</span>
</header>
<div class="layout">
  <nav class="side" id="nav"></nav>
  <main id="view"></main>
</div>

<!-- ============================================================
     計算エンジン（DOMに触れない純粋な関数だけ）
     ============================================================ -->
<script id="engine">
"use strict";
const fl = Math.floor;
const num = v => { if (v == null || v === '') return 0; const n = Number(String(v).normalize('NFKC').replace(/[,\s円¥￥]/g, '')); return Number.isFinite(n) ? Math.round(n) : 0; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sumBy = (arr, k) => arr.reduce((s, x) => s + (typeof k === 'function' ? k(x) : x[k]), 0);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

// 年分ごとの税制パラメータ（所得税）
const YEARCFG = {
  2025: {
    label: '令和7年分', filing: ['2026-02-16', '2026-03-16'], ctaxDue: '2026-03-31',
    basic: t => t <= 1320000 ? 950000 : t <= 3360000 ? 880000 : t <= 4890000 ? 680000 : t <= 6550000 ? 630000
      : t <= 23500000 ? 580000 : t <= 24000000 ? 480000 : t <= 24500000 ? 320000 : t <= 25000000 ? 160000 : 0,
    salaryMin: 650000, depLimit: 580000, lifeKidSpecial: false, twoWari: true,
  },
  2026: {
    label: '令和8年分', filing: ['2027-02-16', '2027-03-15'], ctaxDue: '2027-03-31',
    basic: t => t <= 4890000 ? 1040000 : t <= 6550000 ? 670000 : t <= 23500000 ? 620000
      : t <= 24000000 ? 480000 : t <= 24500000 ? 320000 : t <= 25000000 ? 160000 : 0,
    salaryMin: 740000, depLimit: 620000, lifeKidSpecial: true, twoWari: true,
  },
};
const cfgOf = y => YEARCFG[y] || YEARCFG[2026];

const INCOME_ACCTS = ['売上高', '雑収入'];
const EXPENSES = ['租税公課', '荷造運賃', '水道光熱費', '旅費交通費', '通信費', '広告宣伝費', '接待交際費', '損害保険料',
  '修繕費', '消耗品費', '減価償却費', '福利厚生費', '給料賃金', '外注工賃', '利子割引料', '地代家賃', '貸倒金',
  '支払手数料', '新聞図書費', '研修費', '会議費', '諸会費', '車両費', '雑費'];
const EXPENSE_INPUT = ['仕入高', ...EXPENSES.filter(a => a !== '減価償却費')];
const ASSET_CATS = ['工具器具備品', 'ソフトウェア', '車両運搬具', '機械装置', '建物附属設備'];
const BS_ASSETS = ['現金', '普通預金', '売掛金', '商品', ...ASSET_CATS, '一括償却資産', '事業主貸'];
const BS_LIABS = ['未払金', '預り金', '事業主借', '元入金'];
const ACCT_HINT = {
  '売上高': '本業の売上（請求額・税込）。源泉徴収された場合も差し引く前の金額', '雑収入': '本業以外の事業収入（協賛金、不用品売却など）',
  '仕入高': '販売する商品・材料の仕入', '租税公課': '個人事業税・印紙・事業用の固定資産税（所得税・住民税は不可）',
  '荷造運賃': '発送費・梱包資材', '水道光熱費': '電気・ガス・水道（自宅なら按分）', '旅費交通費': '電車・バス・タクシー・出張の宿泊',
  '通信費': 'スマホ・ネット回線・サーバー・SaaS・切手', '広告宣伝費': '広告・チラシ・Web広告・名刺', '接待交際費': '取引先との飲食・贈答',
  '損害保険料': '事業用の火災保険・賠償責任保険', '修繕費': '事業用資産の修理', '消耗品費': '10万円未満の備品・文具・ソフト',
  '福利厚生費': '従業員の慶弔・健康診断（本人分は不可）', '給料賃金': '従業員・アルバイトへの給与', '外注工賃': '業務委託・外注費',
  '利子割引料': '事業用借入の利息', '地代家賃': '事務所・駐車場の賃料（自宅なら按分）', '貸倒金': '回収不能になった売掛金',
  '支払手数料': '振込手数料・決済手数料・仲介手数料', '新聞図書費': '書籍・新聞・電子書籍・有料記事', '研修費': 'セミナー・講座の受講料',
  '会議費': '打合せの飲食・会議室', '諸会費': '業界団体・商工会の会費', '車両費': 'ガソリン・車検・駐車場（按分）', '雑費': 'どれにも当てはまらない少額の経費',
};
const TAX_DEFAULT = { '雑収入': '0', '租税公課': '0', '損害保険料': '0', '給料賃金': '0', '利子割引料': '0', '貸倒金': '0', '諸会費': '0', '地代家賃': '0' };
const taxDef = a => TAX_DEFAULT[a] ?? '10';
const KANI_RATE = { 1: .9, 2: .8, 3: .7, 4: .6, 5: .5, 6: .4 };
const DISAB = { none: 0, normal: 270000, special: 400000, together: 750000 };
const DISAB_R = { none: 0, normal: 260000, special: 300000, together: 530000 };

function defYear() {
  return {
    blue: '65', bizTax: 5, ctax: 'exempt', kani: 5, ctaxInterim: 0,
    opening: { wallets: {}, ar: 0, ap: 0 }, inv: { start: 0, end: 0 },
    salary: { revenue: 0, withheld: 0, social: 0 }, misc: { revenue: 0, expense: 0, withheld: 0 },
    ded: { social: 0, smallBiz: 0, lifeNewGen: 0, lifeOldGen: 0, lifeCare: 0, lifeNewPen: 0, lifeOldPen: 0, quake: 0,
      medMode: 'normal', medPaid: 0, medReimb: 0, selfMed: 0, donation: 0, housing: 0, prepaid: 0, otherWh: 0,
      selfStatus: 'none', selfDisab: 'none' },
    spouse: { has: false, income: 0, elderly: false, disab: 'none' },
    deps: [], checks: {},
  };
}
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
function fillIn(target, base) {
  for (const k of Object.keys(base)) {
    if (target[k] === undefined || target[k] === null) target[k] = base[k];
    else if (isObj(target[k]) && isObj(base[k])) fillIn(target[k], base[k]);
  }
  return target;
}
function yearOf(D, y = D.year) {
  const k = String(y); D.years = D.years || {};
  D.years[k] = isObj(D.years[k]) ? fillIn(D.years[k], defYear()) : defYear();
  if (!Array.isArray(D.years[k].deps)) D.years[k].deps = [];
  return D.years[k];
}

function walletAcct(D, wid, side) {
  if (wid === 'ar') return { a: '売掛金', s: '' };
  if (wid === 'ap') return { a: '未払金', s: '未払い' };
  if (wid === 'private') return { a: side === 'dr' ? '事業主貸' : '事業主借', s: '' };
  const w = D.wallets.find(x => x.id === wid) || { kind: 'cash', name: '現金' };
  return { a: w.kind === 'bank' ? '普通預金' : w.kind === 'card' ? '未払金' : '現金', s: w.name };
}

// ---- 給与所得（給与所得控除後の金額。660万円未満は所得税法別表第五の端数処理に準拠） ----
function salaryIncome(rev, cfg) {
  rev = Math.max(0, fl(num(rev)));
  if (!rev) return 0;
  let inc;
  if (rev < 1900000) inc = rev - 650000;
  else if (rev < 6600000) { const A = fl(rev / 4 / 1000) * 1000; inc = rev < 3600000 ? A * 28 / 10 - 80000 : A * 32 / 10 - 440000; }
  else if (rev < 8500000) inc = fl(rev * 9 / 10) - 1100000;
  else inc = rev - 1950000;
  inc = Math.min(inc, rev - cfg.salaryMin);
  return Math.max(0, fl(inc));
}

// ---- 生命保険料控除 ----
const cl = Math.ceil;
const lifeNew = x => x <= 0 ? 0 : x <= 20000 ? x : x <= 40000 ? cl(x / 2 + 10000) : x <= 80000 ? cl(x / 4 + 20000) : 40000;
const lifeNewKid = x => x <= 0 ? 0 : x <= 30000 ? x : x <= 60000 ? cl(x / 2 + 15000) : x <= 120000 ? cl(x / 4 + 30000) : 60000;
const lifeOld = x => x <= 0 ? 0 : x <= 25000 ? x : x <= 50000 ? cl(x / 2 + 12500) : x <= 100000 ? cl(x / 4 + 25000) : 50000;
function lifeCat(newAmt, oldAmt, newFn, limit) {
  const n = newFn(newAmt), o = lifeOld(oldAmt);
  if (newAmt > 0 && oldAmt > 0) return Math.max(o, Math.min(n + o, limit));
  return n || o;
}
function lifeDeduction(d, kid) {
  const gen = lifeCat(num(d.lifeNewGen), num(d.lifeOldGen), kid ? lifeNewKid : lifeNew, kid ? 60000 : 40000);
  const care = lifeNew(num(d.lifeCare));
  const pen = lifeCat(num(d.lifeNewPen), num(d.lifeOldPen), lifeNew, 40000);
  return Math.min(120000, gen + care + pen);
}
// 住民税
const lifeNewR = x => x <= 0 ? 0 : x <= 12000 ? x : x <= 32000 ? cl(x / 2 + 6000) : x <= 56000 ? cl(x / 4 + 14000) : 28000;
const lifeOldR = x => x <= 0 ? 0 : x <= 15000 ? x : x <= 40000 ? cl(x / 2 + 7500) : x <= 70000 ? cl(x / 4 + 17500) : 35000;
function lifeCatR(n0, o0) { const n = lifeNewR(n0), o = lifeOldR(o0); return n0 > 0 && o0 > 0 ? Math.max(o, Math.min(n + o, 28000)) : (n || o); }
function lifeDeductionR(d) { return Math.min(70000, lifeCatR(num(d.lifeNewGen), num(d.lifeOldGen)) + lifeNewR(num(d.lifeCare)) + lifeCatR(num(d.lifeNewPen), num(d.lifeOldPen))); }

// ---- 配偶者控除・配偶者特別控除 ----
const SPOUSE_SP = [[950000, [380000, 260000, 130000]], [1000000, [360000, 240000, 120000]], [1050000, [310000, 210000, 110000]],
  [1100000, [260000, 180000, 90000]], [1150000, [210000, 140000, 70000]], [1200000, [160000, 110000, 60000]],
  [1250000, [110000, 80000, 40000]], [1300000, [60000, 40000, 20000]], [1330000, [30000, 20000, 10000]]];
const SPOUSE_SP_R = [[950000, [330000, 220000, 110000]], [1000000, [330000, 220000, 110000]], [1050000, [310000, 210000, 110000]],
  [1100000, [260000, 180000, 90000]], [1150000, [210000, 140000, 70000]], [1200000, [160000, 110000, 60000]],
  [1250000, [110000, 80000, 40000]], [1300000, [60000, 40000, 20000]], [1330000, [30000, 20000, 10000]]];
function spouseDed(selfTotal, sp, L, resident) {
  if (!sp || !sp.has || selfTotal > 10000000) return { kind: '', amt: 0 };
  const col = selfTotal <= 9000000 ? 0 : selfTotal <= 9500000 ? 1 : 2;
  const inc = num(sp.income);
  if (inc <= L) {
    const t = resident ? (sp.elderly ? [380000, 260000, 130000] : [330000, 220000, 110000]) : (sp.elderly ? [480000, 320000, 160000] : [380000, 260000, 130000]);
    return { kind: '配偶者控除', amt: t[col] };
  }
  for (const [lim, t] of (resident ? SPOUSE_SP_R : SPOUSE_SP)) if (inc <= lim) return { kind: '配偶者特別控除', amt: t[col] };
  return { kind: '', amt: 0 };
}
// ---- 特定親族特別控除（19〜22歳で所得が扶養の基準を超える親族） ----
const TOKUTEI = [[850000, 630000], [900000, 610000], [950000, 510000], [1000000, 410000], [1050000, 310000], [1100000, 210000], [1150000, 110000], [1200000, 60000], [1230000, 30000]];
const TOKUTEI_R = [[950000, 450000], [1000000, 410000], [1050000, 310000], [1100000, 210000], [1150000, 110000], [1200000, 60000], [1230000, 30000]];
function depDed(p, L, resident) {
  const age = num(p.age), inc = num(p.income);
  if (inc <= L) {
    if (age < 16) return { kind: '年少扶養（控除なし）', amt: 0, isDep: true };
    if (age >= 19 && age <= 22) return { kind: '特定扶養親族', amt: resident ? 450000 : 630000, isDep: true };
    if (age >= 70) return p.together ? { kind: '同居老親等', amt: resident ? 450000 : 580000, isDep: true } : { kind: '老人扶養親族', amt: resident ? 380000 : 480000, isDep: true };
    return { kind: '一般の扶養親族', amt: resident ? 330000 : 380000, isDep: true };
  }
  if (age >= 19 && age <= 22) {
    for (const [lim, v] of (resident ? TOKUTEI_R : TOKUTEI)) if (inc <= lim) return { kind: '特定親族特別控除', amt: v, tokutei: true };
  }
  return { kind: '所得が基準超（対象外）', amt: 0 };
}

// ---- 所得税の速算表 ----
const BRACKETS = [[1949000, .05, 0], [3299000, .10, 97500], [6949000, .20, 427500], [8999000, .23, 636000], [17999000, .33, 1536000], [39999000, .40, 2796000], [Infinity, .45, 4796000]];
function incomeTax(t) { if (t < 1000) return 0; for (const [lim, r, d] of BRACKETS) if (t <= lim) return fl((t * Math.round(r * 100) - d * 100) / 100); return 0; }
function marginalRate(t) { if (t < 1000) return 0; for (const [lim, r] of BRACKETS) if (t <= lim) return r; return .45; }
function withholdingOf(x) { x = Math.max(0, num(x)); return x <= 1000000 ? fl(x * 1021 / 10000) : fl((x - 1000000) * 2042 / 10000) + 102100; }

// ---- 減価償却 ----
const smallLimit = date => (date || '') >= '2026-04-01' ? 400000 : 300000;
function assetSchedule(a, year) {
  const cost = num(a.cost);
  if (!a.date || cost <= 0) return null;
  const ay = +a.date.slice(0, 4), am = +a.date.slice(5, 7) || 1;
  if (!ay || ay > year) return null;
  const life = Math.max(2, num(a.life) || 4);
  const R = Math.ceil(1000 / life);                 // 定額法の償却率（×1000）
  let book = cost, startBook = cost, dep = 0, months = 0;
  for (let y = ay; y <= year; y++) {
    let d = 0, m = 0;
    if (a.method === 'small') { m = y === ay ? 13 - am : 0; d = y === ay ? book : 0; }
    else if (a.method === 'lump3') { const k = y - ay; m = k < 3 ? 12 : 0; d = k < 2 ? fl(cost / 3) : k === 2 ? book : 0; }
    else { m = y === ay ? 13 - am : 12; d = Math.min(Math.ceil(cost * R * m / 12000), Math.max(0, book - 1)); }
    if (y === year) { startBook = book; dep = d; months = m; }
    book -= d;
  }
  const ratio = clamp(a.ratio == null || a.ratio === '' ? 100 : num(a.ratio), 0, 100);
  return { thisYear: ay === year, startBook: ay === year ? 0 : startBook, dep, bizDep: Math.round(dep * ratio / 100), endBook: book, months, rate: R / 1000, life, ratio };
}

// ============================================================
//  全体計算：仕訳 → 試算表 → 決算書 → 税額
// ============================================================
function compute(D) {
  const year = D.year, ys = String(year), cfg = cfgOf(year), Y = yearOf(D), L = cfg.depLimit;
  const warnings = [];
  const Ln = (a, s, dr, cr) => ({ a, s: s || '', dr, cr });
  const J = [];

  const txs = D.txs.filter(t => (t.date || '').startsWith(ys)).sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  const assets = D.assets.map(a => ({ a, s: assetSchedule(a, year) })).filter(x => x.s);
  const assetAcct = a => a.method === 'lump3' ? '一括償却資産' : (a.cat || '工具器具備品');

  // 期首残高
  const ol = [];
  for (const w of D.wallets) {
    const v = num(Y.opening.wallets[w.id]); if (!v) continue;
    if (w.kind === 'card') ol.push(Ln('未払金', w.name, 0, v));
    else ol.push(Ln(w.kind === 'bank' ? '普通預金' : '現金', w.name, v, 0));
  }
  if (num(Y.opening.ar)) ol.push(Ln('売掛金', '', num(Y.opening.ar), 0));
  if (num(Y.opening.ap)) ol.push(Ln('未払金', '未払い', 0, num(Y.opening.ap)));
  if (num(Y.inv.start)) ol.push(Ln('商品', '', num(Y.inv.start), 0));
  for (const { a, s } of assets) if (!s.thisYear && s.startBook > 0) ol.push(Ln(assetAcct(a), a.name, s.startBook, 0));
  const capital = sumBy(ol, 'dr') - sumBy(ol, 'cr');
  if (capital) ol.push(capital > 0 ? Ln('元入金', '', 0, capital) : Ln('元入金', '', -capital, 0));
  if (ol.length) J.push({ date: ys + '-01-01', desc: '期首残高', lines: ol, src: 'open' });

  // 取引 → 仕訳
  for (const t of txs) {
    const amt = num(t.amount); if (amt <= 0) continue;
    const lines = [];
    if (t.type === 'income') {
      const wh = clamp(num(t.wh), 0, amt), w = walletAcct(D, t.wallet, 'dr');
      if (amt - wh) lines.push(Ln(w.a, w.s, amt - wh, 0));
      if (wh) lines.push(Ln('事業主貸', '源泉所得税', wh, 0));
      lines.push(Ln(t.acct || '売上高', '', 0, amt));
    } else if (t.type === 'expense') {
      const r = clamp(t.ratio == null || t.ratio === '' ? 100 : num(t.ratio), 0, 100), biz = Math.round(amt * r / 100);
      if (biz) lines.push(Ln(t.acct || '雑費', '', biz, 0));
      if (amt - biz) lines.push(Ln('事業主貸', '家事分', amt - biz, 0));
      const w = walletAcct(D, t.wallet, 'cr'); lines.push(Ln(w.a, w.s, 0, amt));
    } else {
      const to = walletAcct(D, t.to, 'dr'), fr = walletAcct(D, t.wallet, 'cr');
      lines.push(Ln(to.a, to.s, amt, 0), Ln(fr.a, fr.s, 0, amt));
    }
    J.push({ date: t.date, desc: t.memo || '', partner: t.partner || '', lines, src: 'tx', ref: t.id, type: t.type });
  }
  // 固定資産：取得と減価償却
  let smallTotal = 0;
  for (const { a, s } of assets) {
    const acct = assetAcct(a), cost = num(a.cost);
    if (s.thisYear) {
      const w = walletAcct(D, a.wallet || 'private', 'cr');
      J.push({ date: a.date, desc: `${a.name} を取得`, lines: [Ln(acct, a.name, cost, 0), Ln(w.a, w.s, 0, cost)], src: 'asset', ref: a.id });
    }
    if (s.dep > 0) {
      const lines = [];
      if (s.bizDep) lines.push(Ln('減価償却費', '', s.bizDep, 0));
      if (s.dep - s.bizDep) lines.push(Ln('事業主貸', '家事分', s.dep - s.bizDep, 0));
      lines.push(Ln(acct, a.name, 0, s.dep));
      J.push({ date: ys + '-12-31', desc: `${a.name} の減価償却`, lines, src: 'dep', ref: a.id });
    }
    if (a.method === 'small' && s.thisYear) {
      smallTotal += cost;
      if (Y.blue === 'white') warnings.push(`「${a.name}」：少額減価償却資産の特例は青色申告のみ使えます。白色申告では通常の減価償却を選んでください。`);
      if (cost >= smallLimit(a.date)) warnings.push(`「${a.name}」：取得価額が${(smallLimit(a.date) / 10000)}万円以上のため、少額減価償却資産の特例は使えません。`);
    }
    if (a.method === 'lump3' && cost >= 200000) warnings.push(`「${a.name}」：一括償却資産（3年均等）は20万円未満の資産のみです。`);
  }
  if (smallTotal > 3000000) warnings.push(`少額減価償却資産の特例は年間合計300万円までです（現在 ${smallTotal.toLocaleString()}円）。`);
  // 棚卸
  const invS = num(Y.inv.start), invE = num(Y.inv.end);
  if (invS) J.push({ date: ys + '-12-31', desc: '期首商品の振替', lines: [Ln('期首商品棚卸高', '', invS, 0), Ln('商品', '', 0, invS)], src: 'close' });
  if (invE) J.push({ date: ys + '-12-31', desc: '期末商品の棚卸', lines: [Ln('商品', '', invE, 0), Ln('期末商品棚卸高', '', 0, invE)], src: 'close' });

  const ord = { open: 0, tx: 1, asset: 1, dep: 2, close: 3 };
  J.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : ord[x.src] - ord[y.src]);
  J.forEach((e, i) => e.no = i + 1);

  // 試算表
  const tb = {}, tbs = {};
  for (const e of J) for (const l of e.lines) {
    (tb[l.a] = tb[l.a] || { dr: 0, cr: 0 }); tb[l.a].dr += l.dr; tb[l.a].cr += l.cr;
    const k = l.a + '|' + l.s; (tbs[k] = tbs[k] || { a: l.a, s: l.s, dr: 0, cr: 0 }); tbs[k].dr += l.dr; tbs[k].cr += l.cr;
  }
  const bal = a => tb[a] ? tb[a].dr - tb[a].cr : 0;
  const openBal = {};
  if (J[0] && J[0].src === 'open') for (const l of J[0].lines) openBal[l.a] = (openBal[l.a] || 0) + l.dr - l.cr;

  // 損益計算書
  const sales = -bal('売上高'), miscRev = -bal('雑収入'), revenue = sales + miscRev;
  const purchases = bal('仕入高'), invStart = bal('期首商品棚卸高'), invEnd = -bal('期末商品棚卸高');
  const cogs = invStart + purchases - invEnd, gross = revenue - cogs;
  const exp = EXPENSES.map(a => ({ a, v: bal(a) }));
  const expTotal = sumBy(exp, 'v');
  const beforeBlue = gross - expTotal;
  const blueCap = { '65': 650000, '55': 550000, '10': 100000 }[Y.blue] || 0;
  const blueDed = Y.blue === 'white' ? 0 : Math.max(0, Math.min(blueCap, beforeBlue));
  const bizIncome = beforeBlue - blueDed;

  // 貸借対照表
  const known = new Set([...BS_ASSETS, ...BS_LIABS, ...INCOME_ACCTS, ...EXPENSES, '仕入高', '期首商品棚卸高', '期末商品棚卸高']);
  const bsA = BS_ASSETS.map(a => ({ a, open: openBal[a] || 0, v: bal(a) }));
  const bsL = BS_LIABS.map(a => ({ a, open: -(openBal[a] || 0), v: -bal(a) }));
  for (const a of Object.keys(tb)) if (!known.has(a)) { const v = bal(a); (v >= 0 ? bsA : bsL).push({ a, open: 0, v: Math.abs(v) }); }
  const totA = sumBy(bsA, 'v'), totL = sumBy(bsL, 'v') + beforeBlue;
  if (Math.abs(totA - totL) > 0) warnings.push('貸借対照表の左右が一致しません。取引データを確認してください。');

  // 残高チェック
  const subBal = (a, s) => { const x = tbs[a + '|' + s]; return x ? x.dr - x.cr : 0; };
  const walletEnd = {};
  for (const w of D.wallets) {
    const acc = walletAcct(D, w.id, 'dr');
    walletEnd[w.id] = w.kind === 'card' ? -subBal(acc.a, acc.s) : subBal(acc.a, acc.s);
  }
  const running = {};
  const minBal = {};
  for (const e of J) for (const l of e.lines) {
    if (l.a !== '現金' && l.a !== '普通預金') continue;
    const k = l.a + '|' + l.s; running[k] = (running[k] || 0) + l.dr - l.cr;
    if (minBal[k] == null || running[k] < minBal[k].v) minBal[k] = { v: running[k], date: e.date };
  }
  for (const [k, m] of Object.entries(minBal)) if (m.v < 0) warnings.push(`「${k.split('|')[1] || k.split('|')[0]}」の残高が ${m.date} 時点でマイナス（${m.v.toLocaleString()}円）になっています。入力漏れ（入金・引き出し）や期首残高を確認してください。`);
  const arEnd = bal('売掛金');
  if (arEnd < 0) warnings.push('売掛金がマイナスです。入金の振替が二重になっていないか確認してください。');
  const noPartner = txs.filter(t => t.type === 'income' && num(t.wh) > 0 && !t.partner).length;
  if (noPartner) warnings.push(`源泉徴収のある収入のうち ${noPartner} 件に取引先が未入力です（申告書の「所得の内訳」に支払者名が必要です）。`);
  if (beforeBlue < 0 && Y.blue !== 'white') warnings.push('事業が赤字です。青色申告なら赤字（純損失）を翌年以降3年間繰り越せます（申告書第四表）。このツールでは繰越の計算はしていません。');

  // 月別
  const monthly = Array.from({ length: 12 }, (_, i) => ({ m: i + 1, inc: 0, exp: 0 }));
  for (const e of J) {
    if (e.src === 'open' || e.src === 'close') continue;
    const m = +e.date.slice(5, 7) - 1; if (!(m >= 0 && m < 12)) continue;
    for (const l of e.lines) {
      if (INCOME_ACCTS.includes(l.a)) monthly[m].inc += l.cr - l.dr;
      else if (l.a === '仕入高' || EXPENSES.includes(l.a)) monthly[m].exp += l.dr - l.cr;
    }
  }

  // ---------------- 所得税 ----------------
  const d = Y.ded;
  const salaryInc = salaryIncome(Y.salary.revenue, cfg);
  const miscInc = Math.max(0, num(Y.misc.revenue) - num(Y.misc.expense));
  const total = Math.max(0, bizIncome + salaryInc + miscInc);   // 合計所得金額（総所得金額等）
  const social = num(d.social) + num(Y.salary.social);
  const smallBiz = num(d.smallBiz);
  const kid = cfg.lifeKidSpecial && Y.deps.some(p => num(p.age) < 23 && num(p.income) <= L);
  const life = lifeDeduction(d, kid);
  const quake = Math.min(50000, num(d.quake));
  const medical = d.medMode === 'self'
    ? clamp(num(d.selfMed) - 12000, 0, 88000)
    : clamp(num(d.medPaid) - num(d.medReimb) - Math.min(100000, fl(total * 0.05)), 0, 2000000);
  const donation = Math.max(0, Math.min(num(d.donation), fl(total * 0.4)) - 2000);
  const sp = spouseDed(total, Y.spouse, L, false);
  const deps = Y.deps.map(p => ({ p, r: depDed(p, L, false) }));
  const depAmt = sumBy(deps.filter(x => x.r.isDep), x => x.r.amt);
  const tokuteiAmt = sumBy(deps.filter(x => x.r.tokutei), x => x.r.amt);
  let disab = DISAB[d.selfDisab] || 0;
  if (Y.spouse.has && num(Y.spouse.income) <= L) disab += DISAB[Y.spouse.disab] || 0;
  for (const { p } of deps) if (num(p.income) <= L) disab += DISAB[p.disab] || 0;
  const sw = total <= 5000000 ? (d.selfStatus === 'single' ? 350000 : d.selfStatus === 'widow' ? 270000 : 0) : 0;
  const basic = cfg.basic(total);
  const dedList = [
    ['社会保険料控除', social], ['小規模企業共済等掛金控除', smallBiz], ['生命保険料控除', life], ['地震保険料控除', quake],
    [d.selfStatus === 'widow' ? '寡婦控除' : 'ひとり親控除', sw], ['障害者控除', disab],
    [sp.kind || '配偶者（特別）控除', sp.amt], ['扶養控除', depAmt], ['特定親族特別控除', tokuteiAmt], ['基礎控除', basic],
    ['医療費控除', medical], ['寄附金控除', donation],
  ].map(([k, v]) => ({ k, v }));
  const dedSum = sumBy(dedList, 'v');
  const taxable = Math.max(0, fl((total - dedSum) / 1000) * 1000);
  const taxBase = incomeTax(taxable);
  const credit = Math.min(taxBase, num(d.housing));
  const baseTax = taxBase - credit;                       // 再差引所得税額（基準所得税額）
  const recon = fl(baseTax * 21 / 1000);
  const totalTax = baseTax + recon;
  const whTx = sumBy(txs.filter(t => t.type === 'income'), t => clamp(num(t.wh), 0, num(t.amount)));
  const withheld = whTx + num(Y.salary.withheld) + num(Y.misc.withheld) + num(d.otherWh);
  const diff = totalTax - withheld;
  const declared = diff >= 0 ? fl(diff / 100) * 100 : diff;   // 申告納税額
  const prepaid = num(d.prepaid);
  const third = declared - prepaid;
  const payable = third > 0 ? fl(third / 100) * 100 : 0;
  const refund = third < 0 ? -third : 0;
  const whByPartner = {};
  for (const t of txs) if (t.type === 'income' && num(t.wh) > 0) {
    const k = t.partner || '（取引先未入力）'; (whByPartner[k] = whByPartner[k] || { rev: 0, wh: 0 });
    whByPartner[k].rev += num(t.amount); whByPartner[k].wh += clamp(num(t.wh), 0, num(t.amount));
  }

  // ---------------- 住民税（概算） ----------------
  let resident;
  if (total <= 450000) resident = { total: 0, shotoku: 0, kintou: 0, note: '合計所得が45万円以下のため非課税の可能性が高いです（基準は自治体・家族構成で異なります）。' };
  else {
    const basicR = total <= 24000000 ? 430000 : total <= 24500000 ? 290000 : total <= 25000000 ? 150000 : 0;
    const spR = spouseDed(total, Y.spouse, L, true);
    const depsR = sumBy(Y.deps, p => depDed(p, L, true).amt);
    let disabR = DISAB_R[d.selfDisab] || 0;
    if (Y.spouse.has && num(Y.spouse.income) <= L) disabR += DISAB_R[Y.spouse.disab] || 0;
    for (const p of Y.deps) if (num(p.income) <= L) disabR += DISAB_R[p.disab] || 0;
    const swR = total <= 5000000 ? (d.selfStatus === 'single' ? 300000 : d.selfStatus === 'widow' ? 260000 : 0) : 0;
    const dedR = social + smallBiz + medical + lifeDeductionR(d) + Math.min(25000, fl(num(d.quake) / 2)) + spR.amt + depsR + disabR + swR + basicR;
    const taxableR = Math.max(0, fl((total - dedR) / 1000) * 1000);
    let shotoku = Math.max(0, fl(taxableR / 10) - (total <= 25000000 && taxableR > 0 ? 2500 : 0));
    let furusato = 0;
    const don = num(d.donation);
    if (don > 2000) {
      const basicPart = fl(Math.max(0, Math.min(don, fl(total * 0.3)) - 2000) * 0.1);
      const special = Math.min(fl((don - 2000) * (0.9 - marginalRate(taxable) * 1.021)), fl(shotoku * 0.2));
      furusato = Math.min(shotoku, basicPart + Math.max(0, special));
    }
    shotoku = fl(Math.max(0, shotoku - furusato) / 100) * 100;
    resident = { total: shotoku + 5000, shotoku, kintou: 5000, furusato, taxableR, dedR };
  }
  // 個人事業税（概算）
  const bizTaxBase = Math.max(0, beforeBlue - 2900000);

    }
  }

  return {

    pl: { sales, miscRev, revenue, purchases, invStart, invEnd, cogs, gross, exp, expTotal, beforeBlue, blueDed, blueCap, bizIncome },
    bs: { A: bsA, Lb: bsL, totA, totL },

function parseCSV(text) {

    else f += c;

  if ((m = s.match(/^R(\d{1,2})\/(\d{1,2})\/(\d{1,2})/i))) return p(2018 + +m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{2})\/(\d{1,2})\/(\d{1,2})$/))) return p(2000 + +m[1], +m[2], +m[3]);

      ${fld('耐用年数（定額法）', `<div class="row"><input class="in r w-s" id="a_life" inputmode="numeric" value="${esc(af.life)}"> 年 <select class="in w-m" onchange="if(this.value)document.getElementById('a_life').value=this.value">${opt(LIFE_PRESETS, '')}</select></div>`)}

    ${row('扶養控除・特定親族特別控除', `<div class="tblw"><table class="tbl"><thead><tr><th>名前</th><th>年齢（12/31）</th><th>合計所得金額</th><th>同居</th><th>障害</th><th>判定</th><th></th></tr></thead><tbody>${depRows || '<tr><td colspan="7" class="mut">登録なし</td></tr>'}</tbody></table></div>

  </div>
  <div class="card"><h3>税額控除・納付済みの税金</h3>
    ${row('住宅借入金等特別控除（住宅ローン控除）', `<div class="inl">${fld('控除額（計算明細書で計算した額）', inp(`${p}.ded.housing`))}</div><div class="hint">1年目は「住宅借入金等特別控除額の計算明細書」で計算します。2年目以降は税務署から届く書類で確認できます。</div>`, T.credit)}
    ${row('予定納税額', `<div class="inl">${fld('7月・11月に納めた予定納税の合計', inp(`${p}.ded.prepaid`))}</div>`, T.prepaid, '納付済み')}

function vReports() {
  const tabs = [['pl', '損益計算書'], ['bs', '貸借対照表'], ['monthly', '月別売上・仕入'], ['journal', '仕訳帳'], ['ledger', '総勘定元帳'], ['tb', '試算表']];
  const body = { pl: rPL, bs: rBS, monthly: rMonthly, journal: rJournal, ledger: rLedger, tb: rTB }[UI.rep] || rPL;
  return `
  ${head('⑥ 決算書・帳簿', `取引から自動で作った${R.Y.blue === 'white' ? '収支内訳書' : '青色申告決算書'}の数字と帳簿です。国税庁の確定申告書等作成コーナーには、この画面の金額をそのまま入力します。`)}
  ${warnBox()}
  <div class="subtabs">${tabs.map(([k, l]) => `<button class="${UI.rep === k ? 'on' : ''}" onclick="App.rep('${k}')">${l}</button>`).join('')}</div>
  ${body()}
  <div class="row noprint" style="margin-top:12px"><button class="btn" onclick="window.print()">印刷・PDFで保存</button>${checkBtn('reports', '決算書を確認済みにする')}</div>`;
}
function rPL() {
  const p = R.pl, blue = R.Y.blue !== 'white';
  const r = (l, v, cls = '') => `<tr class="${cls}"><td class="${cls ? '' : 'ind'}">${l}</td><td class="r">${v === '' ? '' : yen(v)}</td></tr>`;
  return `<div class="card"><h3>損益計算書<small>${R.cfg.label}（1月1日〜12月31日）${D.profile.trade ? '・' + esc(D.profile.trade) : ''}</small></h3>
  <div class="tblw"><table class="tbl"><thead><tr><th>科目</th><th class="r">金額（円）</th></tr></thead><tbody>
    ${r('売上（収入）金額', p.revenue, 'sub')}
    ${p.miscRev ? r('うち 雑収入', p.miscRev) : ''}
    <tr class="sec"><td colspan="2">売上原価</td></tr>
    ${r('期首商品（製品）棚卸高', p.invStart)}${r('仕入金額（製品製造原価）', p.purchases)}${r('小計', p.invStart + p.purchases)}${r('期末商品（製品）棚卸高', p.invEnd)}
    ${r('差引原価', p.cogs, 'sub')}${r('差引金額（売上 − 原価）', p.gross, 'sub')}
    <tr class="sec"><td colspan="2">経費</td></tr>
    ${p.exp.map(x => r(x.a, x.v || '')).join('')}
    ${r('経費 計', p.expTotal, 'sub')}
    ${r('差引金額', p.beforeBlue, 'sub')}
    ${blue ? r('青色申告特別控除前の所得金額', p.beforeBlue, 'sub') + r(`青色申告特別控除額（${R.Y.blue}万円枠）`, p.blueDed) : ''}
    ${r('所得金額', p.bizIncome, 'tot')}
  </tbody></table></div>
  <p class="note">決算書の経費欄にない科目（支払手数料・新聞図書費・研修費・会議費・諸会費・車両費など）は、空欄の行に科目名を書いて記入します。</p></div>`;
}
function rBS() {
  const b = R.bs;
  const nm = a => a === '未払金' ? '未払金（カード等）' : a;
  const rows = list => list.filter(x => x.open || x.v).map(x => `<tr><td>${nm(x.a)}</td><td class="r">${yen(x.open)}</td><td class="r">${yen(x.v)}</td></tr>`).join('');
  const subs = Object.values(R.tbs).filter(x => (x.a === '現金' || x.a === '普通預金' || x.a === '未払金') && x.s && (x.dr || x.cr));
  return `<div class="card"><h3>貸借対照表（資産負債調）<small>${R.cfg.label} 12月31日現在</small></h3>
  <div class="grid g2">
    <div class="tblw"><table class="tbl"><thead><tr><th>資産の部</th><th class="r">1月1日（期首）</th><th class="r">12月31日（期末）</th></tr></thead><tbody>
      ${rows(b.A)}<tr class="tot"><td>合計</td><td class="r">${yen(sumBy(b.A, 'open'))}</td><td class="r">${yen(b.totA)}</td></tr></tbody></table></div>
    <div class="tblw"><table class="tbl"><thead><tr><th>負債・資本の部</th><th class="r">1月1日（期首）</th><th class="r">12月31日（期末）</th></tr></thead><tbody>
      ${rows(b.Lb)}<tr><td>青色申告特別控除前の所得金額</td><td class="r"></td><td class="r">${yen(R.pl.beforeBlue)}</td></tr>
      <tr class="tot"><td>合計</td><td class="r">${yen(sumBy(b.Lb, 'open'))}</td><td class="r">${yen(b.totL)}</td></tr></tbody></table></div>
  </div>
  ${b.totA === b.totL ? '<div class="alert ok" style="margin-top:12px">資産の合計と、負債・資本の合計が一致しています。</div>' : '<div class="alert warn" style="margin-top:12px"><b>不一致：</b>左右の合計が一致していません。</div>'}
  ${subs.length ? `<h3 style="margin-top:14px">口座ごとの期末残高</h3><div class="tblw"><table class="tbl"><tbody>${subs.map(x => `<tr><td>${esc(x.a)}：${esc(x.s)}</td><td class="r">${yen(x.a === '未払金' ? x.cr - x.dr : x.dr - x.cr)}円</td></tr>`).join('')}</tbody></table></div><p class="note">通帳・カード明細の12月31日の残高と一致しているか確認してください。一致しない場合は入力漏れがあります。</p>` : ''}
  <p class="note">事業主貸＝事業のお金をプライベートに使った額（生活費・源泉所得税・家事按分の家事分など）、事業主借＝プライベートのお金を事業に入れた額。翌年の元入金 ＝ 元入金 ＋ 青色申告特別控除前の所得 ＋ 事業主借 − 事業主貸 です。</p></div>`;
}
function rMonthly() {
  const m = Array.from({ length: 12 }, (_, i) => ({ s: 0, p: 0, i }));
  for (const e of R.J) { if (e.src === 'open' || e.src === 'close') continue; const k = +e.date.slice(5, 7) - 1; if (!(k >= 0)) continue; for (const l of e.lines) { if (l.a === '売上高') m[k].s += l.cr - l.dr; if (l.a === '仕入高') m[k].p += l.dr - l.cr; } }
  return `<div class="card"><h3>月別売上（収入）金額及び仕入金額<small>決算書2ページ目</small></h3><div class="tblw"><table class="tbl"><thead><tr><th>月</th><th class="r">売上（収入）金額</th><th class="r">仕入金額</th></tr></thead><tbody>
  ${m.map(x => `<tr><td>${x.i + 1}月</td><td class="r">${yen(x.s)}</td><td class="r">${yen(x.p)}</td></tr>`).join('')}
  <tr><td>雑収入</td><td class="r">${yen(R.pl.miscRev)}</td><td></td></tr>
  <tr class="tot"><td>計</td><td class="r">${yen(sumBy(m, 's') + R.pl.miscRev)}</td><td class="r">${yen(sumBy(m, 'p'))}</td></tr></tbody></table></div></div>`;
}
function rJournal() {
  return `<div class="card"><h3>仕訳帳<small>${R.J.length}件</small></h3><div class="tblw" style="max-height:640px"><table class="tbl"><thead><tr><th>No</th><th>日付</th><th>借方科目</th><th class="r">借方金額</th><th>貸方科目</th><th class="r">貸方金額</th><th>摘要</th></tr></thead><tbody>
  ${R.J.map(e => { const dr = e.lines.filter(l => l.dr), cr = e.lines.filter(l => l.cr), n = Math.max(dr.length, cr.length); return Array.from({ length: n }, (_, i) => `<tr>${i === 0 ? `<td rowspan="${n}">${e.no}</td><td rowspan="${n}" class="num">${esc(e.date)}</td>` : ''}
    <td>${dr[i] ? esc(dr[i].a) + (dr[i].s ? `<span class="mut">／${esc(dr[i].s)}</span>` : '') : ''}</td><td class="r">${dr[i] ? yen(dr[i].dr) : ''}</td>
    <td>${cr[i] ? esc(cr[i].a) + (cr[i].s ? `<span class="mut">／${esc(cr[i].s)}</span>` : '') : ''}</td><td class="r">${cr[i] ? yen(cr[i].cr) : ''}</td>
    ${i === 0 ? `<td rowspan="${n}">${esc([e.partner, e.desc].filter(Boolean).join(' '))}</td>` : ''}</tr>`).join(''); }).join('') || '<tr><td colspan="7" class="empty">仕訳はまだありません</td></tr>'}
  </tbody></table></div><div class="row noprint" style="margin-top:10px"><button class="btn" onclick="App.csvJournal()">仕訳帳をCSVで書き出す</button></div></div>`;
}
function rLedger() {
  const accts = Object.keys(R.tb);
  const a = accts.includes(UI.ledger) ? UI.ledger : accts[0];
  if (!a) return '<div class="card"><div class="empty">仕訳がありません</div></div>';
  const debitSide = !(BS_LIABS.includes(a) || INCOME_ACCTS.includes(a) || a === '期末商品棚卸高');
  let run = 0;
  const rows = [];
  for (const e of R.J) for (const l of e.lines) if (l.a === a) {
    run += debitSide ? l.dr - l.cr : l.cr - l.dr;
    const other = e.lines.filter(x => x !== l && (l.dr ? x.cr : x.dr)).map(x => x.a);
    rows.push(`<tr><td class="num">${esc(e.date)}</td><td>${esc([...new Set(other)].join('・') || '諸口')}</td><td>${esc([l.s, e.partner, e.desc].filter(Boolean).join(' '))}</td><td class="r">${l.dr ? yen(l.dr) : ''}</td><td class="r">${l.cr ? yen(l.cr) : ''}</td><td class="r">${yen(run)}</td></tr>`);
  }
  return `<div class="card"><h3>総勘定元帳</h3><div class="row noprint" style="margin-bottom:10px"><select class="in w-m" onchange="App.ledger(this.value)">${opt(accts.map(x => [x, x]), a)}</select></div>
  <div class="tblw" style="max-height:640px"><table class="tbl"><thead><tr><th>日付</th><th>相手科目</th><th>摘要</th><th class="r">借方</th><th class="r">貸方</th><th class="r">残高</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>`;
}
function rTB() {
  const rows = Object.entries(R.tb).map(([a, v]) => ({ a, dr: v.dr, cr: v.cr }));
  return `<div class="card"><h3>合計残高試算表</h3><div class="tblw"><table class="tbl"><thead><tr><th>勘定科目</th><th class="r">借方合計</th><th class="r">貸方合計</th><th class="r">残高</th></tr></thead><tbody>
  ${rows.map(x => `<tr><td>${esc(x.a)}</td><td class="r">${yen(x.dr)}</td><td class="r">${yen(x.cr)}</td><td class="r">${yen(Math.abs(x.dr - x.cr))}${x.dr - x.cr < 0 ? '（貸）' : x.dr - x.cr > 0 ? '（借）' : ''}</td></tr>`).join('')}
  <tr class="tot"><td>合計</td><td class="r">${yen(sumBy(rows, 'dr'))}</td><td class="r">${yen(sumBy(rows, 'cr'))}</td><td></td></tr></tbody></table></div></div>`;
}

    ${line('復興特別所得税額（×2.1%）', T.recon)}${line('所得税及び復興特別所得税の額', T.totalTax, 'sub')}
    ${line('源泉徴収税額', T.withheld)}${line('申告納税額（100円未満切り捨て）', T.declared)}

  <div class="card guide"><h3>提出までの手順</h3><ol>

  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
