<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>新規会員登録 | Lumenium</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #171c33; --card: #262c4a; --border: #424a6b;
    --text: #f5f7fb; --sub: #abb5cb;
    --grad: linear-gradient(135deg, #4f46e5 0%, #3b82f6 50%, #06b6d4 100%);
  }
  body {
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 70% 50% at 20% 15%, rgba(79,70,229,0.18), transparent 60%),
      radial-gradient(ellipse 55% 45% at 80% 80%, rgba(6,182,212,0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', system-ui, -apple-system, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px 32px;
    box-shadow: 0 24px 64px -24px rgba(0,0,0,0.6);
  }
  .brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 8px; }
  .brand img { width: 34px; height: 34px; }
  .brand span {
    font-size: 21px; font-weight: 700; letter-spacing: -0.01em;
    background: linear-gradient(135deg, #a5b4fc, #93c5fd, #67e8f9);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .eyebrow {
    text-align: center; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.3em; color: #818cf8; margin-bottom: 26px;
  }
  h1 { font-size: 19px; font-weight: 700; text-align: center; margin-bottom: 6px; }
  .desc { font-size: 13px; color: var(--sub); text-align: center; line-height: 1.8; margin-bottom: 26px; }
  label { display: block; font-size: 12.5px; font-weight: 700; margin: 14px 0 8px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="email"] {
    width: 100%; padding: 13px 14px;
    background: #1a2038; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font-size: 15px;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  input:focus {
    outline: none;
    border-color: rgba(129,140,248,0.65);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.18);
  }
  button[type="submit"] {
    width: 100%; padding: 14px; margin-top: 22px;
    background: var(--grad); color: #fff;
    border: none; border-radius: 10px;
    font-size: 14.5px; font-weight: 700; letter-spacing: 0.02em;
    cursor: pointer;
    transition: opacity 0.25s, transform 0.25s;
    font-family: inherit;
  }
  button[type="submit"]:hover { transform: translateY(-1px); }
  button[type="submit"]:disabled { opacity: 0.55; cursor: default; transform: none; }
  .note { margin-top: 12px; font-size: 11.5px; color: var(--sub); line-height: 1.7; text-align: center; }
  .error {
    display: none;
    margin-top: 14px; padding: 11px 14px;
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.35);
    border-radius: 10px;
    color: #fca5a5; font-size: 12.5px; line-height: 1.6;
  }
  .error.show { display: block; }
  .foot { margin-top: 24px; text-align: center; font-size: 12px; color: var(--sub); line-height: 1.8; }
  .foot a { color: #93c5fd; text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
  .back { display: block; text-align: center; margin-top: 14px; font-size: 12.5px; color: var(--sub); text-decoration: none; }
  .back:hover { color: var(--text); }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/favicon.svg" alt="">
      <span>Lumenium</span>
    </div>
    <p class="eyebrow">SIGN UP</p>
    <h1>新規会員登録</h1>
    <p class="desc">登録するとすぐにミニゲームで遊べます。<br>会員コードをメールでお送りします。</p>

    <form id="register-form" novalidate>
      <label for="name">お名前</label>
      <input type="text" id="name" name="name" autocomplete="name" maxlength="50" required>
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" autocomplete="email" inputmode="email" maxlength="100" required>
      <label for="company">会社名・所属（任意）</label>
      <input type="text" id="company" name="company" autocomplete="organization" maxlength="80">
      <button type="submit" id="submit-btn">登録して遊ぶ →</button>
      <p class="note">登録により、会員コードのご案内メールをお送りすることに同意いただいたものとします。</p>
      <p class="error" id="error" role="alert">登録できませんでした。入力内容をご確認のうえ、しばらく待ってからお試しください。</p>
    </form>

    <p class="foot">すでに会員コードをお持ちの方は<br><a href="/login.html" id="login-link">ログイン</a>へ</p>
    <a class="back" href="/">← トップページに戻る</a>
  </main>

<script>
(function () {
  var NEXT = {
    game: '/game.html',
    runner: '/runner.html',
    racing: '/racing.html',
    arena: '/members/arena'
  };
  var key = new URLSearchParams(location.search).get('next');
  var dest = Object.prototype.hasOwnProperty.call(NEXT, key) ? NEXT[key] : NEXT.arena;

  // Carry ?next= through to the login link
  document.getElementById('login-link').href = '/login.html' + location.search;

  // Already a member? Straight to the game.
  if (document.cookie.split('; ').indexOf('lum_member=1') !== -1) {
    location.replace(dest);
    return;
  }

  var form = document.getElementById('register-form');
  var btn = document.getElementById('submit-btn');
  var err = document.getElementById('error');
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.classList.remove('show');
    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();
    var company = document.getElementById('company').value.trim();
    if (!name || !email || !EMAIL_RE.test(email)) { err.classList.add('show'); return; }
    btn.disabled = true;
    btn.textContent = '登録中…';
    try {
      var res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, email: email, company: company })
      });
      var data = await res.json().catch(function () { return {}; });
      if (res.ok && data.ok === true) {
        location.replace(dest);
        return;
      }
      err.classList.add('show');
    } catch (_) {
      err.classList.add('show');
    }
    btn.disabled = false;
    btn.textContent = '登録して遊ぶ →';
  });
})();
</script>
</body>
</html>
