<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>会員リスト | Lumenium 管理</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #171c33; --card: #262c4a; --border: #424a6b;
    --text: #f5f7fb; --sub: #abb5cb;
    --grad: linear-gradient(135deg, #4f46e5 0%, #3b82f6 50%, #06b6d4 100%);
  }
  body {
    min-height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', system-ui, -apple-system, sans-serif;
    padding: 32px 20px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  header img { width: 30px; height: 30px; }
  header h1 { font-size: 18px; font-weight: 700; }
  header .tag {
    font-size: 10px; font-weight: 800; letter-spacing: 0.18em;
    background: var(--grad); color: #fff;
    padding: 4px 10px; border-radius: 999px;
  }
  header a { margin-left: auto; color: var(--sub); font-size: 12.5px; text-decoration: none; }
  header a:hover { color: var(--text); }
  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px;
  }
  /* key form */
  #key-form { display: flex; gap: 10px; flex-wrap: wrap; }
  #key-form label { flex-basis: 100%; font-size: 12.5px; font-weight: 700; }
  #admin-key {
    flex: 1; min-width: 220px; padding: 12px 14px;
    background: #1a2038; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; font-size: 14px;
  }
  #admin-key:focus { outline: none; border-color: rgba(129,140,248,0.65); box-shadow: 0 0 0 3px rgba(99,102,241,0.18); }
  button {
    padding: 12px 22px; border: none; border-radius: 10px;
    background: var(--grad); color: #fff;
    font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button.ghost { background: #1a2038; border: 1px solid var(--border); color: var(--sub); }
  button:disabled { opacity: 0.55; cursor: default; }
  .msg { margin-top: 14px; font-size: 12.5px; line-height: 1.7; color: #fca5a5; display: none; }
  .msg.show { display: block; }
  .msg.info { color: var(--sub); }
  /* list */
  #list-view { display: none; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  #search {
    flex: 1; min-width: 200px; padding: 10px 14px;
    background: #1a2038; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; font-size: 13.5px;
  }
  #count { font-size: 12.5px; color: var(--sub); white-space: nowrap; }
  .tbl { width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; letter-spacing: 0.1em; color: var(--sub); font-weight: 700; }
  td.email { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
  tr:hover td { background: rgba(99,102,241,0.05); }
  .unsub { color: #f87171; font-size: 11px; }
  .empty { padding: 28px; text-align: center; color: var(--sub); font-size: 13px; }
  .share {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 8px; padding: 12px 14px;
    background: #1a2038; border: 1px solid var(--border); border-radius: 12px;
  }
  .share-label { font-size: 11.5px; font-weight: 700; color: #93c5fd; white-space: nowrap; }
  #share-url {
    flex: 1; min-width: 180px; padding: 8px 10px;
    background: var(--card); color: var(--sub);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .share button { padding: 8px 14px; font-size: 12px; }
  .share-open {
    padding: 8px 14px; font-size: 12px; font-weight: 700;
    background: var(--grad); color: #fff; border-radius: 10px; text-decoration: none;
  }
  .share-note { font-size: 11px; color: var(--sub); line-height: 1.7; margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="/favicon.svg" alt="">
      <h1>会員リスト</h1>
      <span class="tag">ADMIN</span>
      <a href="/">← lumenium.net</a>
    </header>

    <div class="panel" id="key-panel">
      <form id="key-form">
        <label for="admin-key">管理キー（Vercel の ADMIN_KEY）</label>
        <input type="password" id="admin-key" autocomplete="off" required>
        <button type="submit" id="key-btn">表示する</button>
      </form>
      <p class="msg" id="key-msg"></p>
    </div>

    <div class="panel" id="list-view">
      <div class="share">
        <span class="share-label">📺 ライブ表示リンク（開くだけで最新）</span>
        <input type="text" id="share-url-view" readonly>
        <button class="ghost" id="copy-btn-view" type="button">コピー</button>
        <a id="open-view" class="share-open" href="#">開く</a>
      </div>
      <div class="share">
        <span class="share-label">📊 Excel直リンク（常に最新）</span>
        <input type="text" id="share-url" readonly>
        <button class="ghost" id="copy-btn" type="button">コピー</button>
        <a id="open-xlsx" class="share-open" href="#">開く</a>
      </div>
      <p class="share-note">ライブ表示はダウンロード不要で、開くだけで最新一覧が見られます（60秒ごと自動更新・ブックマーク可）。Excel直リンクは開くたびに最新の .xlsx をダウンロードします。いずれもリンクを知っている人は誰でも閲覧できるため取り扱いにご注意ください（Vercel の ADMIN_KEY を変更すると無効化されます）。</p>
      <div class="toolbar">
        <input type="search" id="search" placeholder="名前・メールで絞り込み">
        <span id="count"></span>
        <button id="xlsx-btn" type="button">Excel</button>
        <button class="ghost" id="csv-btn" type="button">CSV</button>
        <button class="ghost" id="reload-btn" type="button">更新</button>
      </div>
      <div class="tbl">
        <table>
          <thead><tr><th>お名前</th><th>会社名・所属</th><th>メールアドレス</th><th>登録日時</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" style="display:none">まだ登録がありません。</div>
      </div>
    </div>
  </div>

<script>
// Dependency-free .xlsx writer (real Excel file: ZIP/STORE + SpreadsheetML
// with inline strings). Kept DOM-free so it can be unit-tested in Node.
function buildXlsx(rows) {
  var enc = new TextEncoder();
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  var sheetRows = rows.map(function (r) {
    return '<row>' + r.map(function (v) {
      return '<c t="inlineStr"><is><t xml:space="preserve">' + esc(v) + '</t></is></c>';
    }).join('') + '</row>';
  }).join('');
  var files = [
    ['[Content_Types].xml',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '</Types>'],
    ['_rels/.rels',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>'],
    ['xl/workbook.xml',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="会員リスト" sheetId="1" r:id="rId1"/></sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '</Relationships>'],
    ['xl/worksheets/sheet1.xml',
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<cols><col min="1" max="1" width="18" customWidth="1"/><col min="2" max="2" width="24" customWidth="1"/>' +
      '<col min="3" max="3" width="32" customWidth="1"/><col min="4" max="4" width="20" customWidth="1"/>' +
      '<col min="5" max="5" width="10" customWidth="1"/></cols>' +
      '<sheetData>' + sheetRows + '</sheetData></worksheet>'],
  ];
  // CRC32
  var TBL = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = TBL[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function le16(v) { return [v & 255, (v >>> 8) & 255]; }
  function le32(v) { return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }
  var DOS_DATE = ((2026 - 1980) << 9) | (1 << 5) | 1; // fixed timestamp
  var chunks = [], central = [], offset = 0;
  files.forEach(function (f) {
    var nameU8 = enc.encode(f[0]);
    var dataU8 = enc.encode(f[1]);
    var crc = crc32(dataU8);
    var head = [].concat(
      le32(0x04034b50), le16(20), le16(0x0800), le16(0), le16(0), le16(DOS_DATE),
      le32(crc), le32(dataU8.length), le32(dataU8.length), le16(nameU8.length), le16(0)
    );
    chunks.push(new Uint8Array(head), nameU8, dataU8);
    central.push([].concat(
      le32(0x02014b50), le16(20), le16(20), le16(0x0800), le16(0), le16(0), le16(DOS_DATE),
      le32(crc), le32(dataU8.length), le32(dataU8.length), le16(nameU8.length),
      le16(0), le16(0), le16(0), le16(0), le32(0), le32(offset)
    ), nameU8);
    offset += head.length + nameU8.length + dataU8.length;
  });
  var centralStart = offset, centralSize = 0;
  central.forEach(function (part) {
    var u8 = part instanceof Uint8Array ? part : new Uint8Array(part);
    chunks.push(u8);
    centralSize += u8.length;
  });
  chunks.push(new Uint8Array([].concat(
    le32(0x06054b50), le16(0), le16(0), le16(files.length), le16(files.length),
    le32(centralSize), le32(centralStart), le16(0)
  )));
  var total = chunks.reduce(function (s, c) { return s + c.length; }, 0);
  var out = new Uint8Array(total), pos = 0;
  chunks.forEach(function (c) { out.set(c, pos); pos += c.length; });
  return out;
}
</script>
<script>
(function () {
  var keyPanel = document.getElementById('key-panel');
  var listView = document.getElementById('list-view');
  var keyForm = document.getElementById('key-form');
  var keyBtn = document.getElementById('key-btn');
  var keyMsg = document.getElementById('key-msg');
  var rowsEl = document.getElementById('rows');
  var emptyEl = document.getElementById('empty');
  var countEl = document.getElementById('count');
  var searchEl = document.getElementById('search');
  var members = [];

  function showMsg(text, isInfo) {
    keyMsg.textContent = text;
    keyMsg.classList.add('show');
    keyMsg.classList.toggle('info', !!isInfo);
  }

  async function load(key) {
    var res, data;
    try {
      res = await fetch('/api/members-list', { headers: { Authorization: 'Bearer ' + key } });
      data = await res.json();
    } catch (_) {
      showMsg('通信に失敗しました。時間をおいて再度お試しください。');
      return false;
    }
    if (res.status === 503) {
      showMsg('未設定です。Vercel の環境変数に ADMIN_KEY を設定し、再デプロイしてください。', true);
      return false;
    }
    if (!res.ok || data.ok !== true) {
      showMsg('管理キーが正しくないか、現在表示できません。');
      return false;
    }
    members = data.members || [];
    render();
    sessionStorage.setItem('lum_admin_key', key);
    // Permalinks: live HTML view + always-fresh Excel
    var shareUrl = location.origin + '/api/members-xlsx?key=' + encodeURIComponent(key);
    document.getElementById('share-url').value = shareUrl;
    document.getElementById('open-xlsx').href = shareUrl;
    var viewUrl = location.origin + '/api/members-view?key=' + encodeURIComponent(key);
    document.getElementById('share-url-view').value = viewUrl;
    document.getElementById('open-view').href = viewUrl;
    keyPanel.style.display = 'none';
    listView.style.display = 'block';
    return true;
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function render() {
    var q = (searchEl.value || '').toLowerCase();
    var shown = members.filter(function (m) {
      return !q || (m.name || '').toLowerCase().indexOf(q) !== -1 ||
        (m.email || '').toLowerCase().indexOf(q) !== -1 ||
        (m.company || '').toLowerCase().indexOf(q) !== -1;
    });
    rowsEl.textContent = '';
    shown.forEach(function (m) {
      var tr = document.createElement('tr');
      var tdN = document.createElement('td'); tdN.textContent = m.name || '—';
      var tdC = document.createElement('td'); tdC.textContent = m.company || '—';
      var tdE = document.createElement('td'); tdE.className = 'email'; tdE.textContent = m.email;
      var tdD = document.createElement('td'); tdD.textContent = fmtDate(m.created);
      var tdU = document.createElement('td');
      if (m.unsubscribed) { tdU.textContent = '配信停止'; tdU.className = 'unsub'; }
      tr.appendChild(tdN); tr.appendChild(tdC); tr.appendChild(tdE); tr.appendChild(tdD); tr.appendChild(tdU);
      rowsEl.appendChild(tr);
    });
    emptyEl.style.display = shown.length ? 'none' : 'block';
    countEl.textContent = shown.length + ' / ' + members.length + ' 件';
  }

  keyForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    keyMsg.classList.remove('show');
    keyBtn.disabled = true;
    // trim: pasted keys often carry an invisible trailing space/newline
    await load(document.getElementById('admin-key').value.trim());
    keyBtn.disabled = false;
  });

  searchEl.addEventListener('input', render);

  document.getElementById('reload-btn').addEventListener('click', function () {
    var key = sessionStorage.getItem('lum_admin_key');
    if (key) load(key);
  });

  document.getElementById('csv-btn').addEventListener('click', function () {
    var lines = ['name,company,email,created,unsubscribed'];
    members.forEach(function (m) {
      var esc = function (v) { return '"' + String(v || '').replace(/"/g, '""') + '"'; };
      lines.push([esc(m.name), esc(m.company), esc(m.email), esc(m.created), m.unsubscribed ? '1' : '0'].join(','));
    });
    var blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lumenium-members.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById('xlsx-btn').addEventListener('click', function () {
    var rows = [['お名前', '会社名・所属', 'メールアドレス', '登録日時', '配信状態']];
    members.forEach(function (m) {
      rows.push([m.name || '', m.company || '', m.email || '', fmtDate(m.created), m.unsubscribed ? '配信停止' : '']);
    });
    var xlsx = buildXlsx(rows);
    var blob = new Blob([xlsx], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lumenium-members.xlsx';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  function wireCopy(btnId, inputId) {
    document.getElementById(btnId).addEventListener('click', function () {
      var input = document.getElementById(inputId);
      var btn = this;
      navigator.clipboard.writeText(input.value).then(function () {
        btn.textContent = '✓ コピー済み';
        setTimeout(function () { btn.textContent = 'コピー'; }, 2000);
      }).catch(function () {
        input.select();
        document.execCommand('copy');
      });
    });
  }
  wireCopy('copy-btn', 'share-url');
  wireCopy('copy-btn-view', 'share-url-view');

  // Auto-restore within the same tab session
  var saved = sessionStorage.getItem('lum_admin_key');
  if (saved) load(saved);
})();
</script>
</body>
</html>
