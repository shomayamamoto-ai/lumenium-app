<script>
/* ================= AUDIO (WebAudio, starts only after user gesture) ================= */
var AC=null,mg=null,muted=localStorage.getItem('tdMute')==='1',lastShot=-9,lastHitS=-9;
function initAudio(){
  if(AC)return;
  var C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  try{
    AC=new C();
    mg=AC.createGain();
    mg.gain.value=muted?0:0.9;
    mg.connect(AC.destination);
  }catch(e){AC=null;}
}
function tone(f,d,type,v,f2){
  if(!AC||muted)return;
  try{
    var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
    o.type=type||'square';
    o.frequency.setValueAtTime(f,n);
    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),n+d);
    g.gain.setValueAtTime(v||0.1,n);
    g.gain.exponentialRampToValueAtTime(0.0001,n+d);
    o.connect(g);g.connect(mg);
    o.start(n);o.stop(n+d);
  }catch(e){}
}
function noiseHit(d,v,fq){
  if(!AC||muted)return;
  try{
    var len=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,len,AC.sampleRate),ch=buf.getChannelData(0);
    for(var i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
    var s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
    s.buffer=buf;f.type='lowpass';f.frequency.value=fq||900;g.gain.value=v;
    s.connect(f);f.connect(g);g.connect(mg);s.start();
  }catch(e){}
}
function sfxShoot(tp){
  if(frame-lastShot<3)return;
  lastShot=frame;
  var f=[880,520,300,1300,640,1500,980][tp]||800;
  tone(f,0.05,tp===2?'sawtooth':'square',0.04,f*0.55);
}
function sfxHit(){if(frame-lastHitS<4)return;lastHitS=frame;tone(190,0.05,'sawtooth',0.035,120);}
function sfxKill(){tone(540,0.07,'square',0.055,1080);}
function sfxExplode(){noiseHit(0.22,0.2);tone(85,0.28,'sine',0.12,38);}
function sfxPlace(){tone(420,0.06,'triangle',0.08);setTimeout(function(){tone(640,0.07,'triangle',0.07);},55);}
function sfxWave(){tone(300,0.12,'sawtooth',0.05,560);setTimeout(function(){tone(450,0.12,'sawtooth',0.045,820);},110);}
function sfxBoss(){tone(150,0.25,'sawtooth',0.1,70);setTimeout(function(){tone(100,0.35,'sawtooth',0.09,50);},160);}
function sfxUpgrade(){[520,700,1000].forEach(function(f,i){setTimeout(function(){tone(f,0.07,'triangle',0.06);},i*55);});}
function sfxDamage(){noiseHit(0.3,0.22,600);tone(110,0.3,'square',0.11,50);}
function sfxCoin(){tone(1250,0.05,'square',0.05);setTimeout(function(){tone(1700,0.08,'square',0.04);},45);}
function sfxPow(){[800,1000,1250].forEach(function(f,i){setTimeout(function(){tone(f,0.06,'triangle',0.05);},i*45);});}
function sfxOver(){[392,330,262,196,131].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'triangle',0.08);},i*140);});}
var bgmInt=null,bgmNotes=[262,330,392,523,392,330,262,196],bgmIdx=0;
function startBGM(){
  if(bgmInt)return;
  bgmInt=setInterval(function(){
    if(AC&&!muted&&st==='play'&&!paused){tone(bgmNotes[bgmIdx%bgmNotes.length],0.12,'triangle',0.016);bgmIdx++;}
  },300);
}
function stopBGM(){if(bgmInt){clearInterval(bgmInt);bgmInt=null;}}
function toggleMute(){
  muted=!muted;
  localStorage.setItem('tdMute',muted?'1':'0');
  if(mg)mg.gain.value=muted?0:0.9;
  var b=document.getElementById('muteBtn');
  if(b)b.textContent=muted?'🔇 OFF':'🔊 ON';
}

/* ================= CORE STATE ================= */

/* ================= MAPS ================= */
var maps=[

var enemyCols={normal:'#ef4444',fast:'#f59e0b',swarm:'#fb7185',tank:'#94a3b8',healer:'#10b981',shield:'#6366f1',boss:'#dc2626'};
var enemyR={normal:10,fast:8,swarm:6,tank:12,healer:10,shield:11,boss:15};

function bounty(e){
  var b={normal:7,fast:6,swarm:3,tank:14,healer:10,shield:12,boss:60}[e.type]||6;
  return b+(wave<10?2:0);
}
function compForWave(w){
  var c={};
  if(w%10===0){
    c.boss=Math.min(1+Math.floor(w/20),4);
    c.fast=Math.min(4+Math.floor(w/3),14);
    c.normal=4;
    if(w>=20)c.tank=Math.floor(w/10);
  }else{
    c.normal=Math.min(5+Math.floor(w*1.1),26);
    if(w>=3)c.fast=Math.min(Math.floor(w*0.6),16);
    if(w>=5&&w%3===0)c.swarm=Math.min(8+w,30);
    if(w>=6)c.tank=Math.floor(w/4);
    if(w>=8)c.healer=Math.max(1,Math.floor(w/8));
    if(w>=12)c.shield=Math.max(1,Math.floor(w/9));
  }
  return c;
}
function makeEnemy(type,w){
  var hp=4+2.9*w+0.3*Math.pow(w,1.32),
      sp=0.85+Math.min(0.045*w,1.6);
  if(type==='fast'){hp*=0.5;sp*=1.8;}
  else if(type==='swarm'){hp*=0.28;sp*=1.5;}
  else if(type==='tank'){hp*=2.8;sp*=0.55;}
  else if(type==='healer'){hp*=0.95;}
  else if(type==='shield'){hp*=2.3;sp*=0.85;}
  else if(type==='boss'){hp*=4+0.3*w;sp*=0.38;}
  return {pathIdx:0,x:pathData[0][0]*TILE+TILE/2,y:pathData[0][1]*TILE+TILE/2,hp:hp,maxHp:hp,speed:sp,slow:0,poison:0,alive:true,type:type,healTimer:80,wob:Math.random()*6.283};
}
function spawnWave(){
  wave++;
  if(wave>50){winGame();return;}
  var comp=compForWave(wave),isB=wave%10===0;
  noti('🌊 Wave '+wave+' 開始!',isB?'#f87171':'#34d399');
  sfxWave();
  if(isB){noti('⚠️ ボスWave!','#f87171');sfxBoss();shake(4,10);}
  var gap={normal:Math.max(10,22-0.25*wave),fast:Math.max(8,14-0.15*wave),swarm:5,tank:30,healer:24,shield:24,boss:90};
  var list=[];
  Object.keys(comp).forEach(function(t){for(var i=0;i<comp[t];i++)list.push(t);});
  for(var i=list.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)),tmp=list[i];list[i]=list[j];list[j]=tmp;
  }
  var d=30;
  spawnQueue=list.map(function(t){
    d+=(gap[t]||16);
    return {e:makeEnemy(t,wave),delay:d};
  });
}
function startNextWave(){waveCleared=false;spawnWave();}
function canEarly(){
  return st==='play'&&!paused&&wave<50&&spawnQueue.length===0&&!enemies.some(function(e){return e.alive;});
}

  var b=10+wave;

  noti('⏱ 早期出撃ボーナス +'+b+'G','#facc15');

  startNextWave();
}

function hitEnemy(e,dmg,col,quiet){
  if(!e.alive)return;
  e.hp-=dmg;
  if(dmg>0)addText(e.x+(Math.random()*12-6),e.y-12,String(fmtDmg(dmg)),col||'#fff',9+Math.min(dmg,7));
  spark(e.x,e.y,col||'#fff',2);
  if(!quiet)sfxHit();
  if(e.hp<=0)killEnemy(e,col);
}
function killEnemy(e,col){
  e.alive=false;
  combo++;comboTimer=90;totalKills++;
  score+=10*Math.min(combo,30);
  var g=Math.round(bounty(e)*(goldRush>0?3:1));
  gold+=g;
  addText(e.x,e.y-24,'+'+g+'G','#facc15',10);
  explode(e.x,e.y,col||enemyCols[e.type]||'#ef4444',e.type==='boss'?40:12);
  if(e.type==='boss'){
    shake(9,22);freezeF=8;
    ringFx(e.x,e.y,60,'#fde047');
    noti('💀 ボス撃破! +'+g+'G','#fde047');
    sfxBoss();sfxExplode();
  }else sfxKill();
  if(combo>1&&combo%10===0){
    gold+=combo;
    noti('🔥 x'+combo+' STREAK! +'+combo+'G','#f59e0b');

  }
  if(combo>=5)ach('c5','5連続撃破!');
  if(combo>=10)ach('c10','10連続コンボ!');
  if(combo>=20)ach('c20','20連続! 鬼神!');
  if(totalKills>=100)ach('k100','100体撃破!');
  if(totalKills>=300)ach('k300','300体撃破!');
}
function baseHit(e){

}

/* ================= UPDATE ================= */
function moveEnemy(e){
  if(!e.alive)return;
  e.wob+=0.18;
  if(e.slow>0)e.slow--;
  if(e.poison>0){
    e.poison--;
    if(e.poison%15===0)hitEnemy(e,0.6,'#34d399',true);
    if(!e.alive)return;
  }
  if(e.type==='healer'&&--e.healTimer<=0){
    e.healTimer=90;
    enemies.forEach(function(o){
      if(o.alive&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<60){
        o.hp=Math.min(o.maxHp,o.hp+o.maxHp*0.12);
        spark(o.x,o.y,'#34d399',3);
      }
    });
  }
  var sp=e.speed*(e.slow>0?0.45:1),nx=pathData[e.pathIdx+1];
  if(!nx){e.alive=false;baseHit(e);return;}
  var tx=nx[0]*TILE+TILE/2,ty=nx[1]*TILE+TILE/2,dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
  if(d<sp+1){e.pathIdx++;e.x=tx;e.y=ty;}
  else{e.x+=dx/d*sp;e.y+=dy/d*sp;}
}
function towerAct(tw){
  if(tw.flash>0)tw.flash--;
  if(tw.cooldown>0){tw.cooldown--;return;}
  var t=towerTypes[tw.type],l=tw.level,
      range=t.range+10*l,
      dmg=t.dmg*(1+0.6*(l-1))*(towerBoost>0?1.5:1),
      rate=Math.max(t.rate-4*l,4),
      tgt=null,best=range;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!e.alive)continue;
    var d=Math.hypot(e.x-tw.x,e.y-tw.y);
    if(d<best){best=d;tgt=e;}
  }
  if(!tgt)return;
  tw.cooldown=rate;
  tw.angle=Math.atan2(tgt.y-tw.y,tgt.x-tw.x);
  tw.flash=4;
  sfxShoot(tw.type);
  if(t.laser){
    bullets.push({x:tw.x,y:tw.y,tx:tgt.x,ty:tgt.y,life:6,col:t.bullet,laser:true});
    if(t.slow)tgt.slow=Math.max(tgt.slow,60+10*l);
    hitEnemy(tgt,dmg,t.bullet);
  }else if(t.chain){
    var d2=dmg,hitList=[tgt],cur=tgt,px=tw.x,py=tw.y,hops=t.chain+Math.floor(l/2);
    for(var h=0;h<hops;h++){
      bullets.push({x:px,y:py,tx:cur.x,ty:cur.y,life:8,col:t.bullet,laser:true});
      px=cur.x;py=cur.y;
      hitEnemy(cur,d2,t.bullet);
      var nx=null,nd=70;
      for(var j=0;j<enemies.length;j++){
        var en=enemies[j];
        if(!en.alive||hitList.indexOf(en)>=0)continue;
        var dd=Math.hypot(en.x-px,en.y-py);
        if(dd<nd){nd=dd;nx=en;}
      }
      if(!nx)break;
      hitList.push(nx);cur=nx;d2*=0.75;
    }
  }else{
    bullets.push({x:tw.x,y:tw.y,vx:6*Math.cos(tw.angle),vy:6*Math.sin(tw.angle),dmg:dmg,col:t.bullet,splash:t.splash?t.splash+5*l:0,slow:!!t.slow,poison:!!t.poison,life:60,trail:[]});
  }
}
function moveBullet(b){
  if(b.laser){b.life--;return;}
  b.trail.push({x:b.x,y:b.y});
  if(b.trail.length>5)b.trail.shift();
  b.x+=b.vx;b.y+=b.vy;b.life--;
  if(b.x<-10||b.x>W+10||b.y<-10||b.y>H+10){b.life=0;return;}
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!e.alive)continue;
    if(Math.abs(b.x-e.x)<12&&Math.abs(b.y-e.y)<12){
      if(b.slow)e.slow=Math.max(e.slow,90);
      if(b.poison)e.poison=Math.max(e.poison,120);
      if(b.splash>0){
        ringFx(b.x,b.y,b.splash,'#fca5a5');
        explode(b.x,b.y,'#fb923c',10);
        sfxExplode();
        shake(3,6);
        for(var j=0;j<enemies.length;j++){
          var o=enemies[j];
          if(o.alive&&o!==e&&Math.hypot(o.x-b.x,o.y-b.y)<b.splash)hitEnemy(o,b.dmg*0.5,'#fca5a5',true);
        }
      }
      hitEnemy(e,b.dmg,b.col);
      b.life=0;
      return;
    }
  }
}
function update(){
  if(st!=='play'||paused)return;
  frame++;
  notifications.forEach(function(n){n.life--;});
  notifications=notifications.filter(function(n){return n.life>0;});
  if(freezeF>0){freezeF--;return;}
  if(towerBoost>0&&--towerBoost===0)noti('⚔️ タワー強化 終了','#94a3b8');
  if(goldRush>0&&--goldRush===0)noti('💰 報酬3倍 終了','#94a3b8');
  if(comboTimer>0&&--comboTimer===0)combo=0;
  var anyAlive=enemies.some(function(e){return e.alive;});
  if(spawnQueue.length===0&&!anyAlive){
    if(!waveCleared&&wave>0){
      waveCleared=true;
      var b=20+4*wave;
      gold+=b;
      score+=15*wave;
      noti('✅ Wave '+wave+' クリア! +'+b+'G','#34d399');
      sfxCoin();
      waveTimer=Math.max(120,280-3*wave);
    }
    if(--waveTimer<=0)startNextWave();
  }
  var sq=[];
  for(var i=0;i<spawnQueue.length;i++){
    var s=spawnQueue[i];
    if(--s.delay<=0)enemies.push(s.e);
    else sq.push(s);
  }
  spawnQueue=sq;
  enemies.forEach(moveEnemy);
  if(st!=='play')return;
  towers.forEach(towerAct);
  bullets.forEach(moveBullet);
  bullets=bullets.filter(function(b){return b.life>0;});
  enemies=enemies.filter(function(e){return e.alive;});
  particles.forEach(function(p){
    if(!p.ring){p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;}
    p.life--;
  });
  particles=particles.filter(function(p){return p.life>0;});
  if(particles.length>320)particles.splice(0,particles.length-320);
  texts.forEach(function(t){t.y+=t.vy;t.life--;});
  texts=texts.filter(function(t){return t.life>0;});
  updateTowerUI();
}

function rrect(x,y,w,h,r){
  cx.beginPath();
  cx.moveTo(x+r,y);
  cx.arcTo(x+w,y,x+w,y+h,r);
  cx.arcTo(x+w,y+h,x,y+h,r);
  cx.arcTo(x,y+h,x,y,r);
  cx.arcTo(x,y,x+w,y,r);
  cx.closePath();
}
/* --- pseudo-3D rendering caches (visual only, built once per map / on demand) --- */
var boardCv=null,silCv=null,vigGrad=null,towerGrads={},enemyGrads={},glowGrads={};
function hexRgb(h){var n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,f){
  var c=hexRgb(h);
  return 'rgb('+Math.min(255,Math.round(c[0]*f))+','+Math.min(255,Math.round(c[1]*f))+','+Math.min(255,Math.round(c[2]*f))+')';
}
function buildBoard(){
  if(!boardCv){
    boardCv=document.createElement('canvas');boardCv.width=W;boardCv.height=H;
    silCv=document.createElement('canvas');silCv.width=W;silCv.height=H;
  }
  var b=boardCv.getContext('2d');
  /* lit ground plane: vertical top-light gradient */
  var g=b.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#151d40');g.addColorStop(0.55,'#0c1229');g.addColorStop(1,'#070b1c');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  /* subtle checker on grass */
  for(var yy=0;yy<ROWS;yy++)for(var xx=0;xx<COLS;xx++){
    if(isPath(xx,yy))continue;
    if((xx+yy)%2===0){b.fillStyle='rgba(129,140,248,0.035)';b.fillRect(xx*TILE,yy*TILE,TILE,TILE);}
  }
  /* faint grid */
  b.strokeStyle='rgba(129,140,248,0.05)';b.lineWidth=1;
  for(var i=0;i<=COLS;i++){b.beginPath();b.moveTo(i*TILE+0.5,0);b.lineTo(i*TILE+0.5,H);b.stroke();}
  for(var j=0;j<=ROWS;j++){b.beginPath();b.moveTo(0,j*TILE+0.5);b.lineTo(W,j*TILE+0.5);b.stroke();}
  /* ambient occlusion where path meets grass: blurred path silhouette */
  var s=silCv.getContext('2d');
  s.clearRect(0,0,W,H);
  s.fillStyle='#000';
  pathData.forEach(function(p){s.fillRect(p[0]*TILE,p[1]*TILE,TILE,TILE);});
  b.save();
  b.shadowColor='rgba(0,0,0,0.7)';b.shadowBlur=9;
  b.drawImage(silCv,0,0);
  b.restore();
  /* sunken path tiles: checker shading + per-tile gradient */
  pathData.forEach(function(p){
    var x=p[0]*TILE,y=p[1]*TILE,ck=(p[0]+p[1])%2===0;
    var pg=b.createLinearGradient(0,y,0,y+TILE);
    pg.addColorStop(0,ck?'#2c3a63':'#273459');
    pg.addColorStop(1,ck?'#1c2545':'#19203d');
    b.fillStyle=pg;
    b.fillRect(x,y,TILE,TILE);
    b.fillStyle='rgba(255,255,255,0.04)';
    b.fillRect(x,y,TILE,1);
  });
  /* raised curb walls around the sunken path: cap strip on the grass side + shaded
     vertical face dropping into the trench — changes the silhouette, not just shading */
  pathData.forEach(function(p){
    var x=p[0]*TILE,y=p[1]*TILE;
    if(!isPath(p[0],p[1]-1)){ /* wall above: lit inner face visible */
      b.fillStyle='#55689f';b.fillRect(x,y-4,TILE,4);
      b.fillStyle='rgba(255,255,255,0.25)';b.fillRect(x,y-4,TILE,1);
      b.fillStyle='#39466f';b.fillRect(x,y,TILE,5);
      b.fillStyle='rgba(0,0,0,0.35)';b.fillRect(x,y+5,TILE,3);
    }
    if(!isPath(p[0],p[1]+1)){ /* wall below: faces away from the light = dark */
      b.fillStyle='rgba(0,0,0,0.5)';b.fillRect(x,y+TILE-6,TILE,6);
      b.fillStyle='#4d5f92';b.fillRect(x,y+TILE,TILE,4);
      b.fillStyle='rgba(255,255,255,0.22)';b.fillRect(x,y+TILE,TILE,1);
    }
    if(!isPath(p[0]-1,p[1])){
      b.fillStyle='#51639b';b.fillRect(x-4,y,4,TILE);
      b.fillStyle='rgba(255,255,255,0.18)';b.fillRect(x-4,y,1,TILE);
      b.fillStyle='rgba(20,26,54,0.85)';b.fillRect(x,y,4,TILE);
    }
    if(!isPath(p[0]+1,p[1])){
      b.fillStyle='rgba(0,0,0,0.42)';b.fillRect(x+TILE-4,y,4,TILE);
      b.fillStyle='#465888';b.fillRect(x+TILE,y,4,TILE);
      b.fillStyle='rgba(255,255,255,0.18)';b.fillRect(x+TILE+3,y,1,TILE);
    }
  });
  /* isometric-feeling top-light sheen across the whole board */
  var sg=b.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'rgba(160,175,255,0.10)');
  sg.addColorStop(0.38,'rgba(160,175,255,0)');
  sg.addColorStop(1,'rgba(0,0,0,0.24)');
  b.fillStyle=sg;b.fillRect(0,0,W,H);
}
function getVig(){
  if(!vigGrad){
    vigGrad=cx.createRadialGradient(W/2,H*0.44,H*0.42,W/2,H*0.5,W*0.72);
    vigGrad.addColorStop(0,'rgba(0,0,0,0)');
    vigGrad.addColorStop(0.7,'rgba(0,0,0,0.13)');
    vigGrad.addColorStop(1,'rgba(0,0,0,0.4)');
  }
  return vigGrad;
}
function towerGrad(type,r){
  var k=type+'_'+r,g=towerGrads[k];
  if(!g){
    var col=towerTypes[type].col;
    g=cx.createLinearGradient(0,-r,0,r);
    g.addColorStop(0,shade(col,1.5));
    g.addColorStop(0.55,col);
    g.addColorStop(1,shade(col,0.5));
    towerGrads[k]=g;
  }
  return g;
}
var towerSideGrads={};
function towerSideGrad(type,r){
  var k=type+'_'+r,g=towerSideGrads[k];
  if(!g){
    var col=towerTypes[type].col;
    g=cx.createLinearGradient(-r,0,r,0);
    g.addColorStop(0,shade(col,0.55));
    g.addColorStop(0.28,shade(col,0.95));
    g.addColorStop(0.55,shade(col,0.6));
    g.addColorStop(1,shade(col,0.3));
    towerSideGrads[k]=g;
  }
  return g;
}
function enemyGrad(type){
  var g=enemyGrads[type];
  if(!g){
    var col=enemyCols[type]||'#ef4444',r=enemyR[type]||10;
    g=cx.createRadialGradient(-r*0.35,-r*0.45,r*0.15,0,0,r*1.2);
    g.addColorStop(0,shade(col,1.6));
    g.addColorStop(0.55,col);
    g.addColorStop(1,shade(col,0.45));
    enemyGrads[type]=g;
  }
  return g;
}
function glowGrad(key,col,r){
  var g=glowGrads[key];
  if(!g){
    var c=hexRgb(col);
    g=cx.createRadialGradient(0,0,r*0.15,0,0,r);
    g.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+',0.35)');
    g.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    glowGrads[key]=g;
  }
  return g;
}
function drawField(){
  if(!boardCv)buildBoard();
  cx.drawImage(boardCv,0,0);
  var phase=Math.floor(frame/9)%4;
  for(var k=phase;k<pathData.length-1;k+=4){
    var a=pathData[k],b=pathData[k+1],ix=b[0]-a[0],iy=b[1]-a[1];
    if(ix===0&&iy===0)continue;
    var ang=Math.atan2(iy,ix);
    cx.save();
    cx.translate(a[0]*TILE+TILE/2,a[1]*TILE+TILE/2);
    cx.rotate(ang);
    cx.fillStyle='rgba(34,211,238,0.22)';
    cx.beginPath();cx.moveTo(6,0);cx.lineTo(-4,-4);cx.lineTo(-4,4);cx.closePath();cx.fill();
    cx.restore();
  }
  cx.font='bold 12px system-ui';
  cx.textAlign='center';
  var s=pathData[0];
  cx.fillStyle='rgba(52,211,153,0.12)';
  cx.beginPath();cx.arc(s[0]*TILE+TILE/2,s[1]*TILE+TILE/2,14,0,6.283);cx.fill();
  cx.fillStyle='rgba(52,211,153,0.3)';
  cx.beginPath();cx.arc(s[0]*TILE+TILE/2,s[1]*TILE+TILE/2,10,0,6.283);cx.fill();

  cx.fillStyle='rgba(239,68,68,0.3)';

function drawTowers(){
  /* painter's order: back rows first so taller front prisms overlap correctly */
  towers.slice().sort(function(a,b){return a.y-b.y;}).forEach(function(tw){
    var t=towerTypes[tw.type],l=tw.level,r=8+l,hgt=8+4*l,ty=tw.y+2-hgt;
    /* soft ground shadow (offset toward lower-right, light from top-left) */
    cx.fillStyle='rgba(0,0,0,0.42)';
    cx.beginPath();cx.ellipse(tw.x+2,tw.y+3,r+4,(r+4)*0.42,0,0,6.283);cx.fill();
    /* dark base plinth */
    cx.fillStyle='#0b1122';
    cx.beginPath();cx.ellipse(tw.x,tw.y+3,r+2.5,(r+2.5)*0.5,0,0,6.283);cx.fill();
    cx.fillStyle='#182241';
    cx.beginPath();cx.ellipse(tw.x,tw.y+2,r+1.5,(r+1.5)*0.48,0,0,6.283);cx.fill();
    if(l>=3){
      cx.globalAlpha=0.35;
      cx.strokeStyle=t.col;
      cx.lineWidth=3;
      cx.beginPath();cx.ellipse(tw.x,tw.y+2,r+5,(r+5)*0.5,0,0,6.283);cx.stroke();
      cx.globalAlpha=1;
    }
    /* extruded prism: shaded side wall (taller with level) + rounded foot + lit top face */
    cx.save();
    cx.translate(tw.x,0);
    cx.fillStyle=towerSideGrad(tw.type,r);
    cx.beginPath();
    cx.moveTo(-r,ty);
    cx.lineTo(-r,tw.y+2);
    cx.ellipse(0,tw.y+2,r,r*0.45,0,Math.PI,0,true);
    cx.lineTo(r,ty);
    cx.closePath();cx.fill();
    cx.strokeStyle='rgba(0,0,0,0.4)';
    cx.lineWidth=1;
    cx.beginPath();cx.moveTo(-r,ty);cx.lineTo(-r,tw.y+2);cx.moveTo(r,ty);cx.lineTo(r,tw.y+2);cx.stroke();
    cx.translate(0,ty);
    cx.fillStyle=towerGrad(tw.type,r);
    cx.beginPath();cx.ellipse(0,0,r,r*0.62,0,0,6.283);cx.fill();
    cx.strokeStyle='rgba(0,0,0,0.35)';
    cx.lineWidth=1;
    cx.beginPath();cx.ellipse(0,0,r,r*0.62,0,0,6.283);cx.stroke();
    cx.fillStyle='rgba(255,255,255,0.3)';
    cx.beginPath();cx.ellipse(-r*0.25,-r*0.22,r*0.5,r*0.2,-0.4,0,6.283);cx.fill();
    cx.restore();
    /* barrel mounted on the top face */
    var bx=tw.x+(r+6)*Math.cos(tw.angle),by=ty+(r+6)*0.62*Math.sin(tw.angle);
    cx.strokeStyle='rgba(0,0,0,0.4)';
    cx.lineWidth=4.5+0.4*l;
    cx.beginPath();cx.moveTo(tw.x,ty+1);cx.lineTo(bx,by+1);cx.stroke();
    cx.strokeStyle=t.col;
    cx.lineWidth=3+0.4*l;
    cx.beginPath();cx.moveTo(tw.x,ty);cx.lineTo(bx,by);cx.stroke();
    if(tw.flash>0){
      cx.globalAlpha=tw.flash/4;
      cx.fillStyle='#fff';
      cx.beginPath();cx.arc(bx,by,3.5,0,6.283);cx.fill();
      cx.globalAlpha=1;
    }
    cx.font='10px system-ui';
    cx.textAlign='center';
    cx.fillStyle='#fff';
    cx.fillText(towerIcons[tw.type]||'❓',tw.x,ty+4);
    for(var p=0;p<l-1;p++){
      cx.fillStyle='#facc15';
      cx.beginPath();cx.arc(tw.x-7+p*4,ty-r*0.62-5,1.6,0,6.283);cx.fill();
    }
    if(l>=5){cx.fillStyle='#facc15';cx.font='9px system-ui';cx.fillText('★',tw.x,ty-r*0.62-9);}
    if(tw===selectedTower){
      cx.strokeStyle='#22d3ee';
      cx.lineWidth=1.5;
      cx.setLineDash([4,4]);
      cx.beginPath();cx.arc(tw.x,tw.y,towerTypes[tw.type].range+10*l,0,6.283);cx.stroke();
      cx.setLineDash([]);
      cx.strokeStyle='#22d3ee';
      cx.lineWidth=2;
      cx.beginPath();cx.ellipse(tw.x,ty,r+4,(r+4)*0.62,0,0,6.283);cx.stroke();
    }
  });
}
function drawEnemies(){
  enemies.forEach(function(e){
    if(!e.alive)return;
    var r=enemyR[e.type]||10,isBoss=e.type==='boss',
        sq=1+Math.sin(e.wob)*0.16,
        bob=Math.max(0,-Math.sin(e.wob))*(isBoss?2.5:4),
        grounded=1-bob/(isBoss?3:4.5),
        shr=(isBoss?r+5:r)*(0.75+0.35*grounded);
    /* strong contact shadow that tightens + fades as the enemy hops */
    cx.fillStyle='rgba(0,0,0,'+((isBoss?0.52:0.44)*(0.5+0.5*grounded)).toFixed(2)+')';
    cx.beginPath();cx.ellipse(e.x+1,e.y+r+2,shr,shr*0.32,0,0,6.283);cx.fill();
    cx.save();
    cx.translate(0,-bob);
    cx.save();
    cx.translate(e.x,e.y);
    if(isBoss){
      cx.fillStyle=glowGrad('boss','#dc2626',r*2.6);
      cx.beginPath();cx.arc(0,0,r*2.6,0,6.283);cx.fill();
    }
    /* shaded body: radial gradient, light from top-left */
    cx.fillStyle=enemyGrad(e.type);
    cx.beginPath();cx.ellipse(0,0,r*sq,r/sq,0,0,6.283);cx.fill();
    cx.strokeStyle='rgba(0,0,0,0.3)';
    cx.lineWidth=1;
    cx.beginPath();cx.ellipse(0,0,r*sq,r/sq,0,0,6.283);cx.stroke();
    cx.restore();
    if(e.type==='boss'){
      cx.fillStyle='#7f1d1d';
      cx.beginPath();cx.moveTo(e.x-r+2,e.y-r+4);cx.lineTo(e.x-r-4,e.y-r-6);cx.lineTo(e.x-r+8,e.y-r+1);cx.closePath();cx.fill();
      cx.beginPath();cx.moveTo(e.x+r-2,e.y-r+4);cx.lineTo(e.x+r+4,e.y-r-6);cx.lineTo(e.x+r-8,e.y-r+1);cx.closePath();cx.fill();
    }
    cx.fillStyle='#fff';

    cx.beginPath();cx.arc(e.x+3,e.y-2,3,0,6.283);cx.fill();
    cx.fillStyle='#000';
    cx.beginPath();cx.arc(e.x-2,e.y-1,1.5,0,6.283);cx.fill();
    cx.beginPath();cx.arc(e.x+4,e.y-1,1.5,0,6.283);cx.fill();
    var bw=2*r;
    cx.fillStyle='#1e293b';

    cx.fillStyle=e.hp/e.maxHp>0.5?'#34d399':'#ef4444';
    cx.fillRect(e.x-bw/2,e.y-r-7,bw*Math.max(0,e.hp/e.maxHp),3);
    if(e.slow>0){
      cx.strokeStyle='#67e8f9';
      cx.lineWidth=1;
      cx.beginPath();cx.arc(e.x,e.y,r+3,0,6.283);cx.stroke();
    }
    if(e.poison>0){
      cx.strokeStyle='rgba(16,185,129,0.5)';
      cx.lineWidth=1;
      cx.beginPath();cx.arc(e.x,e.y,r+5,0,6.283);cx.stroke();
    }
    if(e.type==='healer'){

      cx.setLineDash([]);

    }

  });
}

  cx.fillStyle='#67e8f9';
  var buffs='';
  if(towerBoost>0)buffs+='  ⚔️'+Math.ceil(towerBoost/60)+'s';
  if(goldRush>0)buffs+='  💰x3 '+Math.ceil(goldRush/60)+'s';
  if(gameSpeed>1)buffs+='  ⏩'+gameSpeed+'x';
  cx.fillText('BEST '+hi+buffs,18,60);
  cx.fillStyle='rgba(2,6,23,0.6)';
  rrect(W-104,8,96,20,6);cx.fill();
  cx.fillStyle='#a5b4fc';
  cx.font='bold 10px system-ui';
  cx.textAlign='center';
  cx.fillText('MAP: '+mapNames[currentMap],W-56,21);
  if(combo>1){
    var a=Math.min(1,comboTimer/15);
    cx.textAlign='center';
    cx.fillStyle=combo>=20?'rgba(239,68,68,'+a+')':combo>=10?'rgba(168,85,247,'+a+')':'rgba(34,211,238,'+a+')';
    cx.font='bold '+Math.min(14+combo,34)+'px system-ui';
    cx.fillText('x'+combo+' COMBO'+(combo>=10?' 🔥':'')+(combo>=20?' 💀':''),W/2,66);
  }
  var bosses=enemies.filter(function(e){return e.alive&&e.type==='boss';});
  if(bosses.length){
    var hp=0,mx=0;
    bosses.forEach(function(b){hp+=b.hp;mx+=b.maxHp;});
    var bw=300,bx=W/2-bw/2,py=H-38;
    cx.fillStyle='rgba(2,6,23,0.72)';
    rrect(bx-8,py,bw+16,30,6);cx.fill();
    cx.fillStyle='#fecaca';
    cx.font='bold 9px system-ui';
    cx.textAlign='center';
    cx.fillText('👹 BOSS '+Math.ceil(hp)+' / '+Math.ceil(mx),W/2,py+11);
    cx.fillStyle='#1e293b';
    cx.fillRect(bx,py+16,bw,8);
    cx.fillStyle='#dc2626';
    cx.fillRect(bx,py+16,bw*Math.max(0,hp/mx),8);
    cx.fillStyle='rgba(255,255,255,0.25)';
    cx.fillRect(bx,py+16,bw*Math.max(0,hp/mx),3);
  }
  notifications.forEach(function(n,i){
    cx.globalAlpha=Math.min(1,n.life/12);
    cx.fillStyle=n.color;
    cx.font='bold 13px system-ui';
    cx.textAlign='center';
    cx.fillText(n.text,W/2,H/2-58-20*i-0.3*(n.ml-n.life));
  });
  cx.globalAlpha=1;
}
function drawBanner(){
  bannerRect=null;
  if(st!=='play'||wave>=50)return;
  if(spawnQueue.length>0||enemies.some(function(e){return e.alive;}))return;
  var nw=wave+1,c=compForWave(nw),parts=[];
  ['boss','tank','shield','healer','normal','fast','swarm'].forEach(function(k){
    if(c[k])parts.push(enemyIcons[k]+'×'+c[k]);
  });
  var bw=290,bx=W/2-bw/2,by=H/2-44,isB=nw%10===0;
  cx.fillStyle='rgba(2,6,23,0.8)';
  rrect(bx,by,bw,88,10);cx.fill();
  cx.strokeStyle=isB?'rgba(239,68,68,0.6)':'rgba(34,211,238,0.4)';
  cx.lineWidth=1;
  rrect(bx,by,bw,88,10);cx.stroke();
  cx.textAlign='center';
  cx.fillStyle=isB?'#f87171':'#67e8f9';
  cx.font='bold 15px system-ui';
  cx.fillText(isB?'⚠️ NEXT: BOSS WAVE '+nw:'NEXT WAVE '+nw,W/2,by+24);
  cx.fillStyle='#e2e8f0';
  cx.font='12px system-ui';
  cx.fillText(parts.join('  '),W/2,by+47);
  cx.fillStyle='#94a3b8';
  cx.font='10px system-ui';
  cx.fillText('あと '+Math.max(1,Math.ceil(waveTimer/60))+'秒 — タップ / Nキーで即開始 (+'+(10+wave)+'G)',W/2,by+70);
  bannerRect={x:bx,y:by,w:bw,h:88};
}
function draw(){
  cx.save();
  if(shakeT>0){
    shakeT--;
    var m=shakeMag*(shakeT/16+0.2);
    cx.translate((Math.random()-0.5)*m*2,(Math.random()-0.5)*m*2);
    if(shakeT===0)shakeMag=0;
  }
  drawField();
  drawTowers();
  drawEnemies();
  drawBullets();
  drawFx();
  cx.restore();
  cx.fillStyle=getVig();
  cx.fillRect(0,0,W,H);
  if(redFlash>0){
    redFlash--;
    cx.fillStyle='rgba(239,68,68,'+(0.28*redFlash/20)+')';
    cx.fillRect(0,0,W,H);
  }
  if(st==='play'){
    drawHUD();
    drawBanner();
    if(paused){
      cx.fillStyle='rgba(2,6,23,0.62)';
      cx.fillRect(0,0,W,H);
      cx.textAlign='center';
      cx.fillStyle='#e2e8f0';
      cx.font='bold 26px system-ui';
      cx.fillText('⏸ PAUSED',W/2,H/2-6);
      cx.fillStyle='#94a3b8';
      cx.font='12px system-ui';
      cx.fillText('P / ESC / ボタンで再開',W/2,H/2+20);
    }
  }
}

/* ================= GAME FLOW ================= */
function startGame(){
  document.getElementById('ss').style.display='none';
  document.getElementById('gs').style.display='none';
  document.getElementById('nm').style.display='none';
  document.getElementById('goTitle').textContent='GAME OVER';
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  startBGM();
  st='play';paused=false;
  wave=0;lives=20;gold=220;score=0;frame=0;
  enemies=[];towers=[];bullets=[];particles=[];texts=[];notifications=[];spawnQueue=[];
  waveTimer=150;waveCleared=true;selectedTower=null;
  combo=0;comboTimer=0;freezeF=0;totalKills=0;achievements={};
  shakeT=0;shakeMag=0;redFlash=0;towerBoost=0;goldRush=0;bannerRect=null;
  var pb=document.getElementById('pauseBtn');
  if(pb)pb.textContent='⏸ 一時停止';
  loadMap(chosenMap);
  updateTowerUI();
}
function finalScore(){return score+100*wave+Math.floor(gold/2);}
function endScreen(title){
  stopBGM();
  score=finalScore();
  if(score>hi){hi=score;localStorage.setItem('tdHi',String(hi));}
  document.getElementById('goTitle').textContent=title;
  document.getElementById('fs').textContent='Score: '+score.toLocaleString();
  document.getElementById('gstat').textContent='到達 WAVE '+wave+' · 撃破 '+totalKills+'体';
  document.getElementById('hs').textContent='BEST: '+hi.toLocaleString();
  if(isT(score)&&score>0){
    pS=score;
    document.getElementById('ni').value='';
    document.getElementById('nm').style.display='flex';
    setTimeout(function(){document.getElementById('ni').focus();},100);
  }else{
    document.getElementById('gs').style.display='flex';
    rR();
  }
}
function gameOver(){
  if(st!=='play')return;
  st='over';
  sfxOver();
  shake(10,28);
  endScreen('GAME OVER');
}
function winGame(){
  st='clear';
  sfxUpgrade();sfxCoin();
  endScreen('🎉 ALL CLEAR!');
}
function togglePause(){
  if(st!=='play')return;
  paused=!paused;
  var b=document.getElementById('pauseBtn');
  if(b)b.textContent=paused?'▶ 再開':'⏸ 一時停止';
}
function toggleSpeed(){
  gameSpeed=gameSpeed===1?2:gameSpeed===2?3:1;
  var b=document.getElementById('ffBtn');
  if(b){b.textContent='⏩ '+gameSpeed+'x';b.style.borderColor=gameSpeed>1?'#22d3ee':'';b.style.color=gameSpeed>1?'#22d3ee':'';}
  if(st==='play')noti('⏩ Speed '+gameSpeed+'x',gameSpeed===1?'#94a3b8':'#facc15');
}

/* ================= INPUT ================= */
cv.addEventListener('pointerdown',function(ev){
  ev.preventDefault();
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  if(st!=='play'||paused)return;
  var r=cv.getBoundingClientRect(),
      x=(ev.clientX-r.left)*cv.width/r.width,
      y=(ev.clientY-r.top)*cv.height/r.height;
  if(bannerRect&&x>=bannerRect.x&&x<=bannerRect.x+bannerRect.w&&y>=bannerRect.y&&y<=bannerRect.y+bannerRect.h){
    callEarly();
    return;
  }
  var gx=Math.floor(x/TILE),gy=Math.floor(y/TILE);
  if(gx<0||gx>=COLS||gy<0||gy>=ROWS)return;
  var twr=towers.find(function(t){return t.gx===gx&&t.gy===gy;});
  if(twr){
    if(twr===selectedTower)upgradeTower();
    else selectedTower=twr;
    updateTowerUI();
    return;
  }
  selectedTower=null;
  updateTowerUI();
  if(isPath(gx,gy)){
    addText(gx*TILE+TILE/2,gy*TILE+TILE/2,'✕','#f87171',13);
    return;
  }
  var t=towerTypes[selType];
  if(gold<t.cost){
    noti('💰 ゴールド不足','#f87171');
    return;
  }
  gold-=t.cost;
  sfxPlace();
  towers.push({gx:gx,gy:gy,x:gx*TILE+TILE/2,y:gy*TILE+TILE/2,type:selType,cooldown:0,angle:0,level:1,flash:0});
  ringFx(gx*TILE+TILE/2,gy*TILE+TILE/2,24,t.col);
  updateTowerUI();
});
window.addEventListener('keydown',function(e){
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  var k=e.key;
  if(k==='p'||k==='P'||k==='Escape'){togglePause();e.preventDefault();return;}
  if(k==='f'||k==='F'){toggleSpeed();e.preventDefault();return;}
  if(k==='m'||k==='M'){toggleMute();return;}
  if(k==='n'||k==='N'||k===' '){
    if(canEarly()){callEarly();e.preventDefault();}
    return;
  }
  if(k==='u'||k==='U'){upgradeTower();return;}
  if(k>='1'&&k<='7')selectType(parseInt(k,10)-1);
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&st==='play'&&!paused)togglePause();
});

/* ================= RANKING (localStorage) ================= */
function gR(){try{return JSON.parse(localStorage.getItem('tdRk')||'[]');}catch(e){return [];}}
function sR(l){localStorage.setItem('tdRk',JSON.stringify(l.slice(0,10)));}
function isT(s){var l=gR();return l.length<10||s>l[l.length-1].score;}
function subN(){
  var n=(document.getElementById('ni').value||'').trim()||'Anonymous';
  document.getElementById('nm').style.display='none';
  var l=gR();
  l.push({name:n,score:pS});
  l.sort(function(a,b){return b.score-a.score;});
  sR(l.slice(0,10));
  rR(pS);
  document.getElementById('gs').style.display='flex';
}
function rR(nw){
  var l=gR(),el=document.getElementById('rl');
  if(l.length){
    el.innerHTML=l.map(function(t,i){
      var r=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
      return '<li class="rp-i '+(nw&&t.score===nw?'nw':'')+'"><span class="rp-r">'+r+'</span><span class="rp-n">'+String(t.name).replace(/[<>&]/g,'')+'</span><span class="rp-s">'+t.score.toLocaleString()+'</span></li>';
    }).join('');
  }else{
    el.innerHTML='<li class="rp-i"><span class="rp-r">-</span><span class="rp-n">記録なし</span><span class="rp-s"></span></li>';
  }
}

/* ================= LOOP / BOOT ================= */
function loop(){
  for(var i=0;i<gameSpeed;i++)update();
  draw();
  requestAnimationFrame(loop);
}
function resize(){
  var mh=window.innerHeight-200,mw=Math.min(window.innerWidth-24,1100),ar=W/H,h=mh,w=h*ar;
  if(w>mw){w=mw;h=w/ar;}
  cv.style.width=w+'px';
  cv.style.height=h+'px';
}
window.addEventListener('resize',resize);
var ni=document.getElementById('ni');
ni.addEventListener('keydown',function(e){if(e.key==='Enter')subN();});
(function boot(){
  var mb=document.getElementById('muteBtn');
  if(mb)mb.textContent=muted?'🔇 OFF':'🔊 ON';
  loadMap(0);
  drawMapPreview();
  rR();
  resize();
  loop();
})();
</script>
